<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 Payment — CSC Print Cafe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;justify-content:center;padding:16px}
.card{max-width:420px;width:100%;align-self:flex-start;margin-top:10px}
.head{text-align:center;padding:8px 0 14px;border-bottom:2px solid #d4af37;margin-bottom:16px}
.head h1{color:#f6e27a;font-size:20px}
.head p{color:#94a3b8;font-size:12px;margin-top:2px}
.amtbox{background:#1e293b;border:2px dashed #d4af37;border-radius:14px;padding:16px;text-align:center;margin-bottom:16px}
.amtbox .oid{color:#94a3b8;font-size:12px}
.amtbox .amt{color:#4ade80;font-size:38px;font-weight:800;margin-top:4px}
.qrwrap{background:#ffffff;border-radius:14px;padding:16px;display:flex;justify-content:center;margin-bottom:14px}
.qrwrap img,.qrwrap canvas{border-radius:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px;text-decoration:none}
.upi{background:#25d366;color:#062c16}
.copy{background:#1e293b;color:#e2e8f0;border:1.5px solid #334155}
.done{background:#d4af37;color:#0f172a}
.upiid{text-align:center;color:#94a3b8;font-size:12.5px;margin-bottom:14px}
.upiid b{color:#f6e27a}
.note{text-align:center;color:#64748b;font-size:11px;margin-top:10px;line-height:1.6}
</style></head><body><div class="card">
<div class="head"><h1>💰 Payment — CSC Print Cafe</h1><p>Order approve हो गया है — बस pay करो!</p></div>
<div class="amtbox"><div class="oid">Order <b id="oid">—</b></div><div class="amt" id="amt">₹0</div></div>
<div class="qrwrap" id="qr"></div>
<div class="upiid">UPI ID: <b id="upiTxt"></b> • कोई भी UPI app चलेगा</div>
<a class="btn upi" id="upiBtn" href="#">📲 UPI app से Pay करो (1-tap)</a>
<button class="btn copy" id="copyBtn">📋 UPI ID Copy करो</button>
<a class="btn done" id="doneBtn" href="#">✅ Pay कर दिया — दुकान को बताएं</a>
<div class="note">Pay करते ही print शुरू! 🖨️<br>Screenshot भेजें तो और तेज़ confirm • संस्कृति Print Kiosk 🤝</div>
</div>
<script>
/* ===== CONFIG ===== */
const PAY={upi:'paytm.s261vka@pty', name:'CSC Print Cafe', wa:'919873152325'};
const P=new URLSearchParams(location.search);
const AMT=parseFloat(P.get('amt'))||0, OID=P.get('oid')||'';
document.getElementById('oid').textContent=OID?'#'+OID:'';
document.getElementById('amt').textContent='₹'+AMT;
document.getElementById('upiTxt').textContent=PAY.upi;
const upiUrl='upi://pay?pa='+PAY.upi+'&pn='+encodeURIComponent(PAY.name)+'&am='+AMT+'&cu=INR'+(OID?'&tn='+encodeURIComponent('Order '+OID):'');
document.getElementById('upiBtn').href=upiUrl;
if(window.QRCode){new QRCode(document.getElementById('qr'),{text:upiUrl,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});}
document.getElementById('copyBtn').onclick=()=>{
  navigator.clipboard&&navigator.clipboard.writeText(PAY.upi);
  document.getElementById('copyBtn').textContent='✅ Copy हो गया!';
  setTimeout(()=>document.getElementById('copyBtn').textContent='📋 UPI ID Copy करो',2000);
};
const doneMsg='💰 Payment कर दी! ₹'+AMT+(OID?' — Order #'+OID:'')+'\n(सूचना: payment screenshot भी भेज दूँगा/दूँगी)';
document.getElementById('doneBtn').href='https://wa.me/'+PAY.wa+'?text='+encodeURIComponent(doneMsg);
</script></body></html>
