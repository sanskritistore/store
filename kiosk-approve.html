<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛠️ Order Approve — CSC Print Cafe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center}
h1{color:#f6e27a;font-size:19px;margin-bottom:4px}
.sub{color:#94a3b8;font-size:12px;margin-bottom:16px}
.order{background:#0f172a;border:1.5px dashed #d4af37;border-radius:12px;padding:14px;margin-bottom:16px}
.order .oid{color:#f6e27a;font-weight:800;font-size:17px}
.order .amt{color:#4ade80;font-weight:800;font-size:26px;margin-top:6px}
.order .lbl{color:#94a3b8;font-size:11px;margin-top:2px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:10px}
.ok{background:#25d366;color:#062c16}
.no{background:#3f1d1d;color:#f87171;border:1.5px solid #f87171}
.warn{color:#fbbf24;font-size:12px;margin-top:12px}
.note{text-align:center;color:#64748b;font-size:11px;margin-top:14px}
</style></head><body><div class="card">
<h1>🛠️ Order Approve करें</h1>
<div class="sub">यह page सिर्फ़ दुकान के लिए है 🔒</div>
<div class="order">
  <div class="lbl">Order ID</div><div class="oid" id="oid">—</div>
  <div class="amt" id="amt">₹0</div>
  <div class="lbl">Customer को भेजने वाली price — चाहें तो बदलें:</div>
  <input id="amtIn" type="number" min="0" step="0.5" style="margin-top:6px;background:#1e293b;border:1.5px solid #334155;border-radius:8px;color:#f6e27a;padding:8px 12px;font-size:16px;width:140px;text-align:center;outline:none">
</div>
<button class="btn ok" id="btnOk">✅ Approve — Customer को भेजें</button>
<button class="btn no" id="btnNo">❌ रद्द — Customer को बताएं</button>
<div class="warn">Approve दबाते ही WhatsApp खुलेगा — बस Send दबाना है!</div>
<div class="note">संस्कृति Print Kiosk 🤝</div>
</div>
<script>
/* ===== CONFIG ===== */
const APP={shop:'CSC Print Cafe', upi:'9873152325@ptyes'};
const P=new URLSearchParams(location.search);
const OID=P.get('id')||'—', AMT=parseFloat(P.get('amt'))||0, TO=(P.get('to')||'').replace(/[^0-9]/g,'');
document.getElementById('oid').textContent='#'+OID;
document.getElementById('amt').textContent='₹'+AMT;
document.getElementById('amtIn').value=AMT;
document.getElementById('amtIn').oninput=e=>{document.getElementById('amt').textContent='₹'+(parseFloat(e.target.value)||0);};
function go(txt){
  const amt=parseFloat(document.getElementById('amtIn').value)||0;
  const msg=txt.replace('{OID}',OID).replace('{AMT}',amt).replace('{UPI}',APP.upi).replace('{PAYLINK}','https://sanskritistore.github.io/store/kiosk-pay.html?amt='+amt+'&oid='+OID);
  if(!TO){alert('Customer number नहीं मिला — WhatsApp में हाथ से जवाब दें');return;}
  window.open('https://wa.me/'+TO+'?text='+encodeURIComponent(msg),'_blank');
}
document.getElementById('btnOk').onclick=()=>go('✅ आपका Order #{OID} Approved! Price ₹{AMT}.\n👉 Pay करें (1-tap): {PAYLINK}\n(UPI: {UPI})');
document.getElementById('btnNo').onclick=()=>go('❌ माफ़ कीजिए — आपका Order #{OID} अभी print नहीं हो पाएगा। कृपया दुकान पर पूछें। 🙏');
</script></body></html>
