<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8E2A32">
<title>संस्कृति — 📚 फोटो एल्बम</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/store.css?v=13"></head><body>
<header id="hd"></header>
<section class="sec wrap">
 <h2>📚 फोटो एल्बम</h2><p class="sub">जो design दिखेगा, वही छपकर मिलेगा ✓ Design चुनें → अपनी photos डालें → ✨ AI खुद album बना देगा</p>
 <div class="flt" id="flts">
  <button class="chip on" data-f="all">सभी</button>
  <button class="chip" data-f="wedding">शादी 💍</button>
  <button class="chip" data-f="royal">रॉयल 👑</button>
  <button class="chip" data-f="modern">मॉडर्न ✨</button>
 </div>
 <div class="grid" id="list"></div>
 <p class="sub" style="margin-top:18px;text-align:center">💡 Album चुनने के बाद अपने फ़ोन से photos डालिए — AI हर photo को सही जगह खुद लगा देगा।<br>नाम-तारीख बदल सकते हैं, फिर WhatsApp पर order हो जाएगा।</p>
</section>
<footer id="ft"></footer>
<style>
.abwall{position:relative;border-radius:11px 11px 0 0;overflow:hidden;aspect-ratio:3/2;background:#241A13}
.abwall img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.fcard:hover .abwall img{transform:scale(1.05)}
.abplay{position:absolute;right:6px;bottom:6px;background:#fffdf8f0;border:1.5px solid #E3D7C3;border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:700;color:#8E2A32}
</style>
<script src="assets/js/store.js?v=27"></script>
<script>(async()=>{await loadCfg();shell('album');
 const A=await fetch('config/albums.json?v='+Date.now()).then(r=>r.json()).catch(()=>({albums:[]}));
 function card(a){
  return `<a class="fcard card" href="album-builder.html?tpl=${a.tpl}">
   <div class="abwall"><img src="${a.img}" alt="${a.name}" loading="lazy"><span class="abplay">✨ AI बनाएगा</span></div>
   <span class="fcode">${a.code}</span>
   <h4>${a.name}</h4><div class="rt">⭐ ${a.rating} • ${a.en}</div>
   <div class="from">${fmt(a.base)} से शुरू</div>
   <span class="btn btn-p">अभी बनाएं</span></a>`}
 function render(flt){
  const as=A.albums.filter(a=>flt==='all'||a.cat===flt);
  $('#list').innerHTML=as.map(card).join('');}
 render('all');
 $$('#flts .chip').forEach(c=>c.onclick=()=>{$$('#flts .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');render(c.dataset.f)});
})()</script>
</body></html>
