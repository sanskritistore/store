<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8E2A32">
<title>संस्कृति — फोटो फ्रेम चुनें</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/store.css"></head><body>
<header id="hd"></header>
<section class="sec wrap">
 <h2>अपना फ्रेम चुनें</h2><p class="sub">जो फ्रेम पसंद आए उस पर click करें → अपनी फोटो लगाकर देखें 📸</p>
 <div class="flt" id="flts">
  <button class="chip on" data-f="all">सभी</button>
  <button class="chip" data-f="rect">चौकोर</button>
  <button class="chip" data-f="round">गोल/ओवल</button>
  <button class="chip" data-f="heart">दिल ❤️</button>
 </div>
 <div class="grid" id="list"></div>
</section>
<footer id="ft"></footer>
<script src="assets/js/store.js"></script>
<script>(async()=>{await loadCfg();await loadCustomFrames();shell('frames');
 const grp=f=>f.shape==='heart'?'heart':(f.shape==='circle'||f.shape==='oval')?'round':'rect';
 const demos=CFG.frames.demo;
 function card(f,i){
  const d1=demos[i%demos.length],d2=demos[(i+3)%demos.length];
  if(f.draw){const winImgs=f.draw.windows.map((w,wi)=>demos[(i+wi)%demos.length]);
   return `<a class="fcard card" href="preview.html?frame=${f.id}">
   <div class="fr" style="aspect-ratio:${f.ar};${frDrawBg(f)}">${frDrawHTML(f,winImgs)}</div>
   ${f.badge?`<span class="badge">${f.badge}</span>`:''}
   <h4>${f.name}</h4><div class="rt">⭐ ${f.rating}</div>
   <div class="from">${fmt(f.base)} से शुरू</div>
   <span class="btn btn-p">अभी बनाएं</span></a>`}
  const win=f.window?`style="left:${f.window.x}%;top:${f.window.y}%;width:${f.window.w}%;height:${f.window.h}%"`:'';
  const ar=f.ar?`style="aspect-ratio:${f.ar}"`:'';
  return `<a class="fcard card" href="preview.html?frame=${f.id}">
   <div class="fr shp-${f.shape} ${f.style} ${rtClass(f.ratio)}" ${ar}>${f.img?`<img class="fr-img" src="${f.img}" alt="">`:''}<div class="fr-photo" ${win}>
    <img src="${d1}" data-a="${d1}" data-b="${d2}" alt="${f.name}">
    <div class="es" style="opacity:0"><b>📷</b>अपनी फोटो<br>यहाँ लगाएँ</div></div></div>
   ${f.badge?`<span class="badge">${f.badge}</span>`:''}
   <h4>${f.name}</h4><div class="rt">⭐ ${f.rating}</div>
   <div class="from">${fmt(f.base)} से शुरू</div>
   <span class="btn btn-p">अभी बनाएं</span></a>`}
 function render(flt){
  const fs=CFG.frames.frames.filter(f=>(!f.ptype||f.ptype==='frame')&&(flt==='all'||grp(f)===flt));
  $('#list').innerHTML=fs.map((f,i)=>card(f,i)).join('');
  $$('#list .fr-photo, #list .fr-win').forEach((ph,i)=>{
   const img=ph.querySelector('img'),es=ph.querySelector('.es');if(!img)return;let st=i%3;
   setInterval(()=>{st=(st+1)%3;
    if(st===0){img.style.opacity=0;es.style.opacity=1}
    else{es.style.opacity=0;img.style.opacity=1;img.src=st===1?img.dataset.a:img.dataset.b}
   },2400+i*350);
  });
 }
 render('all');
 $$('#flts .chip').forEach(c=>c.onclick=()=>{$$('#flts .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');render(c.dataset.f)});
})();</script></body></html>
