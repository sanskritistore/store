<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Nirmala UI',system-ui,sans-serif;background:#17191d;color:#e8eaf0;display:flex;flex-direction:column}
#topbar{background:#23272f;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid #ff9933}
#topbar h1{font-size:17px;color:#ff9933;font-weight:700}
.badge{font-size:11px;background:#1a7f37;color:#fff;padding:3px 9px;border-radius:20px}
.tbtn{background:#2d333d;border:1px solid #4a5261;color:#e8eaf0;padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.tbtn:hover{background:#3a4250}
.tbtn.gold{background:#c2410c;border-color:#c2410c;color:#fff;font-weight:700}
#main{flex:1;display:flex;overflow:hidden}
#side{width:330px;min-width:330px;background:#1e2128;border-right:1px solid #333;overflow-y:auto;padding:10px}
#stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:18px;background:#101216}
#cv{box-shadow:0 4px 30px rgba(0,0,0,.6);border-radius:3px;max-width:100%}
.sec{background:#23272f;border:1px solid #363c48;border-radius:10px;padding:9px;margin-bottom:9px}
.sec h3{font-size:13px;color:#ffb366;margin-bottom:7px;border-bottom:1px dashed #4a5261;padding-bottom:5px}
.frow{margin-bottom:7px}
.frow label{display:block;font-size:11.5px;color:#9aa5bb;margin-bottom:3px}
.frow input,.frow select,.frow textarea{width:100%;background:#171b21;border:1px solid #3a4150;color:#fff;padding:7px 9px;border-radius:7px;font-size:13.5px;font-family:inherit}
.frow textarea{resize:vertical;min-height:44px}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:#ff9933;outline:none}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{flex:1;min-width:90px;background:#171b21;border:2px solid #3a4150;border-radius:9px;padding:8px 4px;font-size:12px;text-align:center;cursor:pointer;color:#cfd6e4}
.tchip.on{border-color:#ff9933;background:#3a2a18;color:#ffb366;font-weight:700}
.sbtn{background:#2d333d;border:1px solid #4a5261;color:#e8eaf0;padding:7px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit}
.sbtn:hover{background:#3a4250}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#14532d;color:#dcfce7;padding:9px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@media(max-width:820px){
 #main{flex-direction:column}
 #side{width:100%;min-width:0;border-right:none;order:2;overflow:visible}
 #stage{order:1;flex:none;max-height:52vh;padding:10px}
 html,body{overflow:auto}
 body{display:block}
 #topbar{position:sticky;top:0;z-index:10}
 #main{overflow:visible}
 #stage{overflow:visible}
 #cv{max-width:100%;height:auto}
}
.frow label{display:flex;align-items:center;justify-content:space-between;gap:4px}
.fops{display:flex;gap:1px;flex:none}
.fops button{background:none;border:none;color:#5b6b8c;font-size:11px;cursor:pointer;padding:1px 3px;border-radius:4px;line-height:1.4}
.fops button:hover{color:#fbbf24;background:#1e293b}
.addf{width:100%;margin-top:6px;background:none;border:1px dashed #334155;color:#7c8db0;font-size:11.5px;padding:5px;border-radius:8px;cursor:pointer}
.addf:hover{border-color:#f59e0b;color:#fbbf24}
#gthumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gth{position:relative;width:48px;height:58px;border-radius:6px;overflow:hidden;border:1px solid #334155;flex:none}
.gth img{width:100%;height:100%;object-fit:cover;display:block}
.gth .ops{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.6)}
.gth .ops button{background:none;border:none;color:#e2e8f0;font-size:10px;cursor:pointer;padding:1px 3px}
.gth .ops button:hover{color:#fbbf24}
.sibrow{border:1px solid #2b3b5a;border-radius:8px;padding:6px;margin-bottom:6px;background:#0d1526}
.sibrow .sibtop{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px}
.sibrow select,.sibrow input{background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:12px;padding:4px 6px;width:100%;box-sizing:border-box}
.sibrow .sibtop select{width:auto;flex:1}
.sibrow input{margin-bottom:4px}
.sibrow>select:last-child{margin-bottom:0}
</style>

function trWord(w){ const itc=ITC[S.lang]; if(!itc||!/[A-Za-z]/.test(w)) return Promise.resolve(null);

async function trKeyup(e){

function drawDoc(c,sc,forExport){

    const base=Math.max(phW/im.width,phH/im.height)*pz;
    const dw=im.width*base, dh=im.height*base;
    c.drawImage(im, phX+(phW-dw)/2, phY+(phH-dh)/2, dw, dh);
  }else{
    c.fillStyle='rgba(0,0,0,0.06)'; c.fillRect(phX,phY,phW,phH);
    c.fillStyle=T.labC; c.font=SkFonts.fontFam({f:'',size:0.22},sc); c.textAlign='center';
    c.fillText('📷 फोटो', phX+phW/2, phY+phH/2);
  }
  c.restore();
  c.strokeStyle=T.gold; c.lineWidth=0.035*sc;
  if(T.pShape==='oval'){ c.beginPath(); c.ellipse(phX+phW/2,phY+phH/2,phW/2,phH/2,0,0,7); c.stroke(); }
  else{ c.strokeRect(phX,phY,phW,phH); }
  y=Math.max(y+1.0*sc, phY+phH+0.16*sc);

  y=drawSections(c,sc,X,y,W,T,fsz,2.0);
  y=drawGallery(c,sc,X,y,W,T,fsz);
  footer(c,sc,W,H,m,T);
}
/* ---- 📋 sections flow (सब layouts share) — labW = label column inches ---- */
function drawSections(c,sc,X,y,W,T,fsz,labW){
  const pack=LANGS[S.lang];
  const lim=PH*sc-0.62*sc;           /* footer से ऊपर ही रुको */
  /* dynamic label width — लंबे labels (जैसे English "Father's Occupation") टकराएँ नहीं */
  { const labS=0.22*fsz; let mx=0;
    c.font=LF(sc,labS);
    S.schema.forEach(keys=>keys.forEach(k=>{ const t=labOf(k);
      const w=c.measureText(t).width; if(w>mx) mx=w; }));
    labW=Math.max(labW, Math.min(2.9, mx/sc+0.42)); }
  S.schema.forEach((keys,si)=>{
    if(!keys.length){ if(si===1) y=drawSibs(c,sc,X,y,W,T,fsz); return; }
    if(y+0.62*sc>lim) return;        /* page भर गया → बाकी sections नहीं */
    /* section title */
    const secT=pack.sec[si];
    c.textAlign='left'; c.fillStyle=T.secC;
    c.font=SF(sc,0.30*fsz);
    c.fillText('◆ '+secT, X, y);
    c.strokeStyle=T.gold; c.lineWidth=0.014*sc;
    const tw=c.measureText('◆ '+secT).width;
    c.beginPath(); c.moveTo(X,y+0.08*sc); c.lineTo(X+tw,y+0.08*sc); c.stroke();
    y+=0.28*sc;
    /* rows */
    keys.forEach(k=>{
      const f=fldDef(k);
      let v=(S.d[k]||'').trim();
      if(!v) return;                  /* खाली field = कोई row नहीं (जगह बचे, "—" गायब) */
      if(f.sel && v){ const ix=OPTKEYS[f.sel].indexOf(v); if(ix>=0) v=pack[f.sel][ix]; }
      const lab=labOf(k), labS=0.22*fsz, valS=0.24*fsz;
      c.font=LF(sc,valS);
      const vx=X+labW*sc, vwR=W-vx-(0.28*sc);   /* value कॉलम: दायाँ किनारा तक */
      const words=(v||'—').split(/\s+/); const lines=[]; let cur='';
      words.forEach(wd=>{ const t=cur?cur+' '+wd:wd;
        if(c.measureText(t).width>vwR&&cur){ lines.push(cur); cur=wd; } else cur=t; });
      if(cur) lines.push(cur);
      lines.forEach((ln,li)=>{
        if(y+0.30*sc*fsz>lim) return;  /* footer में न घुसे */
        if(li===0){ c.fillStyle=T.labC; c.font=LF(sc,labS); c.textAlign='left'; c.fillText(lab,X,y);
          c.fillStyle=T.gold; c.textAlign='center'; c.fillText(':',X+(labW-0.22)*sc,y); }
        c.fillStyle=T.valC; c.font=LF(sc,valS); c.textAlign='left';
        c.fillText(ln,vx,y);
        y+=0.30*sc*fsz;
      });
      y+=0.03*sc;
    });
    y+=0.06*sc;
    if(si===1) y=drawSibs(c,sc,X,y,W,T,fsz);
  });
  return y;
}
/* ---- 👨‍👧 भाई-बहन TABLE render (पारिवारिक section के नीचे) ---- */
function drawSibs(c,sc,X,y,W,T,fsz){
  const rows=(S.sibs||[]).filter(sb=>(sb.n||'').trim()||(sb.d||'').trim());
  if(!rows.length) return y;
  const pack=LANGS[S.lang], rtl=!!pack.rtl;
  const lim=PH*sc-0.62*sc;
  if(y+0.62*sc>lim) return y;
  const WR=W-0.28*sc;                    /* content का दायाँ किनारा (drawSections जैसा) */
  /* title */
  c.textAlign=rtl?'right':'left'; c.fillStyle=T.secC; c.font=SF(sc,0.30*fsz);
  const t='◆ '+pack.ui.sibs;
  const tx=rtl? WR : X;
  c.fillText(t,tx,y);
  const tw=c.measureText(t).width;
  c.strokeStyle=T.gold; c.lineWidth=0.014*sc;
  c.beginPath(); c.moveTo(rtl? WR-tw:X, y+0.08*sc); c.lineTo(rtl? WR:X+tw, y+0.08*sc); c.stroke();
  y+=0.34*sc;
  /* columns: रिश्ता | नाम | विवरण | विवाहित — dynamic widths (लंबे शब्द जैसे Tamil சகோதரன் टकराएँ नहीं) */
  const hS=0.19*fsz, vS=0.21*fsz, step=(vS+0.09)*sc;
  const pad=0.1*sc, totalW=(WR-X);
  c.font=LF(sc,vS);
  const mR=Math.max(c.measureText(pack.sibR[0]).width, c.measureText(pack.sibR[1]).width);
  const mM=Math.max(c.measureText(pack.sibM[0]).width, c.measureText(pack.sibM[1]).width);
  let mN=0; rows.forEach(sb=>{ const w=c.measureText((sb.n||'').trim()||'—').width; if(w>mN) mN=w; });
  c.font=LF(sc,hS);
  const hR=c.measureText(pack.sibTH[0]).width, hN=c.measureText(pack.sibTH[1]).width,
        hD=c.measureText(pack.sibTH[2]).width, hM=c.measureText(pack.sibTH[3]).width;
  const wR=Math.max(mR,hR)+pad, wM=Math.max(mM,hM)+pad;
  /* details को पहले उसकी पूरी ज़रूरत; name को बचा हुआ (नीचे clip = कभी टकराव नहीं) */
  let wD=Math.min(Math.max(1.1*sc,hD+pad), totalW*0.45);
  let wN=totalW-wR-wM-wD-0.02*sc;
  if(wN<0.85*sc){ wN=Math.max(0.55*sc, totalW-wR-wM-0.7*sc-0.02*sc); wD=totalW-wR-wN-wM-0.02*sc; }
  const defs= rtl? [['m',wM],['d',wD],['n',wN],['r',wR]] : [['r',wR],['n',wN],['d',wD],['m',wM]];
  const thIx={r:0,n:1,d:2,m:3};
  const pos=[]; { let cx= rtl? WR : X;
    defs.forEach(([k,w])=>{ pos.push([k, rtl? cx-w : cx, w]); cx+= rtl? -w : w; }); }
  /* header */
  c.font=LF(sc,hS); c.fillStyle=T.lab;
  pos.forEach(([k,px,w])=>{ c.textAlign=rtl?'right':'left';
    c.save(); c.beginPath(); c.rect(px, y-hS*sc-0.03*sc, w, hS*sc+0.12*sc); c.clip();
    c.fillText(pack.sibTH[thIx[k]], rtl? px+w-0.03*sc : px+0.03*sc, y);
    c.restore(); });
  c.strokeStyle='rgba(180,140,60,0.6)'; c.lineWidth=0.012*sc;
  c.beginPath(); c.moveTo(X,y+0.07*sc); c.lineTo(WR,y+0.07*sc); c.stroke();
  y+=0.07*sc+step;
  /* rows */
  c.font=LF(sc,vS);
  for(const sb of rows){
    /* विवरण wrap */
    const words=(sb.d||'—').split(/\s+/); const lines=[]; let cur='';
    c.font=LF(sc,vS);
    words.forEach(wd=>{ const tt=cur?cur+' '+wd:wd;
      if(c.measureText(tt).width>wD-0.1*sc&&cur){ lines.push(cur); cur=wd; } else cur=tt; });
    if(cur) lines.push(cur);
    const rowH=Math.max(1,lines.length)*step+0.04*sc;
    if(y+rowH-step*0.5>lim) break;    /* footer से ऊपर — order में रुको */
    c.fillStyle=T.val;
    pos.forEach(([k,px,w])=>{
      let v='—';
      if(k==='r') v=pack.sibR[+sb.r||0];
      else if(k==='n') v=(sb.n||'').trim()||'—';
      else if(k==='m') v= sb.m==='y'? pack.sibM[0] : sb.m==='n'? pack.sibM[1] : '—';
      c.textAlign=rtl?'right':'left';
      const tx2= rtl? px+w-0.03*sc : px+0.03*sc;
      c.save(); c.beginPath(); c.rect(px, y-vS*sc-0.03*sc, w, lines.length*step+0.08*sc); c.clip();
      if(k==='d'){ lines.forEach((ln,li)=> c.fillText(ln,tx2,y+li*step)); }
      else c.fillText(v,tx2,y);
      c.restore();
    });
    c.strokeStyle='rgba(180,140,60,0.22)'; c.lineWidth=0.008*sc;
    const ly=y+(lines.length-1)*step+0.08*sc;
    c.beginPath(); c.moveTo(X,ly); c.lineTo(WR,ly); c.stroke();
    y=ly+step-0.02*sc;
  }
  return y+0.04*sc;
}
/* ---- 🖼️ PHOTO GALLERY (biodata के अंत में — extra photos) ---- */
function drawGallery(c,sc,X,y,W,T,fsz){
  const ph=S.photos2||[]; if(!ph.length){ S._galDrawn=0; return y; }
  S._galDrawn=0;
  const pack=LANGS[S.lang];
  const lim=PH*sc-0.62*sc;           /* footer से ऊपर तक */
  let pw=1.45*sc, ph2=1.75*sc; const gap=0.18*sc, perRow=3;
  /* जगह कम → photos छोटी (min 55%) */
  { const avail=lim-y-0.36*sc;
    if(avail < ph2+0.14*sc){ const f=Math.max(0.55, avail/(1.89*sc)); pw*=f; ph2*=f; } }
  const rowH=ph2+0.14*sc;
  if(lim-y-0.36*sc < rowH) return y;   /* एक row भी न आए → title भी नहीं */
  c.textAlign='left'; c.fillStyle=T.secC; c.font=SF(sc,0.30*fsz);
  const t='◆ '+pack.ui.gallery;
  c.fillText(t,X,y);
  c.strokeStyle=T.gold; c.lineWidth=0.014*sc;
  const tw=c.measureText(t).width;
  c.beginPath(); c.moveTo(X,y+0.08*sc); c.lineTo(X+tw,y+0.08*sc); c.stroke();
  y+=0.36*sc;
  let i=0;
  while(i<ph.length){
    if(y+ph2>lim) break;
    const rowN=Math.min(perRow, ph.length-i);
    const rowW=rowN*pw+(rowN-1)*gap;
    let px=X+((W-X)-rowW)/2;
    for(let r=0;r<rowN;r++,i++){
      const im=GIMG[ph[i]];
      c.fillStyle='#ffffff'; c.fillRect(px-0.03*sc,y-0.03*sc,pw+0.06*sc,ph2+0.06*sc);
      c.strokeStyle=T.gold; c.lineWidth=0.02*sc; c.strokeRect(px-0.03*sc,y-0.03*sc,pw+0.06*sc,ph2+0.06*sc);
      if(im){
        const ir=im.width/im.height, br=pw/ph2;
        let dw,dh; if(ir>br){ dh=ph2; dw=dh*ir; } else { dw=pw; dh=dw/ir; }
        c.save(); c.beginPath(); c.rect(px,y,pw,ph2); c.clip();
        c.drawImage(im, px+(pw-dw)/2, y+(ph2-dh)/2, dw, dh); c.restore();
      } else {
        c.fillStyle='#e5e0d5'; c.fillRect(px,y,pw,ph2);
      }
      px+=pw+gap;
    }
    y+=rowH;
  }
  S._galDrawn=i;                      /* export: बची photos → page 2 */
  return y;
}
const GIMG={};
function ensureGImgs(cb){ const list=S.photos2||[]; let pend=0;
  list.forEach(src=>{ if(GIMG[src]) return; pend++;
    const im=new Image();
    im.onload=()=>{ GIMG[src]=im; if(--pend===0&&cb)cb(); };
    im.onerror=()=>{ if(--pend===0&&cb)cb(); };
    im.src=src; });
  if(!pend&&cb) cb(); }
/* ---- 🖼️ PAGE 2: पूरी gallery अलग page पर (जब page 1 पर न आए) ---- */
function drawGalleryPage(c,sc){

  c.fillStyle=g; c.fillRect(0,0,W,H);

}

/* ---- 💎 LAYOUT: मॉडर्न साइड-पैनल (2026 latest) ---- */
function drawPanelLayout(c,sc){
  const T=TMPL[S.tmpl], W=PW*sc, H=PH*sc, fsz=S.fsz||1;
  /* bg */
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,T.bg1); g.addColorStop(1,T.bg2);

  /* header + divider + title (panel में — हर भाषा, wrap करके) */
  c.fillStyle=T.headC; c.font=HF(sc,0.22*fsz);
  if(docTxt('header')) c.fillText(docTxt('header'), m+pw/2, py+0.15*sc, pw-0.2*sc); py+=0.5*sc;
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(m+0.4*sc,py); c.lineTo(m+pw-0.4*sc,py); c.stroke(); py+=0.35*sc;
  c.fillStyle=T.headC; c.font=SF(sc,0.3*fsz);
  { const words=docTxt('title').split(/\s+/); let l1='',l2='';
    words.forEach(w=>{ if(!l2 && c.measureText((l1?l1+' ':'')+w).width<=pw-0.35*sc) l1=(l1?l1+' ':'')+w; else l2=(l2?l2+' ':'')+w; });

}
/* ---- 👑 LAYOUT: रॉयल टॉप-बैंड (2026 latest) ---- */

  /* circle photo — band के नीचे आधा overlap */
  const d=1.8*sc, pcx=W/2, pcy=m+bh;   // केंद्र band की किनारी पर

  if(S.photo){ const im=S.photo, pz=S.pz||1;
    const base=Math.max(d/im.width,d/im.height)*pz;

  c.strokeStyle=T.gold; c.lineWidth=0.05*sc;
  c.beginPath(); c.arc(pcx,pcy,d/2,0,7); c.stroke();
  c.strokeStyle=T.frame; c.lineWidth=0.015*sc;
  c.beginPath(); c.arc(pcx,pcy,d/2+0.06*sc,0,7); c.stroke();
  /* title + sections नीचे */
  let y=pcy+d/2+0.30*sc;
  c.textAlign='center'; c.fillStyle=T.secC;
  c.font=TF(sc,0.4*fsz);
  if(docTxt('title')) c.fillText(docTxt('title'), W/2, y); y+=0.15*sc;
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(W/2-1.4*sc,y+0.08*sc); c.lineTo(W/2+1.4*sc,y+0.08*sc); c.stroke();
  y+=0.24*sc;
  const X=m+0.28*sc;
  y=drawSections(c,sc,X,y,W-m*0.9,T,fsz*0.90,2.0);
  y=drawGallery(c,sc,X,y,W-m*0.9,T,fsz*0.90);
  /* बाहरी gold frame */
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.strokeRect(m+0.05*sc,m+0.05*sc,W-2*(m+0.05*sc),H-2*(m+0.05*sc));
  footer(c,sc,W,H,m,T);
}
function draw(){
  const stage=$('stage');
  const avail=Math.min(stage.clientWidth-24, 640);
  const sc=avail/PW;
  cv.width=PW*sc; cv.height=PH*sc;
  drawDoc(ctx,sc,false);
}

/* ---- 👨‍👧 भाई-बहन table (siblings) ---- */
let sibBound=false;
function buildSibs(){
  const pack=LANGS[S.lang], u=pack.ui;
  const host=$('sibRows'); host.innerHTML='';
  (S.sibs||[]).forEach((sb,i)=>{
    const d=document.createElement('div'); d.className='sibrow';
    d.innerHTML='<div class="sibtop"><select data-f="r">'
      +'<option value="0">'+pack.sibR[0]+'</option>'
      +'<option value="1">'+pack.sibR[1]+'</option></select>'
      +'<span class="fops">'
      +'<button type="button" data-g="up" data-i="'+i+'" title="ऊपर">↑</button>'
      +'<button type="button" data-g="dn" data-i="'+i+'" title="नीचे">↓</button>'
      +'<button type="button" data-g="del" data-i="'+i+'" title="हटाओ">🗑️</button></span></div>'
      +'<input data-f="n" placeholder="'+u.sibName+'">'
      +'<input data-f="d" placeholder="'+u.sibDet+'">'
      +'<select data-f="m"><option value="">'+u.sibWed+'</option>'
      +'<option value="y">'+pack.sibM[0]+'</option>'
      +'<option value="n">'+pack.sibM[1]+'</option></select>';
    d.querySelector('[data-f=r]').value=String(sb.r||0);
    d.querySelector('[data-f=n]').value=sb.n||'';
    d.querySelector('[data-f=d]').value=sb.d||'';
    d.querySelector('[data-f=m]').value=sb.m||'';
    host.appendChild(d);
  });
  if(!sibBound){ sibBound=true;
    host.addEventListener('input',e=>{
      const f=e.target.dataset.f; if(!f) return;
      const rows=[...host.children]; const i=rows.indexOf(e.target.closest('.sibrow'));
      if(i<0||!S.sibs[i]) return;
      S.sibs[i][f]=(f==='r')? +e.target.value : e.target.value;
      draw(); saveLocal(); });
    host.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      const i=+b.dataset.i, arr=S.sibs;
      if(b.dataset.g==='up'&&i>0){ const t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; }
      else if(b.dataset.g==='dn'&&i<arr.length-1){ const t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; }
      else if(b.dataset.g==='del'){ arr.splice(i,1); }
      else return;
      buildSibs(); draw(); saveLocal(); });
  }
}
$('btnSibAdd').onclick=()=>{ S.sibs.push({r:0,n:'',d:'',m:''}); buildSibs(); saveLocal();
  const last=$('sibRows').lastChild; if(last) last.querySelector('[data-f=n]').focus(); };

/* ---- 🖼️ Gallery (extra photos) ---- */
function buildGal(){
  const th=$('gthumbs'); th.innerHTML='';
  (S.photos2||[]).forEach((src,i)=>{
    const d=document.createElement('div'); d.className='gth';
    d.innerHTML='<img src="'+src+'"><span class="ops">'
      +'<button type="button" data-g="up" data-i="'+i+'" title="ऊपर">↑</button>'
      +'<button type="button" data-g="dn" data-i="'+i+'" title="नीचे">↓</button>'
      +'<button type="button" data-g="del" data-i="'+i+'" title="हटाओ">🗑️</button></span>';
    th.appendChild(d);
  });
}
$('gthumbs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const i=+b.dataset.i, ph=S.photos2;
  if(b.dataset.g==='up'&&i>0){ const t=ph[i-1]; ph[i-1]=ph[i]; ph[i]=t; }
  else if(b.dataset.g==='dn'&&i<ph.length-1){ const t=ph[i+1]; ph[i+1]=ph[i]; ph[i]=t; }
  else if(b.dataset.g==='del'){ ph.splice(i,1); }
  else return;
  buildGal(); draw(); saveLocal();
});
$('btnGalAdd').onclick=()=>$('fileGal').click();
$('fileGal').onchange=e=>{
  const files=[...e.target.files]; if(!files.length) return;
  let pend=files.length;
  files.forEach(f=>{
    const rd=new FileReader();
    rd.onload=()=>{ const im=new Image();
      im.onload=()=>{
        const mx=700; let w=im.width, h=im.height;
        if(Math.max(w,h)>mx){ const r=mx/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
        const c2=document.createElement('canvas'); c2.width=w; c2.height=h;
        c2.getContext('2d').drawImage(im,0,0,w,h);
        S.photos2.push(c2.toDataURL('image/jpeg',0.85));
        if(--pend===0){ buildGal(); ensureGImgs(()=>draw()); draw(); saveLocal(); toast('🖼️ '+files.length+' फोटो जुड़ी ✓'); }
      };
      im.src=rd.result; };
    rd.readAsDataURL(f);
  });
  e.target.value='';
};

/* ---- Photo ---- */
$('btnPhoto').onclick=()=>$('filePhoto').click();
$('filePhoto').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ S.photo=im; draw(); saveLocal(); toast('📷 फोटो लग गई ✓'); }; im.src=rd.result; };
  rd.readAsDataURL(f); };
$('pz').oninput=e=>{ S.pz=+e.target.value; draw(); saveLocal(); };
$('fsz').oninput=e=>{ S.fsz=+e.target.value; draw(); saveLocal(); };

/* ---- Save / Load ---- */
function pack(){ return {v:4, tmpl:S.tmpl, d:S.d, pz:S.pz, fsz:S.fsz, lang:S.lang, trans:S.trans, schema:S.schema, xlab:S.xlab, photos2:S.photos2, sibs:S.sibs, photo:S.photo?S.photo.src:null}; }
function migrateSel(){ /* पुराने Hindi select values → keys */
  SECTIONS.forEach(sec=>sec.f.forEach(f=>{ if(!f.sel) return;
    const v=S.d[f.k]; if(!v || OPTKEYS[f.sel].includes(v)) return;
    for(const code of LANG_ORDER){ const ix=LANGS[code][f.sel].indexOf(v);
      if(ix>=0){ S.d[f.k]=OPTKEYS[f.sel][ix]; return; } } })); }
function unpack(o){ if(!o) return;
  S.tmpl=o.tmpl||0; S.d=o.d||{}; S.pz=o.pz||1; S.fsz=o.fsz||1;
  S.lang=o.lang||'hi'; S.trans=(o.trans!==undefined)? o.trans : !!ITC[S.lang];
  S.schema=o.schema||null; ensureSchema();
  S.xlab=o.xlab||{}; S.photos2=o.photos2||[]; S.sibs=o.sibs||[];
  migrateSel(); ensureDocDefaults(); buildGal(); buildSibs(); ensureGImgs(()=>draw());
  $('pz').value=S.pz; $('fsz').value=S.fsz; $('chkTrans').checked=S.trans;
  buildLangSel(); applyUI(); buildForm(); setFormVals();
  ensureLangFont(S.lang);
  if(o.photo){ const im=new Image(); im.onload=()=>{ S.photo=im; buildTmpls(); draw(); }; im.src=o.photo; }
  else{ S.photo=null; buildTmpls(); draw(); } }
let saveT=null;
function saveLocal(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('biodataMakerV1',JSON.stringify(pack())); }catch(_){}} ,400); }
$('btnSaveJ').onclick=()=>{ const b=new Blob([JSON.stringify(pack(),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='biodata-'+(S.d.name||'naya').replace(/\s+/g,'-')+'.json'; a.click();
  toast('💾 JSON सहेजा गया ✓'); };
$('btnLoadJ').onclick=()=>$('fileJSON').click();
$('fileJSON').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ unpack(JSON.parse(rd.result)); toast('📂 खुल गया ✓'); }catch(_){ toast('❌ file ठीक नहीं'); } };
  rd.readAsText(f); e.target.value=''; };
$('btnClear').onclick=()=>{ if(!confirm('सब fields साफ़ करें?')) return;
  S.d={}; ensureDocDefaults(); S.photo=null; S.pz=1; $('pz').value=1;
  S.schema=null; ensureSchema(); S.xlab={}; S.photos2=[]; S.sibs=[];
  buildGal(); buildSibs(); buildForm();
  setFormVals();
  document.querySelectorAll('#formSecs input,#formSecs textarea').forEach(el=>el.value='');
  document.querySelectorAll('#formSecs select').forEach(el=>el.value='');
  localStorage.removeItem('biodataMakerV1'); draw(); toast('🔄 साफ़ हो गया'); };

/* ---- Export ---- */
$('btnPNG').onclick=async()=>{
  await SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}]);
  await ensureLangFont(S.lang);
  const sc=300; const oc=document.createElement('canvas');
  oc.width=Math.round(PW*sc); oc.height=Math.round(PH*sc);
  drawDoc(oc.getContext('2d'),sc,true);
  const a=document.createElement('a');
  a.download='biodata-'+(S.d.name||'naya').replace(/\s+/g,'-')+'-300dpi.png';
  a.href=oc.toDataURL('image/png'); a.click();
  toast('🖨️ 300 DPI PNG तैयार ✓'); };
$('btnPDF').onclick=async()=>{
  await SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}]);
  await ensureLangFont(S.lang);
  const sc=300; const oc=document.createElement('canvas');
  oc.width=Math.round(PW*sc); oc.height=Math.round(PH*sc);
  drawDoc(oc.getContext('2d'),sc,true);
  await new Promise(r=>ensureGImgs(r));
  const w=window.open('','_blank');
  if(!w) return toast('❌ popup रुका — allow करो');
  let imgs='<img src="'+oc.toDataURL('image/png')+'">';
  if((S.photos2||[]).length && (S._galDrawn||0) < S.photos2.length){
    const oc2=document.createElement('canvas');
    oc2.width=oc.width; oc2.height=oc.height;
    drawGalleryPage(oc2.getContext('2d'),sc);
    imgs+='<img src="'+oc2.toDataURL('image/png')+'" style="page-break-before:always">';
  }
  w.document.write('<html><head><title>Biodata PDF</title><style>body{margin:0}img{width:100%}</style></head><body>'+imgs+'<scr'+'ipt>setTimeout(()=>window.print(),500)</scr'+'ipt></body></html>');
  w.document.close();
  toast('📄 Print window खुली — "Save as PDF" चुनो'); };

/* ---- Init ---- */
SkFonts.injectFontLinks('');
$('selLang').onchange=e=>setLang(e.target.value);
$('chkTrans').onchange=e=>{ S.trans=e.target.checked; saveLocal(); };
ensureSchema(); buildLangSel(); applyUI(); ensureDocDefaults(); buildForm(); buildTmpls(); buildGal(); buildSibs();
try{ const sv=localStorage.getItem('biodataMakerV1'); if(sv) unpack(JSON.parse(sv)); }catch(_){}
setFormVals(); draw();
SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}])
  .then(()=>ensureLangFont(S.lang)).then(()=>draw());
addEventListener('resize',draw);
</script>
