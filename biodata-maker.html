<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💍 संस्कृति Biodata Maker — विवाह हेतु परिचय पत्र</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Nirmala UI',system-ui,sans-serif;background:#17191d;color:#e8eaf0;display:flex;flex-direction:column}
#topbar{background:#23272f;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid #ff9933}
#topbar h1{font-size:17px;color:#ff9933;font-weight:700}
.badge{font-size:11px;background:#1a7f37;color:#fff;padding:3px 9px;border-radius:20px}
.tbtn{background:#2d333d;border:1px solid #4a5261;color:#e8eaf0;padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.tbtn:hover{background:#3a4250}
.tbtn.gold{background:#c2410c;border-color:#c2410c;color:#fff;font-weight:700}
#main{flex:1;display:flex;overflow:hidden}
#side{width:330px;min-width:330px;background:#1e2128;border-right:1px solid #333;overflow-y:auto;padding:10px}
#stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:18px;background:#101216}
#cv{box-shadow:0 4px 30px rgba(0,0,0,.6);border-radius:3px;max-width:100%}
.sec{background:#23272f;border:1px solid #363c48;border-radius:10px;padding:9px;margin-bottom:9px}
.sec h3{font-size:13px;color:#ffb366;margin-bottom:7px;border-bottom:1px dashed #4a5261;padding-bottom:5px}
.frow{margin-bottom:7px}
.frow label{display:block;font-size:11.5px;color:#9aa5bb;margin-bottom:3px}
.frow input,.frow select,.frow textarea{width:100%;background:#171b21;border:1px solid #3a4150;color:#fff;padding:7px 9px;border-radius:7px;font-size:13.5px;font-family:inherit}
.frow textarea{resize:vertical;min-height:44px}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:#ff9933;outline:none}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{flex:1;min-width:90px;background:#171b21;border:2px solid #3a4150;border-radius:9px;padding:8px 4px;font-size:12px;text-align:center;cursor:pointer;color:#cfd6e4}
.tchip.on{border-color:#ff9933;background:#3a2a18;color:#ffb366;font-weight:700}
.sbtn{background:#2d333d;border:1px solid #4a5261;color:#e8eaf0;padding:7px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit}
.sbtn:hover{background:#3a4250}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#14532d;color:#dcfce7;padding:9px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@media(max-width:820px){
 #main{flex-direction:column}
 #side{width:100%;min-width:0;border-right:none;order:2;overflow:visible}
 #stage{order:1;flex:none;max-height:52vh;padding:10px}
 html,body{overflow:auto}
 body{display:block}
 #topbar{position:sticky;top:0;z-index:10}
 #main{overflow:visible}
 #stage{overflow:visible}
 #cv{max-width:100%;height:auto}
}
</style>
</head>
<body>
<div id="topbar">
  <h1>🌸 संस्कृति Biodata Maker</h1>
  <span class="badge" id="bdg">FREE v1.1 💍 (Latest)</span>
  <span style="flex:1"></span>
  <button class="tbtn" id="btnSaveJ">💾 JSON सहेजें</button>
  <button class="tbtn" id="btnLoadJ">📂 JSON खोलें</button>
  <button class="tbtn gold" id="btnPNG">🖨️ PNG (300 DPI)</button>
  <button class="tbtn" id="btnPDF">📄 PDF</button>
</div>
<div id="main">
  <div id="side">
    <div class="sec">
      <h3>🎨 Template चुनो</h3>
      <div class="tchips" id="tchips"></div>
    </div>
    <div class="sec">
      <h3>📷 फोटो</h3>
      <div class="frow"><button class="sbtn" id="btnPhoto" style="width:100%">📷 फोटो अपलोड करो</button></div>
      <div class="frow"><label>फोटो zoom</label><input type="range" id="pz" min="1" max="3" step="0.05" value="1"></div>
    </div>
    <div class="sec">
      <h3>📐 अक्षर साइज़</h3>
      <div class="frow"><input type="range" id="fsz" min="0.75" max="1.15" step="0.05" value="1"></div>
    </div>
    <div id="formSecs"></div>
    <div class="sec">
      <button class="sbtn" id="btnClear" style="width:100%;border-color:#7f1d1d;color:#fca5a5">🔄 सब साफ़ करो</button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileJSON" accept=".json,application/json" hidden>
<div id="toast"></div>
<script src="assets/js/fonts.js"></script>
<script>
'use strict';
/* ============ 💍 संस्कृति Biodata Maker v1 ============
   Notary-style: बाएँ form भरो → दाएँ A4 LIVE बनता दिखे।
   सब config-driven: templates + fields JSON — नया template/field = config में line (no hardcode) */
const $=id=>document.getElementById(id);

/* ---- 📋 FORM SCHEMA (config — नया field/section यहाँ जोड़ो) ---- */
const SECTIONS=[
 {t:'व्यक्तिगत विवरण', f:[
  {k:'name', l:'नाम'},
  {k:'dob',  l:'जन्म तारीख़'},
  {k:'tob',  l:'जन्म समय'},
  {k:'pob',  l:'जन्म स्थान'},
  {k:'ht',   l:'ऊँचाई'},
  {k:'wt',   l:'वज़न'},
  {k:'skin', l:'रंग', sel:['गोरा','गेहुँआ','साँवला']},
  {k:'rashi',l:'राशि', sel:['मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन']},
  {k:'gotra',l:'गोत्र'},
  {k:'manglik',l:'मांगलिक', sel:['नहीं','हाँ','आंशिक']},
 ]},
 {t:'पारिवारिक विवरण', f:[
  {k:'father', l:'पिता का नाम'},
  {k:'focc',   l:'पिता का व्यवसाय'},
  {k:'mother', l:'माता का नाम'},
  {k:'sib',    l:'भाई-बहन'},
  {k:'native', l:'मूल निवास'},
 ]},
 {t:'शिक्षा व व्यवसाय', f:[
  {k:'edu',    l:'शिक्षा'},
  {k:'work',   l:'व्यवसाय / नौकरी'},
  {k:'income', l:'वार्षिक आय'},
 ]},
 {t:'संपर्क', f:[
  {k:'addr',  l:'पता', area:1},
  {k:'phone', l:'मोबाइल'},
 ]},
];

/* ---- 🎨 TEMPLATES (config — नया design यहाँ जोड़ो) ---- */
const TMPL=[
 {id:'royal', name:'👑 शाही मैरून',
  bg1:'#faf3e2', bg2:'#f2e3c2', frame:'#8a1f2d', gold:'#c9a227',
  secC:'#8a1f2d', labC:'#7a6f5c', valC:'#2b2118', headC:'#8a1f2d',
  pShape:'oval', header:'॥ श्री गणेशाय नमः ॥', title:'विवाह हेतु परिचय पत्र'},
 {id:'rose', name:'🌸 गुलाब-सोना',
  bg1:'#fdf0ec', bg2:'#f7ddd3', frame:'#9d2c4a', gold:'#c9a227',
  secC:'#9d2c4a', labC:'#8a7568', valC:'#33231c', headC:'#9d2c4a',
  pShape:'oval', header:'॥ श्री गणेशाय नमः ॥', title:'विवाह हेतु परिचय पत्र'},
 {id:'plain', name:'📜 सादा क्रीम',
  bg1:'#fbf7ec', bg2:'#f5eedb', frame:'#6b5837', gold:'#a8853a',
  secC:'#6b5837', labC:'#8a7d63', valC:'#2e2718', headC:'#6b5837',
  pShape:'rect', header:'॥ श्री गणेशाय नमः ॥', title:'विवाह हेतु परिचय पत्र'},
 {id:'panel', name:'💎 मॉडर्न पैनल (Latest)', layout:'panel',
  bg1:'#fdfaf3', bg2:'#f7efdd', frame:'#7a1830', gold:'#d4af37',
  secC:'#7a1830', labC:'#8a7d68', valC:'#241c12', headC:'#f5e6c8',
  panel1:'#8a1f2d', panel2:'#5c1120', pShape:'oval',
  header:'॥ श्री गणेशाय नमः ॥', title:'विवाह हेतु परिचय पत्र'},
 {id:'band', name:'👑 रॉयल बैंड (Latest)', layout:'band',
  bg1:'#fffdf7', bg2:'#f8f1e0', frame:'#1e3a5f', gold:'#d4af37',
  secC:'#1e3a5f', labC:'#7d7462', valC:'#1f1a10', headC:'#ffffff',
  band1:'#274b73', band2:'#16263d', pShape:'circle',
  header:'॥ श्री गणेशाय नमः ॥', title:'विवाह हेतु परिचय पत्र'},
];

/* ---- State ---- */
const S={ tmpl:0, d:{}, photo:null, pz:1, fsz:1 };
const PW=8.27, PH=11.69;   // A4 inches
const cv=$('cv'), ctx=cv.getContext('2d');

function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity=1; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,2200); }

/* ---- Form build (schema से auto) ---- */
function buildForm(){
  const host=$('formSecs'); host.innerHTML='';
  SECTIONS.forEach(sec=>{
    const box=document.createElement('div'); box.className='sec';
    box.innerHTML='<h3>📋 '+sec.t+'</h3>';
    sec.f.forEach(f=>{
      const row=document.createElement('div'); row.className='frow';
      let inp;
      if(f.sel){ inp='<select id="f_'+f.k+'"><option value="">— चुनो —</option>'+f.sel.map(o=>'<option>'+o+'</option>').join('')+'</select>'; }
      else if(f.area){ inp='<textarea id="f_'+f.k+'" placeholder="'+f.l+' लिखो..."></textarea>'; }
      else{ inp='<input id="f_'+f.k+'" type="text" placeholder="'+f.l+' लिखो...">'; }
      row.innerHTML='<label>'+f.l+'</label>'+inp;
      box.appendChild(row);
    });
    host.appendChild(box);
  });
  host.addEventListener('input',e=>{ const k=e.target.id&&e.target.id.slice(0,2)==='f_'? e.target.id.slice(2):null;
    if(k){ S.d[k]=e.target.value; draw(); saveLocal(); } });
}

/* ---- Template chips ---- */
function buildTmpls(){
  const h=$('tchips'); h.innerHTML='';
  TMPL.forEach((t,i)=>{
    const b=document.createElement('div'); b.className='tchip'+(i===S.tmpl?' on':'');
    b.textContent=t.name; b.onclick=()=>{ S.tmpl=i; buildTmpls(); draw(); saveLocal(); };
    h.appendChild(b);
  });
}

/* ---- 🖌️ RENDER (sc = px/inch) ---- */
function drawDoc(c,sc,forExport){
  const T=TMPL[S.tmpl];
  if(T.layout==='panel') return drawPanelLayout(c,sc);
  if(T.layout==='band')  return drawBandLayout(c,sc);
  const W=PW*sc, H=PH*sc;
  /* bg */
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,T.bg1); g.addColorStop(1,T.bg2);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  /* double frame */
  const m=0.32*sc;
  c.strokeStyle=T.frame; c.lineWidth=0.055*sc; c.strokeRect(m,m,W-2*m,H-2*m);
  c.strokeStyle=T.gold;  c.lineWidth=0.018*sc; c.strokeRect(m+0.07*sc,m+0.07*sc,W-2*(m+0.07*sc),H-2*(m+0.07*sc));
  const X=m+0.26*sc, maxW=W-2*X;
  const fsz=S.fsz||1;   /* 📐 अक्षर साइज़ (user slider) */
  let y=m+0.50*sc;
  /* header */
  c.textAlign='center'; c.fillStyle=T.headC;
  c.font=SkFonts.fontFam({f:'yatra',size:0.28*fsz},sc);
  c.fillText(T.header, W/2, y); y+=0.30*sc;
  /* title */
  c.font=SkFonts.fontFam({f:'rozha',size:0.46*fsz},sc);
  c.fillText(T.title, W/2, y); y+=0.10*sc;
  /* gold divider */
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(W/2-1.5*sc,y+0.10*sc); c.lineTo(W/2+1.5*sc,y+0.10*sc); c.stroke();
  c.save(); c.translate(W/2,y+0.10*sc); c.rotate(Math.PI/4);
  c.fillStyle=T.gold; const ds=0.05*sc; c.fillRect(-ds,-ds,2*ds,2*ds); c.restore();
  y+=0.28*sc;
  /* photo frame (top-right) */
  const phW=1.45*sc, phH=1.75*sc, phX=W-X-phW, phY=y;
  /* नाम (script, बाएँ) */
  c.textAlign='left';
  if(S.d.name){
    c.fillStyle=T.frame; c.font=SkFonts.fontFam({f:'gvibes',size:0.52*fsz},sc);
    c.fillText(S.d.name, X+0.1*sc, y+0.8*sc, W-2*X-phW-0.5*sc);
  }
  /* photo */
  c.save();
  if(T.pShape==='oval'){ c.beginPath(); c.ellipse(phX+phW/2,phY+phH/2,phW/2,phH/2,0,0,7); }
  else{ c.beginPath(); c.rect(phX,phY,phW,phH); }
  c.clip();
  if(S.photo){
    const im=S.photo, pz=S.pz||1;
    const base=Math.max(phW/im.width,phH/im.height)*pz;
    const dw=im.width*base, dh=im.height*base;
    c.drawImage(im, phX+(phW-dw)/2, phY+(phH-dh)/2, dw, dh);
  }else{
    c.fillStyle='rgba(0,0,0,0.06)'; c.fillRect(phX,phY,phW,phH);
    c.fillStyle=T.labC; c.font=SkFonts.fontFam({f:'',size:0.22},sc); c.textAlign='center';
    c.fillText('📷 फोटो', phX+phW/2, phY+phH/2);
  }
  c.restore();
  c.strokeStyle=T.gold; c.lineWidth=0.035*sc;
  if(T.pShape==='oval'){ c.beginPath(); c.ellipse(phX+phW/2,phY+phH/2,phW/2,phH/2,0,0,7); c.stroke(); }
  else{ c.strokeRect(phX,phY,phW,phH); }
  y=Math.max(y+1.0*sc, phY+phH+0.16*sc);

  y=drawSections(c,sc,X,y,W,T,fsz,2.0);
  footer(c,sc,W,H,m,T);
}
/* ---- 📋 sections flow (सब layouts share) — labW = label column inches ---- */
function drawSections(c,sc,X,y,W,T,fsz,labW){
  SECTIONS.forEach(sec=>{
    /* section title */
    c.textAlign='left'; c.fillStyle=T.secC;
    c.font=SkFonts.fontFam({f:'rozha',size:0.30*fsz},sc);
    c.fillText('◆ '+sec.t, X, y);
    c.strokeStyle=T.gold; c.lineWidth=0.014*sc;
    const tw=c.measureText('◆ '+sec.t).width;
    c.beginPath(); c.moveTo(X,y+0.08*sc); c.lineTo(X+tw,y+0.08*sc); c.stroke();
    y+=0.28*sc;
    /* rows */
    sec.f.forEach(f=>{
      const v=(S.d[f.k]||'').trim();
      const lab=f.l, labS=0.22*fsz, valS=0.24*fsz;
      c.font=SkFonts.fontFam({f:'tiro',size:valS},sc);
      const vx=X+labW*sc, vwR=W-vx-(0.28*sc);   /* value कॉलम: दायाँ किनारा तक */
      const words=(v||'—').split(/\s+/); const lines=[]; let cur='';
      words.forEach(wd=>{ const t=cur?cur+' '+wd:wd;
        if(c.measureText(t).width>vwR&&cur){ lines.push(cur); cur=wd; } else cur=t; });
      if(cur) lines.push(cur);
      lines.forEach((ln,li)=>{
        if(li===0){ c.fillStyle=T.labC; c.font=SkFonts.fontFam({f:'tiro',size:labS},sc); c.textAlign='left'; c.fillText(lab,X,y);
          c.fillStyle=T.gold; c.textAlign='center'; c.fillText(':',X+(labW-0.22)*sc,y); }
        c.fillStyle=T.valC; c.font=SkFonts.fontFam({f:'tiro',size:valS},sc); c.textAlign='left';
        c.fillText(ln,vx,y);
        y+=0.30*sc*fsz;
      });
      y+=0.03*sc;
    });
    y+=0.06*sc;
  });
  return y;
}
function footer(c,sc,W,H,m,T){
  c.textAlign='center'; c.fillStyle=T.labC;
  c.font=SkFonts.fontFam({f:'kalam',size:0.15},sc);
  c.fillText('— संस्कृति से बनाया गया —', W/2, H-m-0.14*sc);
}
/* ---- 💎 LAYOUT: मॉडर्न साइड-पैनल (2026 latest) ---- */
function drawPanelLayout(c,sc){
  const T=TMPL[S.tmpl], W=PW*sc, H=PH*sc, fsz=S.fsz||1;
  /* bg */
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,T.bg1); g.addColorStop(1,T.bg2);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const m=0.3*sc;
  /* left panel */
  const pw=2.85*sc;
  const pg=c.createLinearGradient(0,m,0,H-m); pg.addColorStop(0,T.panel1); pg.addColorStop(1,T.panel2);
  c.fillStyle=pg; c.fillRect(m,m,pw,H-2*m);
  c.strokeStyle=T.gold; c.lineWidth=0.03*sc;
  c.beginPath(); c.moveTo(m+pw+0.06*sc,m+0.12*sc); c.lineTo(m+pw+0.06*sc,H-m-0.12*sc); c.stroke();
  /* photo (panel में ऊपर, gold ring) */
  const phW=1.7*sc, phH=2.05*sc, phX=m+(pw-phW)/2, phY=m+0.85*sc;
  c.save();
  c.beginPath(); c.ellipse(phX+phW/2,phY+phH/2,phW/2,phH/2,0,0,7); c.clip();
  if(S.photo){ const im=S.photo, pz=S.pz||1;
    const base=Math.max(phW/im.width,phH/im.height)*pz;
    const dw=im.width*base, dh=im.height*base;
    c.drawImage(im, phX+(phW-dw)/2, phY+(phH-dh)/2, dw, dh);
  }else{ c.fillStyle='rgba(255,255,255,0.12)'; c.fillRect(phX,phY,phW,phH);
    c.fillStyle='#f5e6c8'; c.font=SkFonts.fontFam({f:'',size:0.2},sc); c.textAlign='center';
    c.fillText('📷', phX+phW/2, phY+phH/2); }
  c.restore();
  c.strokeStyle=T.gold; c.lineWidth=0.04*sc;
  c.beginPath(); c.ellipse(phX+phW/2,phY+phH/2,phW/2,phH/2,0,0,7); c.stroke();
  /* नाम script (panel में, gold) */
  let py=phY+phH+0.5*sc;
  c.textAlign='center'; c.fillStyle=T.gold;
  if(S.d.name){ c.font=SkFonts.fontFam({f:'gvibes',size:0.5*fsz},sc);
    c.fillText(S.d.name, m+pw/2, py, pw-0.3*sc); py+=0.42*sc; }
  /* header + divider + title (panel में) */
  c.fillStyle=T.headC; c.font=SkFonts.fontFam({f:'yatra',size:0.22*fsz},sc);
  c.fillText(T.header, m+pw/2, py+0.15*sc, pw-0.2*sc); py+=0.5*sc;
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(m+0.4*sc,py); c.lineTo(m+pw-0.4*sc,py); c.stroke(); py+=0.35*sc;
  c.fillStyle=T.headC; c.font=SkFonts.fontFam({f:'rozha',size:0.3*fsz},sc);
  c.fillText('विवाह हेतु', m+pw/2, py); py+=0.4*sc;
  c.fillText('परिचय पत्र', m+pw/2, py);
  /* panel के नीचे शुभ विवाह */
  c.fillStyle=T.gold; c.font=SkFonts.fontFam({f:'yatra',size:0.24*fsz},sc);
  c.fillText('॥ शुभ विवाह ॥', m+pw/2, H-m-0.55*sc);
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(m+0.5*sc,H-m-0.75*sc); c.lineTo(m+pw-0.5*sc,H-m-0.75*sc); c.stroke();
  /* दाईं ओर sections */
  const X2=m+pw+0.4*sc;
  const y2=m+0.6*sc;
  drawSections(c,sc,X2,y2,W-m*0.9,T,fsz,1.75);
  footer(c,sc,W,H,m,T);
}
/* ---- 👑 LAYOUT: रॉयल टॉप-बैंड (2026 latest) ---- */
function drawBandLayout(c,sc){
  const T=TMPL[S.tmpl], W=PW*sc, H=PH*sc, fsz=S.fsz||1;
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,T.bg1); g.addColorStop(1,T.bg2);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const m=0.3*sc;
  /* top band */
  const bh=2.15*sc;
  const bg2=c.createLinearGradient(0,m,W,m+bh); bg2.addColorStop(0,T.band1); bg2.addColorStop(1,T.band2);
  c.fillStyle=bg2; c.fillRect(m,m,W-2*m,bh);
  c.strokeStyle=T.gold; c.lineWidth=0.035*sc;
  c.beginPath(); c.moveTo(m+0.1*sc,m+bh); c.lineTo(W-m-0.1*sc,m+bh); c.stroke();
  /* header + नाम band में */
  c.textAlign='center'; c.fillStyle=T.headC;
  c.font=SkFonts.fontFam({f:'yatra',size:0.26*fsz},sc);
  c.fillText(T.header, W/2, m+0.55*sc);
  if(S.d.name){ c.fillStyle=T.gold; c.font=SkFonts.fontFam({f:'gvibes',size:0.62*fsz},sc);
    c.fillText(S.d.name, W/2, m+1.35*sc, W-2*m-2.6*sc); }
  /* circle photo — band के नीचे आधा overlap */
  const d=1.8*sc, pcx=W/2, pcy=m+bh;   // केंद्र band की किनारी पर
  c.save();
  c.beginPath(); c.arc(pcx,pcy,d/2,0,7); c.clip();
  if(S.photo){ const im=S.photo, pz=S.pz||1;
    const base=Math.max(d/im.width,d/im.height)*pz;
    const dw=im.width*base, dh=im.height*base;
    c.drawImage(im, pcx-dw/2, pcy-dh/2, dw, dh);
  }else{ c.fillStyle='rgba(0,0,0,0.08)'; c.fillRect(pcx-d/2,pcy-d/2,d,d);
    c.fillStyle=T.labC; c.font=SkFonts.fontFam({f:'',size:0.2},sc); c.textAlign='center';
    c.fillText('📷', pcx, pcy); }
  c.restore();
  c.strokeStyle=T.gold; c.lineWidth=0.05*sc;
  c.beginPath(); c.arc(pcx,pcy,d/2,0,7); c.stroke();
  c.strokeStyle=T.frame; c.lineWidth=0.015*sc;
  c.beginPath(); c.arc(pcx,pcy,d/2+0.06*sc,0,7); c.stroke();
  /* title + sections नीचे */
  let y=pcy+d/2+0.30*sc;
  c.textAlign='center'; c.fillStyle=T.secC;
  c.font=SkFonts.fontFam({f:'rozha',size:0.4*fsz},sc);
  c.fillText(T.title, W/2, y); y+=0.15*sc;
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.beginPath(); c.moveTo(W/2-1.4*sc,y+0.08*sc); c.lineTo(W/2+1.4*sc,y+0.08*sc); c.stroke();
  y+=0.24*sc;
  const X=m+0.28*sc;
  drawSections(c,sc,X,y,W-m*0.9,T,fsz*0.90,2.0);
  /* बाहरी gold frame */
  c.strokeStyle=T.gold; c.lineWidth=0.02*sc;
  c.strokeRect(m+0.05*sc,m+0.05*sc,W-2*(m+0.05*sc),H-2*(m+0.05*sc));
  footer(c,sc,W,H,m,T);
}
function draw(){
  const stage=$('stage');
  const avail=Math.min(stage.clientWidth-24, 640);
  const sc=avail/PW;
  cv.width=PW*sc; cv.height=PH*sc;
  drawDoc(ctx,sc,false);
}

/* ---- Photo ---- */
$('btnPhoto').onclick=()=>$('filePhoto').click();
$('filePhoto').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image(); im.onload=()=>{ S.photo=im; draw(); saveLocal(); toast('📷 फोटो लग गई ✓'); }; im.src=rd.result; };
  rd.readAsDataURL(f); };
$('pz').oninput=e=>{ S.pz=+e.target.value; draw(); saveLocal(); };
$('fsz').oninput=e=>{ S.fsz=+e.target.value; draw(); saveLocal(); };

/* ---- Save / Load ---- */
function pack(){ return {v:1, tmpl:S.tmpl, d:S.d, pz:S.pz, fsz:S.fsz, photo:S.photo?S.photo.src:null}; }
function unpack(o){ if(!o) return;
  S.tmpl=o.tmpl||0; S.d=o.d||{}; S.pz=o.pz||1; S.fsz=o.fsz||1;
  $('pz').value=S.pz; $('fsz').value=S.fsz;
  Object.keys(S.d).forEach(k=>{ const el=$('f_'+k); if(el) el.value=S.d[k]; });
  if(o.photo){ const im=new Image(); im.onload=()=>{ S.photo=im; buildTmpls(); draw(); }; im.src=o.photo; }
  else{ S.photo=null; buildTmpls(); draw(); } }
let saveT=null;
function saveLocal(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('biodataMakerV1',JSON.stringify(pack())); }catch(_){}} ,400); }
$('btnSaveJ').onclick=()=>{ const b=new Blob([JSON.stringify(pack(),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='biodata-'+(S.d.name||'naya').replace(/\s+/g,'-')+'.json'; a.click();
  toast('💾 JSON सहेजा गया ✓'); };
$('btnLoadJ').onclick=()=>$('fileJSON').click();
$('fileJSON').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ unpack(JSON.parse(rd.result)); toast('📂 खुल गया ✓'); }catch(_){ toast('❌ file ठीक नहीं'); } };
  rd.readAsText(f); e.target.value=''; };
$('btnClear').onclick=()=>{ if(!confirm('सब fields साफ़ करें?')) return;
  S.d={}; S.photo=null; S.pz=1; $('pz').value=1;
  document.querySelectorAll('#formSecs input,#formSecs textarea').forEach(el=>el.value='');
  document.querySelectorAll('#formSecs select').forEach(el=>el.value='');
  localStorage.removeItem('biodataMakerV1'); draw(); toast('🔄 साफ़ हो गया'); };

/* ---- Export ---- */
$('btnPNG').onclick=async()=>{
  await SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}]);
  const sc=300; const oc=document.createElement('canvas');
  oc.width=Math.round(PW*sc); oc.height=Math.round(PH*sc);
  drawDoc(oc.getContext('2d'),sc,true);
  const a=document.createElement('a');
  a.download='biodata-'+(S.d.name||'naya').replace(/\s+/g,'-')+'-300dpi.png';
  a.href=oc.toDataURL('image/png'); a.click();
  toast('🖨️ 300 DPI PNG तैयार ✓'); };
$('btnPDF').onclick=async()=>{
  await SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}]);
  const sc=300; const oc=document.createElement('canvas');
  oc.width=Math.round(PW*sc); oc.height=Math.round(PH*sc);
  drawDoc(oc.getContext('2d'),sc,true);
  const w=window.open('','_blank');
  if(!w) return toast('❌ popup रुका — allow करो');
  w.document.write('<html><head><title>Biodata PDF</title><style>body{margin:0}img{width:100%}</style></head><body><img src="'+oc.toDataURL('image/png')+'" onload="setTimeout(()=>window.print(),300)"></body></html>');
  w.document.close();
  toast('📄 Print window खुली — "Save as PDF" चुनो'); };

/* ---- Init ---- */
SkFonts.injectFontLinks('');
buildForm(); buildTmpls();
try{ const sv=localStorage.getItem('biodataMakerV1'); if(sv) unpack(JSON.parse(sv)); }catch(_){}
draw();
SkFonts.ensureFonts([{kind:'text',f:'rozha'},{kind:'text',f:'yatra'},{kind:'text',f:'gvibes'},{kind:'text',f:'tiro'},{kind:'text',f:'kalam'}]).then(()=>draw());
addEventListener('resize',draw);
</script>
