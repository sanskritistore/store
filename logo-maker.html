<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="brand/favicon-64.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>संस्कृति — 🎨 Logo Maker</title>
<script src="assets/js/admin-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@600;700&family=Poppins:wght@400;600;700;800&family=Mukta:wght@400;600;700;800&family=Playfair+Display:wght@500;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&family=Cinzel:wght@500;700;800&family=Montserrat:wght@400;600;700;800&family=Raleway:ital,wght@0,400;0,600;0,700;1,400&family=Oswald:wght@400;600;700&family=Bebas+Neue&family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Hind:wght@400;600;700&family=Kalam:wght@400;700&family=Rozha+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1e293b;border-bottom:2px solid #f59e0b;flex-wrap:wrap}
header h1{font-size:17px;color:#fbbf24;white-space:nowrap}
.badge{background:#15803d;color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
#stage canvas.chkbg{background:conic-gradient(#cbd5e1 25%,#ffffff 0 50%,#cbd5e1 0 75%,#ffffff 0) 0 0/20px 20px}
.hbtn{background:#334155;border:1px solid #475569;color:#e2e8f0;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.hbtn:hover{background:#475569}
.hbtn.main{background:#c2410c;border-color:#ea580c}
.hbtn.main:hover{background:#ea580c}
main{display:flex;flex:1;overflow:hidden}
#side{width:300px;min-width:300px;background:#1e293b;overflow-y:auto;padding:10px;border-right:1px solid #334155}
#side h3{font-size:13px;color:#fbbf24;margin:12px 0 6px;border-bottom:1px solid #334155;padding-bottom:4px}
#side h3:first-child{margin-top:0}
.sbtn{background:#334155;border:1px solid #475569;color:#e2e8f0;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;margin:2px 0;width:100%;text-align:left}
.sbtn:hover{background:#475569}
.sbtn.on{background:#7c2d12;border-color:#f59e0b}
.fld{margin:5px 0}
.fld label{display:block;font-size:11.5px;color:#94a3b8;margin-bottom:2px}
.fld input,.fld textarea{width:100%;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:6px 8px;border-radius:6px;font-size:13px;font-family:inherit}
.fld textarea{resize:vertical;min-height:44px}
.tplchip{display:flex;gap:6px;flex-wrap:wrap}
.tplchip .cchip{position:relative;flex:1;min-width:45%}
.tplchip .cchip .nm{width:100%}
.tplchip .cchip .mini{position:absolute;top:-5px;right:-5px;display:flex;gap:3px}
.tplchip .cchip .mini button{background:#475569;border:none;color:#e2e8f0;border-radius:50%;width:19px;height:19px;font-size:10px;cursor:pointer;line-height:1}
#stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:14px;gap:14px;background:#0b1120}
#stage canvas{background:#fff;box-shadow:0 4px 24px #0008;border-radius:2px}
.stglab{color:#64748b;font-size:12px;font-weight:700;align-self:flex-start;margin-left:4%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #f59e0b;color:#fde68a;padding:9px 18px;border-radius:22px;font-size:13.5px;font-weight:600;display:none;z-index:99;box-shadow:0 4px 18px #000a;max-width:88vw;text-align:center}
/* ---- 🎨 Template Studio drawer ---- */
#studio{position:fixed;top:0;right:0;bottom:0;width:302px;background:#1e293b;border-left:2px solid #f59e0b;z-index:60;display:none;overflow-y:auto;padding:12px;box-shadow:-6px 0 30px #000a}
/* ---- 🖼️ Design Gallery (customer catalog) ---- */
#gallery{position:fixed;inset:0;background:rgba(2,6,23,.97);z-index:70;display:none;overflow-y:auto;padding:16px}
#gallery .galhead{position:sticky;top:-16px;background:#0f172a;padding:12px 6px 10px;z-index:2;border-bottom:2px solid #f59e0b;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#gallery .galhead h2{color:#fbbf24;font-size:17px;margin:0 auto 0 0}
#gallery .galhead .x{background:#7f1d1d;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
#gallery .galhead .fchips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#gallery .fchips button{background:#1e293b;color:#cbd5e1;border:1px solid #475569;border-radius:14px;padding:4px 11px;font-size:11.5px;cursor:pointer}
#gallery .fchips button.on{background:#f59e0b;color:#111;border-color:#f59e0b;font-weight:700}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px;margin-top:14px;padding:2px 4px 30px}
.galcard{background:#1e293b;border:2px solid #334155;border-radius:10px;padding:9px;cursor:pointer;transition:border-color .15s}
.galcard:hover{border-color:#f59e0b}
.galcard canvas{width:100%;height:auto;border-radius:3px;display:block}
.galcard .nm{font-size:11px;color:#cbd5e1;margin-top:7px;text-align:center;font-weight:600}
.galcard .no{font-size:9.5px;color:#64748b;text-align:center}
#studio h3{font-size:14px;color:#fbbf24;margin:10px 0 6px;border-bottom:1px solid #334155;padding-bottom:4px}
#studio h3:first-child{margin-top:0;display:flex;justify-content:space-between;align-items:center}
#studio .x{background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:2px 6px}
#studio .x:hover{color:#f87171}
.strow{margin:7px 0}
.strow>label{display:block;font-size:11.5px;color:#94a3b8;margin-bottom:3px}
.strow>input{width:100%;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:7px 9px;border-radius:7px;font-size:13px}
.stchips{display:flex;gap:5px;flex-wrap:wrap}
.stchips .sbtn{width:auto;flex:1;text-align:center;padding:6px 4px;font-size:12px;margin:0;white-space:nowrap}
.clrrow{display:flex;gap:8px;align-items:center;margin:5px 0}
.clrrow label{flex:1;font-size:12px;color:#cbd5e1}
.clrrow input{width:44px;height:28px;border:1px solid #475569;border-radius:6px;background:#0f172a;cursor:pointer}
.stbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.stbtns .sbtn{flex:1;text-align:center;min-width:45%}
@media(max-width:760px){ #side{width:44vw;min-width:44vw} }
/* 🖨️ direct print — screen पर app, paper पर सिर्फ़ sheet */
#printArea{ display:none; }
@media print{
  body>*:not(#printArea){ display:none !important; }
  #printArea{ display:block !important; margin:0; padding:0; }
  #printArea img{ display:block; margin:0; }
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<header>
  <span style="font-size:20px">🎨</span>
  <h1>संस्कृति Logo Maker</h1>
  <span class="badge">FREE v1.0 🎨</span>
  <span style="flex:1"></span>
  <button class="hbtn" id="btnLang">🌐 English</button>
  <button class="hbtn" id="btnSave">💾 सहेजें</button>
  <button class="hbtn" id="btnLoad">📂 खोलें</button>
  <button class="hbtn" id="btnSample">✨ नमूना भरो</button>
  <button class="hbtn" id="btnPngW">⬇️ PNG Web (1024)</button>
  <button class="hbtn main" id="btnPngP">⬇️ PNG Print (3000)</button>
</header>
<main>
  <div id="side"></div>
  <div id="stage"></div>
</main>
<div id="studio"></div>
<div id="gallery"></div>
<div id="toast"></div>
<input type="file" id="fileLoad" accept=".json" style="display:none">
<input type="file" id="fileLogo" accept="image/*" style="display:none">
<input type="file" id="fileTpl" accept=".json" style="display:none">

/* ================= 🔤 RENDER HELPERS (inch = unit; TXT slice-bug fix — resume engine से) ================= */
const FDEV='"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif';
const FSER='"Noto Serif Devanagari",Georgia,serif';
const FSCR='"Great Vibes","Noto Serif Devanagari",cursive';   /* script (OFL free font) */
const PT=1/72;
let SC=VIEW_SCALE;
const FONTS=[                                   /* 🔤 fontKey — नया font यहाँ जोड़ो (सब OFL/free) */
  { n:'सादा',       css:FDEV },
  { n:'सीरिफ़',      css:FSER },
  { n:'Poppins',    css:'"Poppins",'+FDEV },
  { n:'Mukta',      css:'"Mukta",'+FDEV },
  { n:'Playfair',   css:'"Playfair Display",'+FSER },
  { n:'Tiro हिंदी',  css:'"Tiro Devanagari Hindi",'+FSER },
  { n:'Cinzel',     css:'"Cinzel",'+FSER },
  { n:'Montserrat', css:'"Montserrat",'+FDEV },        /* modern card */
  { n:'Raleway',    css:'"Raleway",'+FDEV },           /* elegant premium */
  { n:'Oswald',     css:'"Oswald",'+FDEV },            /* banner headline */
  { n:'Bebas',      css:'"Bebas Neue",'+FDEV },        /* banner display */
  { n:'Lora',       css:'"Lora",'+FSER },              /* letterhead */
  { n:'Dancing',    css:'"Dancing Script",'+FSCR },    /* शादी English */
  { n:'Hind',       css:'"Hind",'+FDEV },              /* साफ़ हिंदी */
  { n:'Kalam',      css:'"Kalam",'+FDEV },             /* हिंदी लिखावट */
  { n:'Rozha शादी',  css:'"Rozha One",'+FSER },         /* शादी हिंदी display */
  { n:'Baloo हिंदी', css:'"Baloo 2",'+FDEV }            /* मोटा हिंदी */
];
function fkOf(t,role){ if(role&&t.fonts&&t.fonts[role]!=null) return t.fonts[role];
  return (t.fontKey==null?(t.serif?1:0):t.fontKey); }
function font(t,px,w,st,role){ return (st||'')+' '+(w||400)+' '+px+'px '+((FONTS[fkOf(t,role)]||FONTS[0]).css); }
function szOf(t,k){ return (t.sz&&t.sz[k])||1; }            /* text size गुणक */
function wOf(t,k,defw,bw){ return (t.bold&&t.bold[k])?(bw||800):defw; }   /* Bold */
function iOf(t,k){ return (t.ital&&t.ital[k])?'italic':undefined; }        /* Italic */
function setF(ctx,t,pt,w,st,role){ ctx.font=font(t,pt*PT*SC,w,st,role); }
function TXT(ctx,str,x,y){ const al=ctx.textAlign;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.textAlign=al;
  ctx.fillText(str,x*SC,y*SC); ctx.restore(); }
function wrap(ctx,text,maxW){
  const out=[];
  String(text||'').split('\n').forEach(p=>{
    if(!p.trim()){ out.push(''); return; }
    let line='';
    p.split(/\s+/).forEach(wd=>{
      const t=line?line+' '+wd:wd;
      if(ctx.measureText(t).width/SC<=maxW) line=t;
      else{ if(line)out.push(line); line=wd; }
    });
    if(line)out.push(line);
  });
  return out;
}
/* logo cache */
const _lgMap={};   /* 🖼️ multi-image cache — हर src अपना Image (royal parts + user photos एक साथ) */
function logoImg(src){ const hit=_lgMap[src]; if(hit) return hit.complete&&hit.naturalWidth?hit:null;
  const im=new Image(); im.onload=()=>{ draw(); const g=$('gallery'); if(g&&g.style.display==='block') openGallery(); };
  im.src=src; _lgMap[src]=im; return null; }

/* ================= 🪪 CARD RENDERER (OX,OY = sheet में card की जगह; screen पर 0,0) ================= */
/* 🧩 Corel-जैसे background patterns (lines/boxes/dots) — t.pat={ty,c,gap(in),a,lw(px)} */
function drawPattern(ctx,p,ox,oy,W,H){
  if(!p||!p.ty||p.ty==='none') return;
  const g=Math.max(0.04,p.gap||0.2);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox,oy,W,H); ctx.clip();   /* card से बाहर कुछ न जाए */
  ctx.globalAlpha=(p.a!=null?p.a:0.35);
  ctx.strokeStyle=p.c||'#000000'; ctx.lineWidth=(p.lw||1)/SC;
  ctx.beginPath();
  if(p.ty==='h'||p.ty==='grid') for(let y=g;y<H;y+=g){ ctx.moveTo(ox,oy+y); ctx.lineTo(ox+W,oy+y); }
  if(p.ty==='v'||p.ty==='grid') for(let x=g;x<W;x+=g){ ctx.moveTo(ox+x,oy); ctx.lineTo(ox+x,oy+H); }
  if(p.ty==='d'||p.ty==='d2') for(let k=-H;k<W+H;k+=g){ ctx.moveTo(ox+k,oy); ctx.lineTo(ox+k+H,oy+H); }
  if(p.ty==='d2') for(let k=-H;k<W+H;k+=g){ ctx.moveTo(ox+k+H,oy); ctx.lineTo(ox+k,oy+H); }
  ctx.stroke();
  if(p.ty==='dots'){ ctx.fillStyle=p.c||'#000000';
    for(let y=g;y<H;y+=g) for(let x=g;x<W;x+=g){
      ctx.beginPath(); ctx.arc(ox+x,oy+y,(p.lw||1.2)/SC,0,7); ctx.fill(); } }
  ctx.restore();
}
/* ================= ⭐ PREMIUM HELPERS (metallic gradients, sparkle, mandala) ================= */
function linGrad(ctx,c1,c2,dir,x0,y0,x1,y1){ const g=dir==='h'?ctx.createLinearGradient(x0,y0,x1,y0):(dir==='d'?ctx.createLinearGradient(x0,y0,x1,y1):ctx.createLinearGradient(x0,y0,x0,y1));
  g.addColorStop(0,c1||'#000000'); g.addColorStop(1,c2||'#ffffff'); return g; }
function metGrad(ctx,c,x0,y0,x1,y1){

/* ================= 🖨️ SHEET RENDERER (grid + crop marks) ================= */
function sheetGrid(sh){
  const dm=cardDims(), gap=sh.gap||0, minM=(sh.minM==null?8/25.4:sh.minM);  /* printer-safe किनारा */
  let cols=Math.max(1,Math.floor((sh.w+gap)/(dm.w+gap)));
  let rows=Math.max(1,Math.floor((sh.h+gap)/(dm.h+gap)));
  while(cols>1&&(sh.w-(cols*dm.w+(cols-1)*gap))/2<minM) cols--;
  while(rows>1&&(sh.h-(rows*dm.h+(rows-1)*gap))/2<minM) rows--;
  const gx=(sh.w-(cols*dm.w+(cols-1)*gap))/2, gy=(sh.h-(rows*dm.h+(rows-1)*gap))/2;
  return { cols, rows, gx, gy, gap };
}
function cropMarks(ctx,ox,oy,w,h){
  ctx.strokeStyle='#374151'; ctx.lineWidth=1.2/SC;
  const g=0, l=2/25.4;   /* 2mm cutting marks — gutter भर में, Corel imposition जैसे */
  [[ox,oy,-1,-1],[ox+w,oy,1,-1],[ox,oy+h,-1,1],[ox+w,oy+h,1,1]].forEach(([cx,cy,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(cx+sx*g,cy); ctx.lineTo(cx+sx*(g+l),cy);
    ctx.moveTo(cx,cy+sy*g); ctx.lineTo(cx,cy+sy*(g+l));
    ctx.stroke();
  });
}
/* side='back' → columns mirror (long-edge flip पर हर back अपने front के ठीक पीछे) */
function renderSheet(scale,sheetKey,side){
  const sh=SHEETS[sheetKey];
  const tid=side==='back'?S.tplBack:S.tplFront;
  const t=TEMPLATES[tid]||TEMPLATES.simple, d=S.data;
  SC=scale;
  const cv=document.createElement('canvas');
  cv.width=Math.round(sh.w*scale); cv.height=Math.round(sh.h*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,sh.w,sh.h);
  const g=sheetGrid(sh), dm=cardDims();
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++){
    const cc=(side==='back')?(g.cols-1-c):c;
    const ox=g.gx+cc*(dm.w+g.gap), oy=g.gy+r*(dm.h+g.gap);
    drawCardInto(ctx,t,d,ox,oy);
    cropMarks(ctx,ox,oy,dm.w,dm.h);
  }
  return cv;
}
function renderCard(scale,side,tidOverride){
  const tid=tidOverride||(side?(side==='back'?S.tplBack:S.tplFront):activeTplId());
  const t=TEMPLATES[tid]||TEMPLATES.simple;
  SC=scale;
  const dm=cardDims();
  const cv=document.createElement('canvas');
  cv.width=Math.round(dm.w*scale); cv.height=Math.round(dm.h*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  drawCardInto(ctx,t,S.data,0,0);
  if(side==='front'&&scale===VIEW_SCALE&&window._studioOv) window._studioOv(ctx,dm);   /* ▦ grid+guides (studio only, print नहीं) */
  return cv;
}

/* ================= 🖥️ SCREEN DRAW ================= */
function draw(){
  const st=$('stage'); st.innerHTML='';
  const l1=document.createElement('div'); l1.className='stglab'; l1.textContent=T('stgCard'); st.appendChild(l1);
  const cv=renderCard(VIEW_SCALE,'front'); cv.id='cvF'; cv.style.maxWidth='92%'; cv.style.height='auto';
  const tp=TEMPLATES[activeTplId()]||{};   /* 🔍 पारदर्शी bg → checkerboard दिखे */
  if(!(tp.bg||tp.bg2||tp.gradBg)) cv.className='chkbg';
  st.appendChild(cv);
  try{ if(STU.open) attachElDrag(cv); }catch(_){ }
}

/* ================= 🧩 SIDEBAR ================= */
function buildForm(){
  const side=$('side');
  side.innerHTML='';
  const hs0=document.createElement('h3'); hs0.textContent=T('tpl'); side.appendChild(hs0);
  /* templates */
  const tc=document.createElement('div'); tc.className='tplchip'; tc.id='tplChips'; side.appendChild(tc);
  buildChips();
  /* 🖼️ gallery खोलो */
  const gb=document.createElement('button'); gb.className='sbtn'; gb.style.cssText='width:100%;margin-top:6px;background:#f59e0b;color:#111;font-weight:800';
  gb.textContent=T('galBtn'); gb.onclick=()=>openGallery(); side.appendChild(gb);
  /* studio */
  { const so=document.createElement('button'); so.className='sbtn'; so.style.cssText='width:100%;margin-top:6px;border:1px dashed #f59e0b;color:#fbbf24';
    so.textContent=T('stOpen'); so.onclick=()=>openStudio(); side.appendChild(so); }
  /* schema sections */
  SCHEMA.forEach(sec=>{
    const h=document.createElement('h3'); h.textContent=(S.ui==='en'&&sec.titleEn)?sec.titleEn:sec.title; side.appendChild(h);
    sec.fields.forEach(f=>{
      const w=document.createElement('div'); w.className='fld';
      const lb2=document.createElement('label'); lb2.textContent=(S.ui==='en'&&f.labEn)?f.labEn:f.lab; w.appendChild(lb2);
      const inp=document.createElement(f.ta?'textarea':'input');
      inp.value=S.data[f.k]||''; inp.placeholder=(S.ui==='en'?(f.phEn||f.ph):(f.ph||f.phEn))||'';
      inp.oninput=()=>{ S.data[f.k]=inp.value; draw(); };
      w.appendChild(inp); side.appendChild(w);
    });
  });
}
function buildChips(){
  const tc=$('tplChips'); if(!tc) return; tc.innerHTML='';
  const isBack=t=>t.skin==='bBrand'||t.skin==='bServices'||t.skin==='bPlain';
  Object.keys(TEMPLATES).forEach(id=>{
    if(id==='_studio') return;
    const t=TEMPLATES[id];
    if(t.gen) return;                        /* 🖼️ library designs सिर्फ़ gallery में */
    if(isBack(t)!==(S.side==='back')) return;
    const w=document.createElement('div'); w.className='cchip';
    const b=document.createElement('button'); b.className='sbtn nm'+(activeTplId()===id?' on':'');
    b.textContent=(t.custom?'⭐ ':'')+t.name;
    b.onclick=()=>{ if(STU.open){ openStudio(id); } else { setActiveTpl(id); buildForm(); draw(); } };
    w.appendChild(b);
    if(t.custom){
      const m=document.createElement('div'); m.className='mini';
      const e=document.createElement('button'); e.textContent='✏️'; e.title='edit';
      e.onclick=(ev)=>{ ev.stopPropagation(); openStudio(id); };
      const del=document.createElement('button'); del.textContent='🗑️'; del.title='delete';
      del.onclick=(ev)=>{ ev.stopPropagation(); delete TEMPLATES[id]; persistCustomTpls();
        if(activeTplId()===id) setActiveTpl('simple'); buildForm(); draw(); toast(T('tTplDel')); };
      m.appendChild(e); m.appendChild(del); w.appendChild(m);
    }
    tc.appendChild(w);
  });
}

/* ================= 🎨 DESIGN STUDIO ================= */
const STKEY='logoTplsV1';
function loadCustomTpls(){ try{ const o=JSON.parse(localStorage.getItem(STKEY)||'{}');
  Object.keys(o).forEach(k=>o[k].custom=true); return o; }catch(_){ return {}; } }
function persistCustomTpls(){ const o={};
  Object.entries(TEMPLATES).forEach(([id,t])=>{ if(t.custom) o[id]=t; });
  localStorage.setItem(STKEY, JSON.stringify(o)); }
Object.assign(TEMPLATES, loadCustomTpls());

const STU={ open:false, editId:null, cfg:null, hist:[], hi:-1, clip:null, _nk:false, grid:false, snap:true, _guides:null, grpPick:null };
try{ STU.grid=localStorage.getItem('sk_grid')==='1'; if(localStorage.getItem('sk_snap')!=null) STU.snap=localStorage.getItem('sk_snap')==='1'; }catch(_){}
function stuSnap(){ if(!STU.cfg) return;
  const c=JSON.parse(JSON.stringify(STU.cfg)); delete c._selIdx;
  STU.hist=STU.hist.slice(0,STU.hi+1); STU.hist.push(JSON.stringify(c));
  if(STU.hist.length>40) STU.hist.shift(); STU.hi=STU.hist.length-1; }
function stuUndo(){ if(STU.hi>0){ STU.hi--; STU.cfg=JSON.parse(STU.hist[STU.hi]); STU.sel=null;
  renderStudio(); studioPreview(); toast('↩️ वापस'); } }
function stuRedo(){ if(STU.hi<STU.hist.length-1){ STU.hi++; STU.cfg=JSON.parse(STU.hist[STU.hi]); STU.sel=null;
  renderStudio(); studioPreview(); toast('↪️ आगे'); } }
/* ⌨️ Photoshop-style shortcuts (studio खुला हो तब) */
if(!window._KBW){ window._KBW=1; document.addEventListener('keydown',(ev)=>{
  if(!STU.open||!STU.cfg) return;
  const tg=(ev.target.tagName||'').toLowerCase();
  if(tg==='input'||tg==='textarea'||ev.target.isContentEditable) return;
  const k=ev.key.toLowerCase(), ct=ev.ctrlKey||ev.metaKey, e=STU.sel!=null?STU.cfg.els[STU.sel]:null;
  if(ct&&k==='z'&&!ev.shiftKey){ ev.preventDefault(); stuUndo(); }
  else if(ct&&(k==='y'||(k==='z'&&ev.shiftKey))){ ev.preventDefault(); stuRedo(); }
  else if((k==='delete'||k==='backspace')&&e){ ev.preventDefault();
    STU.cfg.els.splice(STU.sel,1); STU.sel=null; stuSnap(); renderStudio(); studioPreview(); toast('🗑️ हटाया'); }
  else if(ct&&k==='c'&&e){ STU.clip=JSON.parse(JSON.stringify(e)); toast('📋 नकल'); }
  else if(ct&&(k==='v'||k==='d')&&STU.clip){ ev.preventDefault();
    const n=JSON.parse(JSON.stringify(STU.clip)); n.x+=0.09; n.y+=0.09; delete n.grp;
    STU.cfg.els.push(n); stuSnap(); STU.sel=STU.cfg.els.length-1; renderStudio(); studioPreview(); toast('📄 चिपकाया'); }
  else if(k==='escape'){ STU.sel=null; STU.txSel=null; renderStudio(); studioPreview(); }
  else if(k.indexOf('arrow')===0&&e){ ev.preventDefault();
    if(STU._nkT) clearTimeout(STU._nkT); STU._nkT=setTimeout(()=>stuSnap(),700);
    const st=ev.shiftKey?0.05:0.01;
    if(k==='arrowleft')e.x-=st; if(k==='arrowright')e.x+=st;
    if(k==='arrowup')e.y-=st; if(k==='arrowdown')e.y+=st;
    studioPreview(); }
}); }
function studioOv(ctx,dm){   /* ▦ Corel grid + 🧲 snap guides — inch space */
  if(STU.grid){ const g=2/25.4; ctx.save(); ctx.lineWidth=0.004;
    for(let gx=g; gx<dm.w-0.001; gx+=g){ const maj=Math.round(gx*25.4)%10===0;
      ctx.strokeStyle=maj?'rgba(130,130,130,0.30)':'rgba(130,130,130,0.11)';
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,dm.h); ctx.stroke(); }
    for(let gy=g; gy<dm.h-0.001; gy+=g){ const maj=Math.round(gy*25.4)%10===0;
      ctx.strokeStyle=maj?'rgba(130,130,130,0.30)':'rgba(130,130,130,0.11)';
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(dm.w,gy); ctx.stroke(); }
    ctx.strokeStyle='rgba(255,80,80,0.35)'; ctx.setLineDash([0.04,0.04]);
    ctx.beginPath(); ctx.moveTo(dm.w/2,0); ctx.lineTo(dm.w/2,dm.h); ctx.moveTo(0,dm.h/2); ctx.lineTo(dm.w,dm.h/2); ctx.stroke(); ctx.restore(); }
  if(STU._guides){ ctx.save(); ctx.strokeStyle='#ff2d55'; ctx.lineWidth=0.008; ctx.setLineDash([0.02,0.02]);
    STU._guides.forEach(([k,v])=>{ ctx.beginPath(); if(k==='v'){ ctx.moveTo(v,0); ctx.lineTo(v,dm.h); } else { ctx.moveTo(0,v); ctx.lineTo(dm.w,v); } ctx.stroke(); }); ctx.restore(); }
}
function snapDrag(e,nx,ny,dm){   /* 🧲 magnet — card + दूसरी चीज़ों से चिपकाओ */
  const th=0.035, b=elBounds(e,dm.w,dm.h), ox=nx-e.x, oy=ny-e.y;
  const pts={x:[b.x+ox,b.x+ox+b.w/2,b.x+ox+b.w], y:[b.y+oy,b.y+oy+b.h/2,b.y+oy+b.h]};
  const tgt={x:[0,dm.w/2,dm.w], y:[0,dm.h/2,dm.h]};
  (STU.cfg.els||[]).forEach(o=>{ if(o===e||o.lock) return; const ob=elBounds(o,dm.w,dm.h);
    tgt.x.push(ob.x,ob.x+ob.w/2,ob.x+ob.w); tgt.y.push(ob.y,ob.y+ob.h/2,ob.y+ob.h); });
  let bx=null,by=null;
  pts.x.forEach(p=>{ tgt.x.forEach(tv=>{ const d=Math.abs(p-tv); if(d<th&&(!bx||d<bx.d)) bx={d,t:tv,off:tv-p}; }); });
  pts.y.forEach(p=>{ tgt.y.forEach(tv=>{ const d=Math.abs(p-tv); if(d<th&&(!by||d<by.d)) by={d,t:tv,off:tv-p}; }); });
  const gs=[]; let rx=nx,ry=ny;
  if(bx){ rx=nx+bx.off; gs.push(['v',bx.t]); }
  if(by){ ry=ny+by.off; gs.push(['h',by.t]); }
  STU._guides=gs.length?gs:null;
  return [rx,ry];
}
function studioPreview(){ TEMPLATES._studio=STU.cfg;
  if(STU.sel!=null) TEMPLATES._studio._selIdx=STU.sel; else delete TEMPLATES._studio._selIdx;
  window._recHits=true; window._txSel=STU.txSel||null;
  S.tplFront='_studio'; draw(); }
/* 🖱️ element drag (mouse + touch) */
let ELWIRED=false;
function attachElDrag(cv){
  cv.style.cursor='grab';
  const dm=cardDims();
  const toIn=(ev)=>{ const r=cv.getBoundingClientRect(); const p=(ev.touches&&ev.touches[0])||ev;
    return { x:(p.clientX-r.left)/r.width*dm.w, y:(p.clientY-r.top)/r.height*dm.h }; };
  const down=(ev)=>{ if(!STU.open||!STU.cfg) return; const p=toIn(ev); const els=STU.cfg.els||[];
    if(STU._rpDraw){ STU._stroke=[{x:p.x,y:p.y}]; STU._rpPts=STU._stroke.slice(); ev.preventDefault(); return; }
    /* ⚪ resize handle पकड़ा? */
    if(STU.txSel&&window._txHits&&window._txHits[STU.txSel]){ const hb=window._txHits[STU.txSel];
      if(Math.abs(p.x-(hb.x1+0.03))<0.12&&Math.abs(p.y-(hb.y1+0.03))<0.12){
        STU.txDrag={k:STU.txSel, sz0:((STU.cfg.sz||{})[STU.txSel]||1), x0:p.x};
        ev.preventDefault(); return; } }
    if(STU.sel!=null&&els[STU.sel]){ const eb=elBounds(els[STU.sel],dm.w,dm.h);
      if(Math.abs(p.x-(eb.x+eb.w+0.05))<0.12&&Math.abs(p.y-(eb.y+eb.h+0.05))<0.12){
        const e0=els[STU.sel];
        STU.elRs={i:STU.sel, w0:e0.w||e0.r||0.5, h0:e0.h||e0.r||0.5, sz0:e0.size||9, len0:e0.len||1, x0:p.x, y0:p.y};
        ev.preventDefault(); return; } }
    for(let i=els.length-1;i>=0;i--){ if(els[i].lock) continue; if(elHit(els[i],p.x,p.y,dm.w,dm.h)){
      if(STU.sel!==i){ STU._rpShape=null; STU._rpPts=null; STU._rpDraw=null; }
      STU.sel=i; STU.txSel=null; STU.drag={dx:p.x-els[i].x,dy:p.y-els[i].y};
      renderStudio(); studioPreview(); ev.preventDefault(); return; } }
    /* 👆 text पर click? */
    const th=window._txHits||{}; let role=null; const pad2=0.06;
    Object.keys(th).forEach(rr=>{ const b=th[rr];
      if(p.x>=b.x0-pad2&&p.x<=b.x1+pad2&&p.y>=b.y0-pad2&&p.y<=b.y1+pad2) role=rr; });
    if(role){ if(STU.txSel!==role){ STU.txSel=role; STU.sel=null; renderStudio(); studioPreview(); } ev.preventDefault(); return; }
    if(STU.sel!=null||STU.txSel){ STU.sel=null; STU.txSel=null; STU._rpShape=null; STU._rpPts=null; STU._rpDraw=null; renderStudio(); studioPreview(); } };
  cv.addEventListener('mousedown',down);
  cv.addEventListener('touchstart',down,{passive:false});
  if(ELWIRED) return; ELWIRED=true;
  document.addEventListener('mousemove',elDocMove);
  document.addEventListener('touchmove',elDocMove,{passive:false});
  document.addEventListener('mouseup',elDocUp);
  document.addEventListener('touchend',elDocUp);
}
function elDocMove(ev){
  if(STU._stroke){ const cv3=document.getElementById('cvF'); if(cv3){ const dm3=cardDims(); const r3=cv3.getBoundingClientRect(); const pp3=(ev.touches&&ev.touches[0])||ev;
    const x3=(pp3.clientX-r3.left)/r3.width*dm3.w, y3=(pp3.clientY-r3.top)/r3.height*dm3.h;
    const last=STU._stroke[STU._stroke.length-1];
    if(Math.hypot(x3-last.x,y3-last.y)>0.03){ STU._stroke.push({x:x3,y:y3}); STU._rpPts=STU._stroke.slice(); studioPreview(); } }
    if(ev.preventDefault) ev.preventDefault(); return; }
  if(STU.elRs&&STU.open&&STU.cfg){
    const cv3=document.getElementById('cvF'); if(!cv3) return;
    const dm3=cardDims(); const r3=cv3.getBoundingClientRect(); const pp3=(ev.touches&&ev.touches[0])||ev;
    const x3=(pp3.clientX-r3.left)/r3.width*dm3.w, y3=(pp3.clientY-r3.top)/r3.height*dm3.h;
    const ee=STU.cfg.els[STU.elRs.i]; if(!ee){ STU.elRs=null; return; }
    const cl2=(v,a,b)=>Math.max(a,Math.min(b,v));
    if(ee.ty==='text'){ ee.size=Math.round(cl2(STU.elRs.sz0+(x3-STU.elRs.x0)*14,4,28)*2)/2; }
    else if(ee.ty==='line'){ ee.len=Math.round(cl2(STU.elRs.len0+(x3-STU.elRs.x0),0.2,4)*100)/100; }
    else if(ee.ty==='mandala'){ ee.r=Math.round(cl2(STU.elRs.w0+(x3-STU.elRs.x0),0.1,2)*100)/100; }
    else if(ee.sh==='circle'||ee.ty==='img'||ee.ty==='qr'||ee.ty==='mala'){ const f2=cl2((STU.elRs.w0+(x3-STU.elRs.x0))/STU.elRs.w0,0.1,10);
      ee.w=Math.round(STU.elRs.w0*f2*100)/100; ee.h=Math.round(STU.elRs.h0*f2*100)/100; }
    else { ee.w=Math.round(cl2(STU.elRs.w0+(x3-STU.elRs.x0),0.08,4)*100)/100; ee.h=Math.round(cl2(STU.elRs.h0+(y3-STU.elRs.y0),0.08,3)*100)/100; }
    elLite(); ev.preventDefault(); return; }
  if(STU.txDrag&&STU.open&&STU.cfg){
    const cv2=document.getElementById('cvF'); if(!cv2) return;
    const dm2=cardDims(); const r2=cv2.getBoundingClientRect(); const pp=(ev.touches&&ev.touches[0])||ev;
    const xx=(pp.clientX-r2.left)/r2.width*dm2.w;
    if(!STU.cfg.sz) STU.cfg.sz={};
    STU.cfg.sz[STU.txDrag.k]=Math.round(Math.max(0.5,Math.min(1.8,STU.txDrag.sz0+(xx-STU.txDrag.x0)*1.4))*100)/100;
    studioPreview(); ev.preventDefault(); return; }
  if(!STU.drag||STU.sel==null||!STU.cfg||!STU.open) return;
  const cv=document.getElementById('cvF'); if(!cv) return;
  const dm=cardDims(); const r=cv.getBoundingClientRect(); const p=(ev.touches&&ev.touches[0])||ev;
  const x=(p.clientX-r.left)/r.width*dm.w, y=(p.clientY-r.top)/r.height*dm.h;
  const e=STU.cfg.els[STU.sel]; if(!e||e.lock) return;
  let nx=Math.max(-0.3,Math.min(dm.w+0.3,x-STU.drag.dx));
  let ny=Math.max(-0.3,Math.min(dm.h+0.3,y-STU.drag.dy));
  if(STU.grid){ const g=2/25.4; nx=Math.round(nx/g)*g; ny=Math.round(ny/g)*g; }   /* ▦ grid snap */
  if(STU.snap){ const rr=snapDrag(e,nx,ny,dm); nx=rr[0]; ny=rr[1]; } else STU._guides=null;   /* 🧲 */
  const ddx=nx-e.x, ddy=ny-e.y;
  if(e.grp){ (STU.cfg.els||[]).forEach(o=>{ if(o!==e&&o.grp===e.grp&&!o.lock){ o.x=Math.round((o.x+ddx)*100)/100; o.y=Math.round((o.y+ddy)*100)/100; } }); }
  e.x=Math.round(nx*100)/100; e.y=Math.round(ny*100)/100;
  elLite(); ev.preventDefault(); }
function elDocUp(){
  if(STU._stroke){ const pts2=STU._stroke; STU._stroke=null; STU._rpDraw=false;
    STU._rpPts=pts2.length>2?pts2:null;
    if(STU.open){ renderStudio(); studioPreview(); } return; }
  if(STU.elRs){ STU.elRs=null; if(STU.open){ stuSnap(); renderStudio(); studioPreview(); } return; }
  if(STU.txDrag){ STU.txDrag=null; if(STU.open){ stuSnap(); renderStudio(); studioPreview(); } return; }
  if(STU.drag){ STU.drag=null; STU._guides=null; if(STU.open){ stuSnap(); renderStudio(); studioPreview(); } } }
function elLite(){ TEMPLATES._studio=STU.cfg;
  if(STU.sel!=null) TEMPLATES._studio._selIdx=STU.sel; else delete TEMPLATES._studio._selIdx;
  const old=document.getElementById('cvF'); if(!old){ studioPreview(); return; }
  const cv=renderCard(VIEW_SCALE,'front'); cv.id='cvF'; cv.style.maxWidth='92%'; cv.style.height='auto';
  old.replaceWith(cv); attachElDrag(cv); }
function openStudio(baseId){
  window._studioOv=studioOv;
  if(!STU.open) STU.from=(S.tplFront!=='_studio')?S.tplFront:null;   /* 🧠 असली selection याद */
  const base=TEMPLATES[baseId||S.tplFront]||TEMPLATES.blank;
  STU.cfg=JSON.parse(JSON.stringify(base));
  STU.cfg.name=(baseId&&TEMPLATES[baseId].custom)?base.name:'';
  STU.editId=(baseId&&TEMPLATES[baseId].custom)?baseId:null;
  STU.sel=null; STU.drag=null; STU.txSel=null; STU.txDrag=null; STU.elRs=null; STU.hist=[]; STU.hi=-1;
  STU.open=true; renderStudio(); stuSnap(); studioPreview();
}
function closeStudio(){ window._studioOv=null; STU._guides=null; STU.grpPick=null; STU.open=false; $('studio').style.display='none';
  delete TEMPLATES._studio; if(S.tplFront==='_studio') S.tplFront=STU.editId||STU.from||'simple'; STU.from=null;
  STU.txSel=null; STU.txDrag=null; STU.elRs=null; window._recHits=false; window._txSel=null; window._txHits={};
  buildForm(); draw(); }
function renderStudio(){

  const c=STU.cfg;
  const H=(html)=>{ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; };

  const gbb=document.createElement('button'); gbb.className='sbtn'+(STU.grid?' on':''); gbb.textContent=T('elGrid');
  gbb.onclick=()=>{ STU.grid=!STU.grid; try{localStorage.setItem('sk_grid',STU.grid?'1':'0');}catch(_){} renderStudio(); studioPreview(); };
  const snb=document.createElement('button'); snb.className='sbtn'+(STU.snap?' on':''); snb.textContent=T('elSnap');
  snb.onclick=()=>{ STU.snap=!STU.snap; try{localStorage.setItem('sk_snap',STU.snap?'1':'0');}catch(_){} renderStudio(); };
  vw.querySelector('.stchips').appendChild(gbb); vw.querySelector('.stchips').appendChild(snb); st.appendChild(vw);
  /* रंग */
  st.appendChild(H('<h3>'+T('stColors')+'</h3>'));
  [['bg',T('stBg')],['accent',T('stAccent')],['tx',T('stTx')],['sub',T('stSub')]].forEach(([k,lb])=>{
    const r=H('<div class="clrrow"><label>'+lb+'</label><input type="color"></div>');
    const inp=r.querySelector('input'); inp.value=c[k]||'#334155';
    inp.oninput=()=>{ c[k]=inp.value; studioPreview(); };
    st.appendChild(r); });
  const hlr=H('<div class="clrrow"><label>'+T('stHalo')+'</label></div>');
  const hlb=document.createElement('button'); hlb.className='sbtn'+(c.halo?' on':''); hlb.textContent=c.halo?'✓ लगी':'नहीं';
  hlb.onclick=()=>{ c.halo=c.halo?null:{c:'rgba(255,242,218,0.50)',y:0.40,r:0.85}; stuSnap(); renderStudio(); studioPreview(); };
  hlr.appendChild(hlb); st.appendChild(hlr);
  /* ✒️ पैनल/initials रंग (bandLeft के CP जैसे) */
  const inir=H('<div class="clrrow"><label>'+T('stIni')+'</label><input type="color"></div>');
  const inii=inir.querySelector('input'); inii.value=c.ini||'#ffffff';
  inii.oninput=()=>{ c.ini=inii.value; studioPreview(); };

    if(e.ty==='img'){   /* 🔁 माला/घेरा — repeat part along circle/line/square */
      STU._rpShape=STU._rpShape||'circle'; STU._rpN=STU._rpN||20; STU._rpR=STU._rpR||1.15;

      const rpS=H('<div class="strow"><div class="stchips"></div></div>');
      [['circle','rpCircle'],['line','rpLine'],['square','rpSquare'],['custom','rpCust']].forEach(([v,kk])=>{
        const b=document.createElement('button'); b.className='sbtn'+(STU._rpShape===v?' on':''); b.textContent=T(kk);

      else if(STU._rpShape==='custom'&&STU._rpPts) st.appendChild(H('<p style="font-size:11px;color:#4ade80;margin:2px 0">'+T('rpReady')+'</p>'));
      mkRange(T('rpN'),3,60,1,()=>STU._rpN,v=>{STU._rpN=Math.round(v); STU._rpNTouched=true;});
      mkRange(T('rpR'),0.3,1.55,0.05,()=>STU._rpR,v=>STU._rpR=v);
      const rpC=H('<div class="strow"><div class="stchips"></div></div>');
      const tb=document.createElement('button'); tb.className='sbtn'+(STU._rpTang!==false?' on':''); tb.textContent=T('rpTang');
      tb.onclick=()=>{ STU._rpTang=STU._rpTang===false?true:false; renderStudio(); };
      rpC.querySelector('.stchips').appendChild(tb);
      const gb=document.createElement('button'); gb.className='sbtn on'; gb.textContent=T('rpGo'); gb.style.flex='1';
      gb.onclick=()=>{   /* ✓ जुड़ी माला — एक ही element, साथ हिलेगी/छोटी-बड़ी होगी */
        const dm9=cardDims(), cx=dm9.w/2, cy=dm9.h/2;
        const sdx=(e.x+(e.w||0.6)/2)-cx, sdy=(e.y+(e.h||0.6)/2)-cy, sdd=Math.hypot(sdx,sdy);
        let R=STU._rpR;
        if(sdd>0.25&&STU._rpShape!=='line'&&STU._rpShape!=='custom') R=sdd;   /* motive की जगह = माला का दायरा */
        const fitN=(pw)=>{ if(STU._rpNTouched) return STU._rpN;
          let L=2*Math.PI*R;
          if(STU._rpShape==='line') L=2*R; else if(STU._rpShape==='square') L=8*R;
          else if(STU._rpShape==='custom'&&STU._rpPts&&STU._rpPts.length>1){ L=0; for(let i2=1;i2<STU._rpPts.length;i2++) L+=Math.hypot(STU._rpPts[i2].x-STU._rpPts[i2-1].x,STU._rpPts[i2].y-STU._rpPts[i2-1].y); }
          return Math.max(3,Math.min(60,Math.round(L/(pw*0.9)))); };
        const pw0=Math.min(0.55,(e.w||0.6)*0.9);
        const ml={ty:'mala',src:e.src,shape:STU._rpShape,n:fitN(pw0),pw:pw0,tang:STU._rpTang!==false};
        if(sdd>0.25&&STU._rpShape==='circle') ml.a0=Math.atan2(sdy,sdx)*180/Math.PI;   /* आपके motive से शुरू */
        if(e.filt) ml.filt=e.filt;
        if(STU._rpShape==='line'){ const scy=e.y+(e.h||0.6)/2; ml.x=cx-R; ml.y=(sdd>0.25?scy:cy)-0.15; ml.w=2*R; ml.h=0.3; ml.pw=Math.min(ml.pw,0.3); }
        else if(STU._rpShape==='custom'){ const pp=STU._rpPts||[];
          if(pp.length<3) return;
          let mnx=9,mny=9,mxx=-9,mxy=-9;
          pp.forEach(q=>{ mnx=Math.min(mnx,q.x); mny=Math.min(mny,q.y); mxx=Math.max(mxx,q.x); mxy=Math.max(mxy,q.y); });
          ml.x=mnx; ml.y=mny; ml.w=Math.max(0.3,mxx-mnx); ml.h=Math.max(0.3,mxy-mny);
          ml.pts=pp.map(q=>[(q.x-mnx)/ml.w,(q.y-mny)/ml.h]);
          STU._rpPts=null; }
        else { ml.x=cx-R; ml.y=cy-R; ml.w=2*R; ml.h=2*R; }
        c.els.push(ml); STU.sel=c.els.length-1;
        stuSnap(); renderStudio(); studioPreview(); };
      const gb2=document.createElement('button'); gb2.className='sbtn'; gb2.textContent=T('rpGo2');
      gb2.onclick=()=>{
        const dm9=cardDims(), cx=dm9.w/2, cy=dm9.h/2, w=e.w||0.6, h=e.h||0.6;
        const N=(()=>{ if(STU._rpNTouched) return STU._rpN;
          let L=2*Math.PI*STU._rpR; if(STU._rpShape==='line') L=2*STU._rpR; else if(STU._rpShape==='square') L=8*STU._rpR;
          return Math.max(3,Math.min(60,Math.round(L/((e.w||0.6)*0.85)))); })();
        const R=STU._rpR, tang=STU._rpTang!==false;
        const base={ty:'img',src:e.src,w,h};
        if(e.filt) base.filt=e.filt;
        if(e.crop) base.crop=JSON.parse(JSON.stringify(e.crop));
        const made=[];
        if(STU._rpShape==='circle'){
          const sdx=(e.x+(e.w||0.6)/2)-cx, sdy=(e.y+(e.h||0.6)/2)-cy, sdd=Math.hypot(sdx,sdy);
          const R2=sdd>0.25?sdd:R, a02=sdd>0.25?Math.atan2(sdy,sdx):-Math.PI/2;
          for(let i2=0;i2<N;i2++){ const ang=a02+i2*2*Math.PI/N;
            const it=Object.assign({},base,{x:cx+R2*Math.cos(ang)-w/2,y:cy+R2*Math.sin(ang)-h/2});
            if(tang) it.rot=ang*180/Math.PI+90; made.push(it); }
        } else if(STU._rpShape==='line'){
          const L=R*2;
          for(let i2=0;i2<N;i2++){ const t=N===1?0.5:i2/(N-1);
            made.push(Object.assign({},base,{x:cx-L/2+t*L-w/2,y:cy-h/2})); }
        } else {
          const sd=R*2, k=Math.max(1,Math.round(N/4));
          const per=[];
          for(let i2=0;i2<k;i2++){ const t=i2/k;
            per.push([cx-sd/2+t*sd,cy-sd/2,0]); per.push([cx+sd/2,cy-sd/2+t*sd,90]);
            per.push([cx+sd/2-t*sd,cy+sd/2,180]); per.push([cx-sd/2,cy+sd/2-t*sd,270]); }
          per.slice(0,N).forEach(([px,py,rr])=>{ const it=Object.assign({},base,{x:px-w/2,y:py-h/2});
            if(tang) it.rot=rr; made.push(it); });
        }
        c.els.push(...made); STU.sel=c.els.length-made.length;
        stuSnap(); renderStudio(); studioPreview(); };
      rpC.querySelector('.stchips').appendChild(gb); rpC.querySelector('.stchips').appendChild(gb2);
      st.appendChild(rpC); }
    if(e.ty==='mala'){   /* 🔁 जुड़ी माला settings */
      const mlT=H('<div class="strow"><label>'+T('elRep')+'</label></div>'); st.appendChild(mlT);
      const chg=H('<div class="strow"><div class="stchips"></div></div>');
      const cb=document.createElement('button'); cb.className='sbtn'; cb.textContent=T('rpChg');
      cb.onclick=()=>{ STU._pickMala=e; openPartsPicker(); };
      chg.querySelector('.stchips').appendChild(cb); st.appendChild(chg);
      const mlS=H('<div class="strow"><div class="stchips"></div></div>');
      [['circle','rpCircle'],['line','rpLine'],['square','rpSquare'],['custom','rpCust']].forEach(([v,kk])=>{
        if(v==='custom'&&!e.pts) return;
        const b=document.createElement('button'); b.className='sbtn'+((e.shape||'circle')===v?' on':''); b.textContent=T(kk);
        b.onclick=()=>{ e.shape=v; renderStudio(); studioPreview(); };
        mlS.querySelector('.stchips').appendChild(b); });
      st.appendChild(mlS);
      mkRange(T('rpN'),3,60,1,()=>e.n||20,v=>e.n=Math.round(v));
      mkRange(T('rpPW'),0.15,1.0,0.05,()=>e.pw||0.5,v=>e.pw=v);
      if((e.shape||'circle')==='circle') mkRange(T('rpA0'),-180,180,1,()=>(e.a0!=null?e.a0:-90),v=>e.a0=v);
      const mlC=H('<div class="strow"><div class="stchips"></div></div>');
      const tb2=document.createElement('button'); tb2.className='sbtn'+(e.tang!==false?' on':''); tb2.textContent=T('rpTang');
      tb2.onclick=()=>{ e.tang=e.tang===false?true:false; renderStudio(); studioPreview(); };
      mlC.querySelector('.stchips').appendChild(tb2); st.appendChild(mlC);
      const mlF=H('<div class="strow"><label>'+T('elPCol')+'</label><div class="stchips"></div></div>');
      [['','pfGold'],['saturate(0) brightness(1.75)','pfSilver'],['hue-rotate(-20deg) saturate(1.3) brightness(1.08)','pfRose'],['hue-rotate(-14deg) brightness(0.85) saturate(1.15)','pfCopper'],['hue-rotate(-45deg) saturate(1.7)','pfRed'],['hue-rotate(80deg) saturate(1.15)','pfGreen'],['hue-rotate(190deg) saturate(1.1)','pfBlue'],['hue-rotate(245deg) saturate(1.1)','pfPurple'],['saturate(0.1) brightness(0.4)','pfBlack']].forEach(([f,kk])=>{
        const b=document.createElement('button'); b.className='sbtn'+((e.filt||'')===f?' on':''); b.textContent=T(kk);
        b.onclick=()=>{ e.filt=f||undefined; renderStudio(); studioPreview(); };
        mlF.querySelector('.stchips').appendChild(b); });
      st.appendChild(mlF); }
    if(e.ty!=='sparkle'&&e.ty!=='mandala'){
      const gl=H('<div class="strow"><label>'+T('stGlow')+'</label><div class="stchips"></div></div>');
      [[true,T('stOn')],[false,T('stOff')]].forEach(([v,lb])=>{ const b=document.createElement('button');
        b.className='sbtn'+(!!e.glow===v?' on':''); b.textContent=lb;
        b.onclick=()=>{ e.glow=v; renderStudio(); studioPreview(); };
        gl.querySelector('.stchips').appendChild(b); });
      st.appendChild(gl); }
    /* 📐 Align (Phase 2) */
    const dmA=cardDims();
    const alR=H('<div class="strow"><label>'+T('elAlign')+'</label><div class="stchips"></div></div>');
    const doAl=(fn)=>{ const b2=elBounds(e,dmA.w,dmA.h); fn(b2); e.x=Math.round(e.x*1000)/1000; e.y=Math.round(e.y*1000)/1000; stuSnap(); renderStudio(); studioPreview(); };
    [['⬅',b2=>e.x-=b2.x],['↔',b2=>e.x+=(dmA.w-b2.w)/2-b2.x],['➡',b2=>e.x+=dmA.w-(b2.x+b2.w)],
     ['⬆',b2=>e.y-=b2.y],['↕',b2=>e.y+=(dmA.h-b2.h)/2-b2.y],['⬇',b2=>e.y+=dmA.h-(b2.y+b2.h)]].forEach(([lb,fn])=>{
      const ab=document.createElement('button'); ab.className='sbtn'; ab.textContent=lb; ab.style.minWidth='30px';
      ab.onclick=()=>doAl(fn); alR.querySelector('.stchips').appendChild(ab); });
    st.appendChild(alR);
    /* 🔒 Lock */
    const lkR=H('<div class="strow"><label>'+T('elLock')+'</label><div class="stchips"></div></div>');
    [[false,T('stOff')],[true,T('stOn')]].forEach(([v,lb])=>{ const b3=document.createElement('button');
      b3.className='sbtn'+(!!e.lock===v?' on':''); b3.textContent=lb;
      b3.onclick=()=>{ e.lock=v; stuSnap(); renderStudio(); studioPreview(); };
      lkR.querySelector('.stchips').appendChild(b3); });
    st.appendChild(lkR);
    /* ⛓️ Ungroup */
    if(e.grp){ const ug=document.createElement('button'); ug.className='sbtn'; ug.textContent=T('elGrpOff');
      ug.onclick=()=>{ const gid=e.grp; c.els.forEach(o=>{ if(o.grp===gid) delete o.grp; }); stuSnap(); renderStudio(); studioPreview(); };
      const ugR=H('<div class="strow"><label>'+T('elGrp')+'</label><div class="stchips"></div></div>');
      ugR.querySelector('.stchips').appendChild(ug); st.appendChild(ugR); }
    const lr2=H('<div class="strow"><label>'+T('elLayer')+'</label><div class="stchips"></div></div>');
    const upB=document.createElement('button'); upB.className='sbtn'; upB.textContent=T('elUp');
    upB.onclick=()=>{ const i2=STU.sel; if(i2<c.els.length-1){ const tmp=c.els[i2]; c.els[i2]=c.els[i2+1]; c.els[i2+1]=tmp; STU.sel=i2+1; stuSnap(); renderStudio(); studioPreview(); } };
    const dnB=document.createElement('button'); dnB.className='sbtn'; dnB.textContent=T('elDn');
    dnB.onclick=()=>{ const i2=STU.sel; if(i2>0){ const tmp=c.els[i2]; c.els[i2]=c.els[i2-1]; c.els[i2-1]=tmp; STU.sel=i2-1; stuSnap(); renderStudio(); studioPreview(); } };
    lr2.querySelector('.stchips').appendChild(upB); lr2.querySelector('.stchips').appendChild(dnB);
    st.appendChild(lr2);
    const dl=H('<div class="stbtns"></div>'); const db=document.createElement('button');
    db.className='sbtn'; db.textContent=T('elDel');
    db.onclick=()=>{ c.els.splice(STU.sel,1); STU.sel=null; stuSnap(); renderStudio(); studioPreview(); };
    dl.appendChild(db); st.appendChild(dl);
    st.appendChild(H('<p style="font-size:11px;color:#8ea0b5;margin:6px 0">'+T('elDragHint')+'</p>'));
  }
  /* buttons */
  const bt=H('<div class="stbtns"></div>');
  const mk=(lb,fn)=>{ const b=document.createElement('button'); b.className='sbtn'; b.textContent=lb; b.onclick=fn; bt.appendChild(b); };
  mk(T('stSave'),()=>{
    if(!c.name||!c.name.trim()){ toast(T('tNeedName')); return; }
    const id=STU.editId||('c'+Date.now().toString(36));
    const cl=JSON.parse(JSON.stringify(Object.assign({},c,{custom:true}))); delete cl._selIdx;
    TEMPLATES[id]=cl;
    S.tplFront=id;
    persistCustomTpls(); STU.editId=id;
    buildForm(); draw(); toast(T('tTplSaved'));
  });
  mk(T('stExport'),()=>{
    if(!c.name||!c.name.trim()){ toast(T('tNeedName')); return; }
    dl('design-'+c.name.replace(/\s+/g,'-')+'.json',
       URL.createObjectURL(new Blob([JSON.stringify({app:'sanskriti-vc-tpl',v:1,tpl:c},null,1)],{type:'application/json'})));
  });
  mk(T('stImport'),()=>$('fileTpl').click());
  if(STU.editId) mk(T('stDel'),()=>{ delete TEMPLATES[STU.editId]; persistCustomTpls(); closeStudio(); toast(T('tTplDel')); });
  st.appendChild(bt);
}
$('fileTpl').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    if(o.app!=='sanskriti-vc-tpl'||!o.tpl) throw 0;
    const id='c'+Date.now().toString(36);
    TEMPLATES[id]=Object.assign({},o.tpl,{custom:true});
    persistCustomTpls(); buildForm(); draw(); toast(T('tTplImp'));
  }catch(_){ toast(T('tTplBad')); } };
  rd.readAsText(f);
};

  const grid=H('<div class="galgrid"></div>'); g.appendChild(grid);
  const ids=Object.keys(TEMPLATES).filter(id=>TEMPLATES[id].gen&&!TEMPLATES[id].custom);
  let n=0;
  ids.forEach(id=>{
    const t=TEMPLATES[id];
    if(GALF==='pat'){ if(!t.pat||t.pat.ty==='none') return; }
    else if(GALF==='prem'){ if(!t.prem) return; }
    else if(GALF!=='all'&&t.skin!==GALF) return;
    n++;
    const card=H('<div class="galcard"></div>');
    const cv=renderCard(150,'front',id);
    card.appendChild(cv);
    card.appendChild(H('<div class="nm">'+t.name+'</div>'));
    card.appendChild(H('<div class="no">#'+n+'</div>'));
    card.onclick=()=>{ S.side='front'; setActiveTpl(id); $('gallery').style.display='none';
      buildForm(); draw(); toast(T('galPick')); };
    grid.appendChild(card);
  });
}

/* ================= 💾 SAVE / LOAD / EXPORT ================= */
/* 📌 PNG में DPI लिखो (pHYs) — Corel/Photoshop में exact inch size खुले */
const _crcT=(()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function _crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=_crcT[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function pngDpi(dataUrl,dpi){
  const bin=atob(dataUrl.split(',')[1]), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const ppm=Math.round(dpi/0.0254), chunk=new Uint8Array(21), dv=new DataView(chunk.buffer);
  dv.setUint32(0,9); chunk.set([0x70,0x48,0x59,0x73],4);   /* 'pHYs' */
  dv.setUint32(8,ppm); dv.setUint32(12,ppm); chunk[16]=1;
  dv.setUint32(17,_crc32(chunk.subarray(4,17)));
  const out=new Uint8Array(u8.length+21);
  out.set(u8.subarray(0,33),0); out.set(chunk,33); out.set(u8.subarray(33),54);
  let st=''; for(let i=0;i<out.length;i+=0x8000) st+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));
  return 'data:image/png;base64,'+btoa(st);
}
function dl(name,url){ const a=document.createElement('a'); a.download=name; a.href=url; a.click(); }
$('btnSave').onclick=()=>{
  const o={app:'sanskriti-logo-maker', v:1, tplFront:S.tplFront, ui:S.ui, data:S.data};
  dl('logo-'+(S.data.biz||'mera').replace(/\s+/g,'-')+'.json',
     URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})));
  toast(T('tSave'));
};
$('btnLoad').onclick=()=>$('fileLoad').click();
$('fileLoad').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    if(o.app!=='sanskriti-logo-maker') throw 0;
    if(o.tplFront) S.tplFront=o.tplFront;
    if(!TEMPLATES[S.tplFront]) S.tplFront='blank';
    if(o.ui){ S.ui=o.ui; applyLang(); }
    S.data=Object.assign(blankCard(),o.data||{});
    buildForm(); draw(); toast(T('tLoad'));
  }catch(_){ toast(T('tBad')); } };
  rd.readAsText(f);
};
$('fileLogo').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ S.data.logo=rd.result; buildForm(); draw(); toast(T('tLogo')); };
  rd.readAsDataURL(f);
};
/* 🖨️ direct print — exact-size image + @page, browser dialog से सीधे printer */
function directPrint(side){
  if(document.fonts&&!directPrint._ok){ directPrint._ok=1; toast('🔤 fonts...');
    document.fonts.ready.then(()=>directPrint(side)); return; }
  const sh=SHEETS[S.sheet];
  const pa=document.getElementById('printArea');
  pa.innerHTML='';
  const img=new Image();
  img.src=renderSheet(PRINT_DPI,S.sheet,side).toDataURL('image/png');
  img.style.width=sh.w+'in'; img.style.height=sh.h+'in';
  pa.appendChild(img);
  document.getElementById('pageStyle').textContent='@page{ size:'+sh.w+'in '+sh.h+'in; margin:0; }';
  toast(T('tPrint').replace('SHEETNAME',sh.n));
  img.onload=()=>{ setTimeout(()=>{ window.print(); },60); };
}
/* ⬇️ दो export: Web 1024px (transparent) + Print 3000px @300DPI (10in) */
$('btnPngW').onclick=()=>{
  dl('logo-web-1024.png', renderCard(307.2,'front').toDataURL('image/png'));
  toast(T('tPngW'));
};
$('btnPngP').onclick=()=>{
  dl('logo-print-3000.png', pngDpi(renderCard(900,'front').toDataURL('image/png'),300));
  toast(T('tPngP'));
};
$('btnSample').onclick=()=>{
  S.data={ biz:'CSC Print Cafe', tag:'Printing • Laser • Design', logo:null };
  buildForm(); draw(); toast(T('tSample'));
};
function applyLang(){
  document.documentElement.lang=S.ui;
  $('btnLang').textContent=T('langBtn');
  $('btnSave').textContent=T('save');
  $('btnLoad').textContent=T('load');
  $('btnSample').textContent=T('sample');
  $('btnPngW').textContent=T('pngW');
  $('btnPngP').textContent=T('pngP');
  buildForm(); draw();
}
$('btnLang').onclick=()=>{ S.ui=(S.ui==='hi')?'en':'hi'; applyLang(); };

applyLang();
$('btnSample').click();
