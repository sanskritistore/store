<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8E2A32">
<title>संस्कृति — श्रेणी</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/store.css"></head><body>
<header id="hd"></header>
<section class="sec wrap"><h2 id="t"></h2><p class="sub" id="d"></p>
 <input class="search" id="q" placeholder="🔍 खोजें...">
 <div class="grid" id="list"></div>
 <div class="empty" id="cyberbox" style="display:none">
  <div style="font-size:52px">🖨️</div><h3 style="margin:10px 0">साइबर सेवाएँ</h3>
  <p>प्रिंटिंग • पासपोर्ट फोटो • लैमिनेशन • स्पाइरल बाइंडिंग<br>ऑनलाइन फॉर्म • लेज़र एनग्रेविंग</p>
  <a class="btn btn-wa" id="cyberwa" target="_blank" style="margin-top:16px">WhatsApp पर पूछें</a></div>
</section>
<footer id="ft"></footer>
<script src="assets/js/store.js"></script>
<script>(async()=>{await loadCfg();
 const id=qp('c'),cat=CFG.cats.find(x=>x.id===id)||CFG.cats[0];
 if(cat.custom){location.href='frames.html'}
 shell(id);$('#t').textContent=cat.name;$('#d').textContent=cat.desc;
 document.title='संस्कृति — '+cat.name;
 const items=CFG.prods.filter(p=>p.cat===id);
 const render=q=>{$('#list').innerHTML=items.filter(p=>!q||(p.name+p.en).toLowerCase().includes(q.toLowerCase())).map(pCard).join('')
  ||'<div class="empty">कोई product नहीं मिला 😕</div>'};
 render('');$('#q').oninput=e=>render(e.target.value);
 if(!items.length){$('#cyberbox').style.display='block';$('#cyberwa').href=wa('नमस्ते! मुझे '+cat.name+' के बारे में जानकारी चाहिए।')}
})();</script></body></html>
