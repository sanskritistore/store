<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8E2A32">
<title>संस्कृति — फ्रेम preview</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/store.css"></head><body>
<header id="hd"></header>
<section class="pv wrap">
 <div class="stage" id="stage">
  <div class="fr" id="fr"><div class="fr-photo"><img id="ph" alt="आपकी फोटो"></div></div>
 </div>
 <div class="pnl">
  <h2 id="fname" style="font-size:24px"></h2>
  <div class="rt" id="frate"></div>
  <label class="up" style="margin-top:12px">📤 अपनी फोटो अपलोड करें
   <input type="file" id="file" accept="image/*" hidden></label>
  <h3>फोटो सेट करें</h3>
  <div class="ctl"><label>Zoom <span id="zv"></span></label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
  <div class="ctl"><label>बाएँ ↔ दाएँ</label><input type="range" id="mx" min="-50" max="50" value="0"></div>
  <div class="ctl"><label>ऊपर ↕ नीचे</label><input type="range" id="my" min="-50" max="50" value="0"></div>
  <div class="row"><button class="btn btn-o" id="rot">🔄 घुमाएँ</button>
   <button class="btn btn-o" id="wall">🏠 दीवार पर देखें</button>
   <button class="btn btn-o" id="rst">↺ Reset</button></div>
  <h3>साइज़ चुनें</h3><div class="sizes" id="sz"></div>
  <h3>Acrylic थिकनेस</h3><div class="sizes" id="th"></div>
  <div class="pricebox"><div><span class="p" id="pr"></span> <s id="mrp"></s>
   <div class="m">प्रिंट + फ्रेम + पैकिंग शामिल</div></div></div>
  <div style="display:grid;gap:10px">
   <button class="btn btn-p btn-b" id="add">🛒 कार्ट में डालें</button>
   <a class="btn btn-wa btn-b" id="ord" target="_blank">📱 WhatsApp पर ऑर्डर करें</a></div>
  <p class="note">ऑर्डर के बाद अपनी फोटो WhatsApp chat में भेज दें — हम HD quality में प्रिंट करेंगे ✅</p>
 </div>
</section>
<footer id="ft"></footer>
<script src="assets/js/store.js"></script>
<script>(async()=>{await loadCfg();shell('frames');
 const F=CFG.frames.frames.find(f=>f.id===qp('frame'))||CFG.frames.frames[0];
 const cfg=CFG.frames;
 let z=1,x=0,y=0,r=0,size=cfg.sizes[3],th=cfg.thickness[0];
 $('#fr').className='fr shp-'+F.shape+' '+F.style;
 $('#fname').textContent=F.name;$('#frate').textContent='⭐ '+F.rating+' • '+F.en;
 $('#ph').src=cfg.demo[0];
 document.title='संस्कृति — '+F.name;
 function apply(){$('#ph').style.transform=`translate(${x}%,${y}%) scale(${z}) rotate(${r}deg)`;
  $('#zv').textContent=Math.round(z*100)+'%'}
 function price(){const p=Math.round(F.base*size.mul*th.mul/10)*10;
  $('#pr').textContent=fmt(p);$('#mrp').textContent=fmt(p*1.3);
  $('#ord').href=wa(`नमस्ते! मुझे ये फ्रेम ऑर्डर करना है:\n\n🖼️ फ्रेम: ${F.name}\n📐 साइज़: ${size.label}\n🧱 थिकनेस: ${th.mm}mm\n💰 कीमत: ${fmt(p)}\n\nमैं अपनी फोटो इसी chat में भेज रहा/रही हूँ।`);return p}
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=ev=>{$('#ph').src=ev.target.result};rd.readAsDataURL(f)};
 $('#zoom').oninput=e=>{z=+e.target.value;apply()};
 $('#mx').oninput=e=>{x=+e.target.value;apply()};
 $('#my').oninput=e=>{y=+e.target.value;apply()};
 $('#rot').onclick=()=>{r=(r+90)%360;apply()};
 $('#rst').onclick=()=>{z=1;x=0;y=0;r=0;$('#zoom').value=1;$('#mx').value=0;$('#my').value=0;apply()};
 $('#wall').onclick=()=>$('#stage').classList.toggle('wall');
 $('#sz').innerHTML=cfg.sizes.map(s=>`<button class="chip ${s.id===size.id?'on':''}" data-id="${s.id}">${s.label}</button>`).join('');
 $('#th').innerHTML=cfg.thickness.map(t=>`<button class="chip ${t.mm===th.mm?'on':''}" data-mm="${t.mm}">${t.mm}mm</button>`).join('');
 $$('#sz .chip').forEach(c=>c.onclick=()=>{$$('#sz .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');size=cfg.sizes.find(s=>s.id===c.dataset.id);price()});
 $$('#th .chip').forEach(c=>c.onclick=()=>{$$('#th .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');th=cfg.thickness.find(t=>t.mm==c.dataset.mm);price()});
 $('#add').onclick=()=>{const c=cartGet();
  c.push({t:'f',fid:F.id,size:size.label,th:th.mm,price:price(),qty:1});cartSet(c);toast('कार्ट में जुड़ गया! 🛒')};
 apply();price();
})();</script></body></html>
