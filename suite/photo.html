<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Photo Studio — Sanskriti Print Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#6b1f2a; --maroon-dark:#4a141d; --gold:#c9a227; --ivory:#fdf8ef; --ink:#2b2118; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Mukta',sans-serif; background:var(--ivory); color:var(--ink); }
  header { background:linear-gradient(135deg,var(--maroon-dark),var(--maroon)); color:var(--ivory);
    padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:3px solid var(--gold);
    position:sticky; top:0; z-index:50; }
  header a { color:var(--gold-light,#e8c862); text-decoration:none; font-size:20px; }
  header h1 { font-size:18px; font-weight:700; }
  main { max-width:560px; margin:0 auto; padding:16px 14px 60px; }

  .step-title { font-size:15px; font-weight:700; color:var(--maroon); margin:14px 0 8px; }
  .sizes { display:flex; flex-wrap:wrap; gap:8px; }
  .size-chip { border:2px solid #e6d9bd; background:#fff; border-radius:10px; padding:8px 12px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .size-chip.on { border-color:var(--gold); background:#fff8e6; color:var(--maroon); }
  .size-chip small { display:block; font-weight:400; opacity:.65; font-size:11px; }

  .upload-zone { margin-top:14px; border:2px dashed var(--gold); border-radius:14px; background:#fff;
    padding:34px 16px; text-align:center; cursor:pointer; }
  .upload-zone .big { font-size:38px; }
  .upload-zone p { font-size:14px; font-weight:600; margin-top:6px; }
  .upload-zone small { opacity:.65; font-size:12px; }

  .editor { display:none; margin-top:14px; }
  .crop-wrap { position:relative; margin:0 auto; background:#222; border-radius:10px; overflow:hidden;
    touch-action:none; user-select:none; }
  .crop-wrap canvas { display:block; }
  .guide { position:absolute; pointer-events:none; border:2px dashed rgba(255,255,255,.85);
    border-radius:50%; box-shadow:0 0 0 9999px rgba(0,0,0,.35); }
  .guide-line { position:absolute; left:0; right:0; pointer-events:none;
    border-top:1px dashed rgba(255,255,255,.5); }

  .controls { margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row label { font-size:13px; font-weight:600; min-width:52px; }
  input[type=range] { flex:1; accent-color:var(--maroon); }
  .btn { border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit; }
  .btn-main { background:var(--maroon); color:#fff; flex:1; }
  .btn-gold { background:var(--gold); color:#3a2c00; }
  .btn-soft { background:#f3ead6; color:var(--ink); border:1px solid #e2d3b4; }
  .btn:active { transform:scale(.97); }
  .bg-dots { display:flex; gap:8px; }
  .bg-dot { width:30px; height:30px; border-radius:50%; border:2px solid #ccc; cursor:pointer; }
  .bg-dot.on { border-color:var(--maroon); box-shadow:0 0 0 2px #fff,0 0 0 4px var(--maroon); }

  .sheet-area { display:none; margin-top:16px; }
  .sheet-preview { background:#fff; border:1px solid #e6d9bd; border-radius:10px; padding:10px; text-align:center; }
  .sheet-preview canvas { max-width:100%; height:auto; border:1px solid #ddd; }
  .info { font-size:13px; margin:8px 0; opacity:.8; }
  #tray { display:flex; gap:10px; overflow-x:auto; padding:8px 2px; }
  .trayItem { flex:0 0 auto; background:#fff; border:1px solid #e6d9bd; border-radius:10px; padding:6px; text-align:center; width:92px; }
  .trayThumb { width:64px; height:auto; border-radius:6px; border:1px solid #ddd; }
  .chipsRow { display:flex; gap:3px; justify-content:center; margin-top:5px; flex-wrap:wrap; }
  .chip { border:1px solid #d9c9a3; background:#fffdf6; border-radius:6px; font-size:11px; padding:2px 7px; cursor:pointer; font-family:inherit; }
  .chip.on { background:var(--gold); color:#3a2c00; font-weight:700; }
  .trayCount { font-size:12px; font-weight:700; color:var(--maroon); margin-top:3px; }
  .trayQuick { display:none; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; font-weight:700; color:var(--maroon); margin:8px 0 2px; }
  .trayTools { display:flex; gap:4px; justify-content:center; margin-top:4px; }
  .trayTools button { border:none; background:#f3ead6; border:1px solid #e2d3b4; border-radius:6px; font-size:12px; padding:2px 8px; cursor:pointer; font-family:inherit; }
  .slotX { position:absolute; width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.94); color:#7a1f2b; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #d9a3a3; box-shadow:0 1px 3px rgba(0,0,0,.3); z-index:5; }
  #overWarn { display:none; background:#fff4e5; border:1px solid #f0d9a8; color:#8a5a00; border-radius:8px; padding:8px 10px; font-size:12px; margin-top:8px; }
  #err { display:none; background:#fdecea; color:#a02c2c; border:1px solid #f5c6c0; border-radius:8px;
    padding:10px 12px; font-size:13px; margin-top:12px; }
  #busy { display:none; position:fixed; inset:0; background:rgba(43,33,24,.55); z-index:99;
    align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:600;
    text-align:center; padding:20px; }
</style>
</head>
<body>

<header>
  <a href="index.html">←</a>
  <h1>📷 Photo Studio</h1>
</header>

<main>
  <div class="step-title">1. Size चुनें</div>
  <div class="sizes" id="sizeList"></div>

  <div class="upload-zone" id="uploadZone">
    <div class="big">📤</div>
    <p id="uploadTitle">2. Photo डालें (tap करें)</p>
    <small>Photo आपके device से बाहर नहीं जाती 🔒</small>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="editor" id="editor">
    <div class="step-title" id="editorTitle">3. Photo ठीक करें — चेहरा गोले में रखें</div>
    <div class="crop-wrap" id="cropWrap">
      <canvas id="cropCanvas"></canvas>
      <div class="guide" id="guide"></div>
      <div class="guide-line" id="guideTop"></div>
      <div class="guide-line" id="guideBottom"></div>
    </div>
    <div class="controls">
      <div class="row">
        <label>Zoom</label>
        <input type="range" id="zoom" min="50" max="300" value="100">
      </div>
      <div class="row">
        <button class="btn btn-soft" id="rotateBtn">↻ घुमाएँ</button>
        <button class="btn btn-soft" id="enhanceBtn">✨ Auto Enhance</button>
        <button class="btn btn-soft" id="bgBtn">🖼️ BG हटाएँ</button>
      </div>
      <div class="row" id="bgRow" style="display:none">
        <label>BG रंग</label>
        <div class="bg-dots" id="bgDots"></div>
      </div>
      <div class="row">
        <button class="btn btn-main" id="nextBtn">आगे — Sheet बनाएँ →</button>
      </div>
    </div>
  </div>

  <div class="sheet-area" id="sheetArea">
    <div class="step-title">4. Print Sheet (300 DPI)</div>
    <div class="sizes" id="sheetList" style="margin-bottom:10px"></div>
    <div class="trayQuick" id="trayQuick"></div>
    <div id="tray"></div>
    <button class="btn btn-soft" id="addPhotoBtn" style="width:100%">＋ और photo जोड़ें (अलग-अलग photos — bank वाला काम)</button>
    <div id="overWarn"></div>
    <div class="sheet-preview">
      <div id="previewWrap" style="position:relative;display:inline-block">
        <canvas id="sheetPreview"></canvas>
      </div>
      <div class="info" id="sheetInfo"></div>
    </div>
    <div class="info" style="font-size:12px;opacity:.65">💡 किसी photo को हटाने के लिए उसके कोने के ✕ को दबाएँ — जितनी चाहिए उतनी रखें</div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-main" id="dlBtn">⬇️ Sheet डाउनलोड (JPG)</button>
      <button class="btn btn-gold" id="printBtn">🖨️ Print</button>
    </div>
    <div class="row" id="kbRow" style="margin-top:8px;display:none">
      <button class="btn btn-soft" id="kbBtn" style="flex:1"></button>
    </div>
  </div>

  <div id="err"></div>
  <span id="cfgBadge"></span>
</main>

<div id="busy">⏳ काम हो रहा है...<br><small id="busyMsg"></small></div>

<script src="js/core-config.js"></script>
<script src="js/core-photo.js"></script>
<script src="js/core-sheet.js"></script>
<script src="js/ai-bg.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const err = (m) => { const e = $("err"); e.style.display = m ? "block" : "none"; e.textContent = m || ""; };
  const busy = (on, msg) => { $("busy").style.display = on ? "flex" : "none"; $("busyMsg").textContent = msg || ""; };

  await SUITE.load();
  SUITE.badge($("cfgBadge"));

  // ---------- state ----------
  let sel = null;            // चुना हुआ size config
  let src = null;            // काम कर रही photo (canvas)
  let tx = { scale: 1, x: 0, y: 0 };  // crop window पर image का transform
  let baseScale = 1;
  let sheet = null, sheetOut = null;
  let tray = [];             // sheet पर जाने वाली photos: [{img,w,h,copies}]
  let traySrcId = -1, curSrcId = 0;  // नई upload पर tray reset करने के लिए
  let adding = false;        // "और photo जोड़ें" mode
  let editingIdx = -1;       // tray की कौनसी photo फिर से crop हो रही है (-1 = कोई नहीं)

  // ---------- 1. sizes ----------
  const sizes = (SUITE.cfg.sizes.photo_sizes || []);
  const sizeList = $("sizeList");
  sizes.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "size-chip" + (i === 0 ? " on" : "");
    b.innerHTML = s.label + "<small>" + s.w_mm + "×" + s.h_mm + " mm" + (s.kb_limit ? " · " + s.kb_limit[0] + "–" + s.kb_limit[1] + "KB" : "") + "</small>";
    b.onclick = () => {
      sizeList.querySelectorAll(".size-chip").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      sel = s;
      tray = []; traySrcId = -1; $("sheetArea").style.display = "none"; // size बदला तो पुरानी crops रद्द
      if (src) setupCrop();
    };
    sizeList.appendChild(b);
  });
  sel = sizes[0];

  // ---------- 2. upload ----------
  $("uploadZone").onclick = () => $("fileInput").click();
  $("fileInput").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    err("");
    busy(true, "Photo खुल रही है...");
    try {
      src = await SUITE_PHOTO.load(f);
      src = SUITE_PHOTO.trimMargins(src);
      curSrcId++;
      $("editor").style.display = "block";
      $("sheetArea").style.display = "none";
      setupCrop();
      $("editor").scrollIntoView({ behavior: "smooth" });
    } catch (ex) { err(ex.message); }
    busy(false);
  };

  // ---------- 3. crop editor ----------
  const wrap = $("cropWrap"), cvs = $("cropCanvas");
  let winW = 0, winH = 0;

  function setupCrop() {
    const maxW = Math.min(360, window.innerWidth - 28);
    winW = maxW;
    winH = Math.round((maxW * sel.h_mm) / sel.w_mm);
    wrap.style.width = winW + "px";
    wrap.style.height = winH + "px";
    cvs.width = winW; cvs.height = winH;
    baseScale = Math.max(winW / src.width, winH / src.height);
    tx.scale = baseScale;
    tx.x = (winW - src.width * tx.scale) / 2;
    tx.y = (winH - src.height * tx.scale) / 2;
    $("zoom").value = 100;
    placeGuide();
    draw();
  }

  function placeGuide() {
    const g = $("guide");
    let gh = winH * 0.6, gy = winH * 0.5;
    if (sel.head_pct) {
      gh = winH * ((sel.head_pct[0] + sel.head_pct[1]) / 2 / 100);
      gy = winH * 0.52;
    }
    g.style.width = gh * 0.78 + "px";
    g.style.height = gh + "px";
    g.style.left = (winW - gh * 0.78) / 2 + "px";
    g.style.top = gy - gh / 2 + "px";
    $("guideTop").style.top = gy - gh / 2 + "px";
    $("guideBottom").style.top = gy + gh / 2 + "px";
  }

  function draw() {
    const ctx = cvs.getContext("2d");
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, winW, winH);
    ctx.drawImage(src, tx.x, tx.y, src.width * tx.scale, src.height * tx.scale);
  }

  // drag (pointer events — mouse + touch दोनों)
  let drag = null;
  wrap.addEventListener("pointerdown", (e) => { drag = { x: e.clientX - tx.x, y: e.clientY - tx.y }; wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener("pointermove", (e) => { if (!drag) return; tx.x = e.clientX - drag.x; tx.y = e.clientY - drag.y; draw(); });
  wrap.addEventListener("pointerup", () => (drag = null));

  $("zoom").oninput = (e) => {
    let ns = baseScale * (e.target.value / 100);
    if (ns < baseScale) ns = baseScale; // image window se chhoti nahi — khali kinare nahi
    const cx = winW / 2, cy = winH / 2; // center से zoom
    tx.x = cx - ((cx - tx.x) / tx.scale) * ns;
    tx.y = cy - ((cy - tx.y) / tx.scale) * ns;
    tx.scale = ns;
    draw();
  };

  $("rotateBtn").onclick = () => {
    const r = document.createElement("canvas");
    r.width = src.height; r.height = src.width;
    const c = r.getContext("2d");
    c.translate(r.width / 2, r.height / 2);
    c.rotate(Math.PI / 2);
    c.drawImage(src, -src.width / 2, -src.height / 2);
    src = r;
    setupCrop();
  };

  $("enhanceBtn").onclick = () => { SUITE_PHOTO.autoEnhance(src); draw(); };

  // bg removal (lazy, fail-soft)
  let bgHex = "#ffffff";
  $("bgBtn").onclick = async () => {
    busy(true, "AI background हटा रहा है — पहली बार ~30MB model download होगा");
    err("");
    try {
      const cut = await SUITE_BG.remove(src);
      src = SUITE_BG.flatten(cut, bgHex);
      $("bgRow").style.display = "flex";
      setupCrop();
    } catch (ex) {
      err("⚠️ " + ex.message + " — नेट check करें या बिना BG बदले आगे बढ़ें।");
    }
    busy(false);
  };

  (SUITE.cfg.sizes.bg_colors || []).forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "bg-dot" + (i === 0 ? " on" : "");
    d.style.background = c.hex;
    d.title = c.label;
    d.onclick = () => {
      document.querySelectorAll(".bg-dot").forEach((x) => x.classList.remove("on"));
      d.classList.add("on");
      bgHex = c.hex;
    };
    $("bgDots").appendChild(d);
  });

  // ---------- 4. sheet (multi-photo tray) ----------
  $("nextBtn").onclick = () => {
    const ph = exportPhoto();
    if (editingIdx >= 0) {
      tray[editingIdx].img = ph.cv;   // फिर से crop — नई image, copies वही
      tray[editingIdx].orig = src;
      editingIdx = -1;
    } else if (adding) {
      tray.push({ img: ph.cv, orig: src, w: ph.w, h: ph.h, copies: 1 }); // नई photo: 1 copy से शुरू
      adding = false;
      $("uploadTitle").textContent = "2. Photo डालें (tap करें)";
    } else if (!tray.length || traySrcId !== curSrcId) {
      tray = [{ img: ph.cv, orig: src, w: ph.w, h: ph.h, copies: null }]; // null = पूरी sheet भरें
      traySrcId = curSrcId;
    } else {
      tray[0].img = ph.cv; tray[0].orig = src; tray[0].w = ph.w; tray[0].h = ph.h; // वही photo — crop update
    }
    $("editorTitle").textContent = "3. Photo ठीक करें — चेहरा गोले में रखें";
    $("nextBtn").textContent = "आगे — Sheet बनाएँ →";
    $("sheetArea").style.display = "block";
    buildSheets();
    $("sheetArea").scrollIntoView({ behavior: "smooth" });
  };

  $("addPhotoBtn").onclick = () => {
    adding = true;
    $("sheetArea").style.display = "none";
    $("editor").style.display = "none";
    $("uploadTitle").textContent = "नई photo डालें — sheet में जुड़ेगी";
    $("editorTitle").textContent = "✂️ नई photo CROP करें (zoom से चेहरा ठीक करें), फिर नीचे button दबाएँ";
    $("nextBtn").textContent = "✓ Sheet में जोड़ें";
    $("uploadZone").scrollIntoView({ behavior: "smooth" });
    $("fileInput").click();
  };

  function exportPhoto() {
    const out = SUITE.sizePx(sel);
    const sx = Math.max(0, -tx.x / tx.scale);
    const sy = Math.max(0, -tx.y / tx.scale);
    const sw = Math.min(src.width - sx, winW / tx.scale);
    const sh = Math.min(src.height - sy, winH / tx.scale);
    return { cv: SUITE_PHOTO.cropTo(src, { x: sx, y: sy, w: sw, h: sh }, out.w, out.h), w: out.w, h: out.h };
  }

  function buildSheets() {
    const list = $("sheetList");
    list.innerHTML = "";
    (SUITE.cfg.sizes.sheets || []).forEach((sh, i) => {
      const b = document.createElement("button");
      b.className = "size-chip" + (i === 0 ? " on" : "");
      b.innerHTML = sh.label;
      b.onclick = () => {
        list.querySelectorAll(".size-chip").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        sheet = sh;
        renderSheet();
      };
      list.appendChild(b);
    });
    sheet = SUITE.cfg.sizes.sheets[0];
    renderSheet();
  }

  function renderSheet() {
    if (!tray.length) {
      const pv0 = $("sheetPreview");
      pv0.getContext("2d").clearRect(0, 0, pv0.width, pv0.height);
      $("previewWrap").querySelectorAll(".slotX").forEach((x) => x.remove());
      $("sheetInfo").textContent = "Tray खाली है — ऊपर से photo जोड़ें।";
      $("overWarn").style.display = "none";
      renderTray(0);
      return;
    }
    const dpi = 300;
    const sheetW = SUITE.mmToPx(sheet.w_mm, dpi), sheetH = SUITE.mmToPx(sheet.h_mm, dpi);
    const gap = SUITE.mmToPx(sheet.gap_mm || 0, dpi);
    const margin = SUITE.mmToPx(sheet.margin_mm || 0, dpi);
    const pw = tray[0].w, ph = tray[0].h;
    const lay = SUITE_SHEET.layout(pw, ph, sheetW, sheetH, gap, margin);
    const capacity = lay.count;
    if (tray.length === 1 && tray[0].copies === null) tray[0].copies = capacity; // default: पूरी sheet

    // queue = tray के क्रम में, copies के हिसाब से
    const queue = [], owners = [];
    tray.forEach((t, ti) => { for (let i = 0; i < t.copies; i++) { queue.push(t.img); owners.push(ti); } });
    const over = Math.max(0, queue.length - capacity);
    const vis = queue.slice(0, capacity), visOwners = owners.slice(0, capacity);

    // full-res 300 DPI sheet
    const cv = document.createElement("canvas");
    cv.width = sheetW; cv.height = sheetH;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, sheetW, sheetH);
    vis.forEach((img, i) => {
      const p = lay.positions[i];
      ctx.drawImage(img, p.x, p.y, pw, ph);
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 1;
      ctx.strokeRect(p.x + 0.5, p.y + 0.5, pw - 1, ph - 1);
    });
    sheetOut = { canvas: cv, count: vis.length, capacity };

    // preview + ✕ overlays
    const pv = $("sheetPreview");
    const scale = Math.min(1, 340 / sheetW);
    pv.width = Math.round(sheetW * scale);
    pv.height = Math.round(sheetH * scale);
    const pctx = pv.getContext("2d");
    pctx.fillStyle = "#fff";
    pctx.fillRect(0, 0, pv.width, pv.height);
    pctx.drawImage(cv, 0, 0, pv.width, pv.height);
    const wrap = $("previewWrap");
    wrap.querySelectorAll(".slotX").forEach((x) => x.remove());
    vis.forEach((img, i) => {
      const p = lay.positions[i];
      const x = document.createElement("div");
      x.className = "slotX";
      x.textContent = "✕";
      x.style.left = Math.round(p.x * scale + pw * scale - 20) + "px";
      x.style.top = Math.round(p.y * scale + 2) + "px";
      x.title = "ये photo हटाएँ";
      x.onclick = () => { tray[visOwners[i]].copies--; renderSheet(); };
      wrap.appendChild(x);
    });

    renderTray(capacity);
    $("sheetInfo").textContent =
      sheet.label + " • " + vis.length + " photos print होंगी • " +
      (capacity - vis.length) + " जगह खाली • 300 DPI";
    $("overWarn").style.display = over ? "block" : "none";
    if (over) $("overWarn").textContent =
      "⚠️ Sheet में " + capacity + " ही आएँगी — " + over + " photo बच गई। Count कम करें या ✕ से हटाएँ।";

    // KB download (exam forms)
    if (sel.kb_limit) {
      $("kbRow").style.display = "flex";
      $("kbBtn").textContent = "⬇️ Form upload के लिए single photo (" + sel.kb_limit[0] + "–" + sel.kb_limit[1] + " KB)";
      $("kbBtn").onclick = async () => {
        busy(true, "KB compress हो रहा...");
        const b = await SUITE_PHOTO.compressToKB(exportPhoto().cv, sel.kb_limit[0], sel.kb_limit[1]);
        SUITE_PHOTO.download(b, sel.id + "-photo.jpg");
        busy(false);
      };
    } else {
      $("kbRow").style.display = "none";
    }
  }

  function renderTray(capacity) {
    const box = $("tray");
    box.innerHTML = "";
    // सबकी एक साथ quick chips (2+ photos पर)
    const q = $("trayQuick");
    q.innerHTML = "";
    if (tray.length > 1) {
      q.style.display = "flex";
      const lbl = document.createElement("span");
      lbl.textContent = "☑ सबकी एक साथ:";
      q.appendChild(lbl);
      [1, 2, 5, 8].forEach((n) => {
        const c = document.createElement("button");
        c.className = "chip";
        c.textContent = n;
        c.onclick = () => { tray.forEach((t) => (t.copies = n)); renderSheet(); };
        q.appendChild(c);
      });
    } else {
      q.style.display = "none";
    }
    tray.forEach((t, ti) => {
      const d = document.createElement("div");
      d.className = "trayItem";
      const im = new Image();
      im.src = t.img.toDataURL("image/jpeg", 0.6);
      im.className = "trayThumb";
      d.appendChild(im);
      const row = document.createElement("div");
      row.className = "chipsRow";
      [1, 2, 4, 5, 8].forEach((n) => {
        const c = document.createElement("button");
        c.className = "chip" + (t.copies === n ? " on" : "");
        c.textContent = n;
        c.onclick = () => { t.copies = n; renderSheet(); };
        row.appendChild(c);
      });
      const full = document.createElement("button");
      full.className = "chip";
      full.textContent = "भरें";
      full.title = "बाकी बची जगह इस photo से भरें";
      full.onclick = () => {
        let others = 0;
        tray.forEach((o, oi) => { if (oi !== ti) others += o.copies; });
        t.copies = Math.max(0, capacity - others);
        renderSheet();
      };
      row.appendChild(full);
      d.appendChild(row);
      const lbl = document.createElement("div");
      lbl.className = "trayCount";
      lbl.textContent = "× " + t.copies;
      d.appendChild(lbl);
      const tools = document.createElement("div");
      tools.className = "trayTools";
      const re = document.createElement("button");
      re.textContent = "✏️ crop";
      re.title = "ये photo फिर से crop करें";
      re.onclick = () => {
        editingIdx = ti;
        if (t.orig) src = t.orig;
        $("sheetArea").style.display = "none";
        $("editor").style.display = "block";
        $("editorTitle").textContent = "✂️ Photo " + (ti + 1) + " — crop ठीक करें (zoom/drag), फिर नीचे button दबाएँ";
        $("nextBtn").textContent = "✓ Crop save करें";
        setupCrop();
        $("editor").scrollIntoView({ behavior: "smooth" });
      };
      tools.appendChild(re);
      const del = document.createElement("button");
      del.textContent = "🗑️";
      del.title = "ये photo tray से हटाएँ";
      del.onclick = () => { tray.splice(ti, 1); renderSheet(); };
      tools.appendChild(del);
      d.appendChild(tools);
      box.appendChild(d);
    });
  }

  $("dlBtn").onclick = () => {

    if (!sheetOut) return;
    sheetOut.canvas.toBlob((b) => SUITE_PHOTO.download(b, "sheet-" + sel.id + "-" + sheet.id + ".jpg"), "image/jpeg", 0.95);
  };

  $("printBtn").onclick = () => {
    if (!sheetOut) return;
    const w = window.open("", "_blank");
    const wi = sheet.w_mm / 25.4, hi = sheet.h_mm / 25.4;
    w.document.write(
      "<html><head><title>Print</title><style>@page{size:" + wi + "in " + hi + "in;margin:0}body{margin:0}img{width:" + sheet.w_mm + "mm;height:" + sheet.h_mm + "mm;display:block}</style></head><body>" +
      '<img src="' + sheetOut.canvas.toDataURL("image/jpeg", 0.95) + '" onload="setTimeout(()=>window.print(),300)">' +
      "</body></html>"
    );
    w.document.close();
  };
})();
</script>
</body>
</html>
