<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🖨️ सेल्फ प्रिंट — CSC Print Cafe</title>
<link rel="icon" type="image/png" href="brand/favicon-32.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b1020;color:#e2e8f0;min-height:100vh;padding-bottom:90px}
h1{font-size:20px;font-weight:700}
.hdr{background:linear-gradient(135deg,#1e293b,#0f172a);padding:16px 14px;border-bottom:2px solid #d4af37;position:sticky;top:0;z-index:10}
.hdr h1{color:#f6e27a}
.hdr .sub{font-size:12px;color:#94a3b8;margin-top:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.card{background:#111a30;border:1px solid #24314f;border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;color:#f6e27a;margin-bottom:10px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#d4af37;color:#1a1a1a;font-size:12px;font-weight:700;margin-right:6px}
.dropzone{border:2px dashed #3b4a6b;border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer;transition:.2s;background:#0d1526}
.dropzone:active,.dropzone.over{border-color:#d4af37;background:#16203a}
.dropzone .big{font-size:34px;margin-bottom:6px}
.dropzone p{font-size:13px;color:#94a3b8}
.fileinfo{display:none;margin-top:10px;background:#0d1526;border:1px solid #24314f;border-radius:10px;padding:10px 12px;font-size:13px}
.fileinfo b{color:#f6e27a}
.optgroup{margin-bottom:12px}
.optgroup label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#1a2542;border:1px solid #334155;color:#cbd5e1;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:#d4af37;border-color:#f6e27a;color:#1a1a1a;font-weight:700}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:10px;border:1px solid #334155;background:#1a2542;color:#f6e27a;font-size:20px;font-weight:700}
.stepper .val{font-size:20px;font-weight:700;color:#f6e27a;min-width:48px;text-align:center}
.slip{background:#0d1526;border:1px dashed #d4af37;border-radius:12px;padding:14px;font-size:13px;line-height:1.9}
.slip .oid{font-size:17px;font-weight:800;color:#f6e27a;letter-spacing:1px}
.slip .row{display:flex;justify-content:space-between;gap:8px}
.slip .row span:first-child{color:#94a3b8}
.slip .row span:last-child{text-align:right;font-weight:600}
.sendbar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;border-top:2px solid #d4af37;padding:10px 14px;z-index:10}
.sendbtn{display:block;width:100%;max-width:520px;margin:0 auto;background:#25d366;color:#062b16;font-size:17px;font-weight:800;text-align:center;padding:14px;border-radius:12px;text-decoration:none;border:none;cursor:pointer}
.sendbtn.off{background:#334155;color:#94a3b8;pointer-events:none}
.howto{font-size:12px;color:#94a3b8;line-height:1.9}
.howto b{color:#cbd5e1}
.langtog{position:absolute;right:12px;top:16px;background:#1a2542;border:1px solid #334155;color:#cbd5e1;padding:6px 10px;border-radius:8px;font-size:12px}
.note{font-size:11px;color:#64748b;text-align:center;margin-top:8px}
.err{color:#f87171;font-size:12px;margin-top:6px;display:none}
</style>
</head>
<body>
<div class="hdr">
  <h1 id="hShop">🖨️ CSC Print Cafe</h1>
  <div class="sub" id="hSub">सेल्फ प्रिंट — phone से order, दुकान से print</div>
  <button class="langtog" id="langBtn">🌐 English</button>
</div>
<div class="wrap">
  <div class="card">
    <h2><span class="stepno">1</span><span data-t="fT">अपनी File चुनिए</span></h2>
    <div class="dropzone" id="dz">
      <div class="big">📄</div>
      <p data-t="dzT">PDF या Photo चुनने के लिए यहाँ दबाइए</p>
      <p style="font-size:11px;margin-top:4px" data-t="dzS">PDF • JPG • PNG</p>
    </div>
    <input type="file" id="fi" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
    <div class="fileinfo" id="finfo"></div>
    <div class="err" id="ferr"></div>
  </div>
  <div class="card" id="optCard" style="display:none">
    <h2><span class="stepno">2</span><span data-t="oT">Print Options चुनिए</span></h2>
    <div class="optgroup"><label data-t="oType">प्रिंट कैसा?</label><div class="chips" id="cgType"></div></div>
    <div class="optgroup"><label data-t="oSize">कागज़ size?</label><div class="chips" id="cgSize"></div></div>
    <div class="optgroup"><label data-t="oSide">एक तरफ़ या दोनों?</label><div class="chips" id="cgSide"></div></div>
    <div class="optgroup"><label data-t="oPr">किस Machine से? (अपने-आप चुनी गई)</label><div class="chips" id="cgPr"></div></div>
    <div class="optgroup"><label data-t="oCop">कितनी copies?</label>
      <div class="stepper">
        <button id="cMinus">−</button><div class="val" id="cVal">1</div><button id="cPlus">+</button>
        <span style="font-size:12px;color:#94a3b8" data-t="oCopH">(1 से 100 तक)</span>
      </div>
    </div>
  </div>
  <div class="card" id="slipCard" style="display:none">
    <h2><span class="stepno">3</span><span data-t="sT">आपका Order</span></h2>
    <div class="slip" id="slip"></div>
    <div class="note" data-t="sN">भेजने के बाद दुकान पर price पता चल जाएगा</div>
  </div>
  <div class="card">
    <h2>💡 <span data-t="hT">कैसे काम करता है?</span></h2>
    <div class="howto" id="howto"></div>
  </div>
  <div class="note">संस्कृति Print Kiosk • <span data-t="pw">संस्कृति से बना</span> 🪔</div>
</div>
<div class="sendbar">
  <button class="sendbtn off" id="sendBtn" data-t="bT">📲 WhatsApp पर Order भेजिए</button>
</div>
<script>
/* ================= CONFIG — दुकान के हिसाब से बदलो ================= */
const SHOP={
  name:'CSC Print Cafe',
  wa:'919873152325',
  types:[['bw','⚫ B&W'],['color','🎨 Color']],
  sizes:[['a4','A4'],['a3','A3'],['photo','4x6 Photo']],
  sides:[['single','एक तरफ़'],['both','दोनों तरफ़']],
  maxCopies:100, maxMB:50,
  /* ₹ rate per पेज (per printed side) — हर type+size का */
  prices:{ bw:{a4:2,a3:5,photo:5}, color:{a4:10,a3:20,photo:30} },
  /* दुकान की machines */
  printers:[['bw','⚫ B&W Machine (iR 3245)'],['color','🎨 Color LaserJet (iR C3326)'],['photo','📷 Photo Printer (L805)'],['plot','📐 बड़ा Plotter (Maps/Poster)']],
  /* type+size → अपने-आप machine (customer बदल सकता है) */
  autoPrinter:{ 'bw+a4':'bw','bw+a3':'bw','bw+photo':'photo','color+a4':'color','color+a3':'color','color+photo':'photo' }
};
const STR={
hi:{fT:'अपनी File चुनिए',dzT:'PDF या Photo चुनने के लिए यहाँ दबाइए',dzS:'PDF • JPG • PNG',oT:'Print Options चुनिए',oType:'प्रिंट कैसा?',oSize:'कागज़ size?',oSide:'एक तरफ़ या दोनों?',oPr:'किस Machine से? (अपने-आप चुनी गई)',oCop:'कितनी copies?',oCopH:'(1 से 100 तक)',sT:'आपका Order',sN:'आखिरी price दुकान approve करते समय confirm होगी',hT:'कैसे काम करता है?',bT:'📲 WhatsApp पर Order भेजिए',pw:'संस्कृति से बना',
  how:'<b>1.</b> File चुनिए — पेज अपने-आप गिनेंगे<br><b>2.</b> Options चुनिए — <b>price तुरंत दिखेगा</b><br><b>3.</b> WhatsApp पर order भेजिए<br><b>4.</b> दुकान <b>approve</b> करेगी → WhatsApp पर सूचना → pay → print तैयार! 🎉<br><b>🔒 बिना दुकान की permission के print नहीं होगा</b>',
  fName:'File',fPages:'पेज',fType:'प्रिंट',fSize:'कागज़',fSide:'तरफ़',fPr:'Machine',fCop:'Copies',fOrd:'Order ID',fShop:'दुकान',fPrice:'अंदाज़ी Price',fWait:'⏳ दुकान की permission के बाद ही print होगा',
  eBig:'⚠️ File बहुत बड़ी है (50MB से कम चुनिए)',ePdf:'⚠️ PDF पढ़ी नहीं गई — फिर कोशिश कीजिए',pg:'पेज गिन रहे हैं…',img:'1 पेज (photo)',
  wmsg:(o)=>`🖨️ नया Print Order ${o.id}\n📄 File: ${o.name} (${o.pages} पेज)\n⚙️ ${o.type} | ${o.size} | ${o.side} | ${o.copies} copies\n🖨️ Machine: ${o.printer}\n💰 अंदाज़ी Price: ₹${o.price}\n⏳ कृपया approve करें — आपकी सूचना का इंतज़ार रहेगा`},
en:{fT:'Choose your File',dzT:'Tap here to choose PDF or Photo',dzS:'PDF • JPG • PNG',oT:'Choose Print Options',oType:'Print type?',oSize:'Paper size?',oSide:'One side or both?',oPr:'Which machine? (auto-chosen)',oCop:'How many copies?',oCopH:'(1 to 100)',sT:'Your Order',sN:'Shop confirms the final price on approval',hT:'How does it work?',bT:'📲 Send Order on WhatsApp',pw:'Made by Sanskriti',
  how:'<b>1.</b> Choose file — pages counted automatically<br><b>2.</b> Choose options — <b>price shows instantly</b><br><b>3.</b> Send order on WhatsApp<br><b>4.</b> Shop <b>approves</b> → WhatsApp message → pay → print ready! 🎉<br><b>🔒 No printing without shop permission</b>',
  fName:'File',fPages:'Pages',fType:'Print',fSize:'Paper',fSide:'Side',fPr:'Machine',fCop:'Copies',fOrd:'Order ID',fShop:'Shop',fPrice:'Est. Price',fWait:'⏳ Prints only after shop approval',
  eBig:'⚠️ File too big (choose under 50MB)',ePdf:'⚠️ Could not read PDF — try again',pg:'Counting pages…',img:'1 page (photo)',
  wmsg:(o)=>`🖨️ New Print Order ${o.id}\n📄 File: ${o.name} (${o.pages} pages)\n⚙️ ${o.type} | ${o.size} | ${o.side} | ${o.copies} copies\n🖨️ Machine: ${o.printer}\n💰 Est. Price: ₹${o.price}\n⏳ Please approve — waiting for your message`}
};
/* ================= ENGINE ================= */
let LANG='hi', FILE=null, PAGES=0;
const $=id=>document.getElementById(id);
const T=k=>STR[LANG][k];
const opt={type:SHOP.types[0][0], size:SHOP.sizes[0][0], side:SHOP.sides[0][0], copies:1, printer:SHOP.printers[0][0]};
const OID='#'+String(Math.floor(100000+Math.random()*900000));
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.getAttribute('data-t'); if(STR[LANG][k]!=null) el.textContent=STR[LANG][k]; });
  $('howto').innerHTML=T('how');
  $('langBtn').textContent=LANG==='hi'?'🌐 English':'🌐 हिंदी';
  $('hShop').textContent='🖨️ '+SHOP.name;
  $('hSub').textContent=LANG==='hi'?'सेल्फ प्रिंट — phone से order, दुकान से print':'Self print — order from phone, print at shop';
  buildChips(); renderSlip();
}
$('langBtn').onclick=()=>{ LANG=(LANG==='hi'?'en':'hi'); applyLang(); };
function buildChips(){
  const mk=(el,list,key,auto)=>{ el.innerHTML=''; list.forEach(([v,lb])=>{ const d=document.createElement('div');
    d.className='chip'+(opt[key]===v?' on':''); d.textContent=lb;
    d.onclick=()=>{ opt[key]=v; if(auto){ const ap=SHOP.autoPrinter[opt.type+'+'+opt.size]; if(ap) opt.printer=ap; } buildChips(); renderSlip(); }; el.appendChild(d); }); };
  mk($('cgType'),SHOP.types,'type',1); mk($('cgSize'),SHOP.sizes,'size',1); mk($('cgSide'),SHOP.sides,'side');
  mk($('cgPr'),SHOP.printers,'printer');
  $('cVal').textContent=opt.copies;
}
$('cMinus').onclick=()=>{ opt.copies=Math.max(1,opt.copies-1); buildChips(); renderSlip(); };
$('cPlus').onclick=()=>{ opt.copies=Math.min(SHOP.maxCopies,opt.copies+1); buildChips(); renderSlip(); };
$('dz').onclick=()=>$('fi').click();
$('fi').onchange=async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  $('ferr').style.display='none';
  if(f.size>SHOP.maxMB*1048576){ $('ferr').textContent=T('eBig'); $('ferr').style.display='block'; return; }
  FILE=f; PAGES=0; showFile(T('pg')); $('optCard').style.display='block';
  if(f.type==='application/pdf'&&window.pdfjsLib){
    try{ const buf=await f.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      PAGES=pdf.numPages; showFile(); }
    catch(_){ PAGES=1; showFile(); }
  } else { PAGES=1; showFile(T('img')); }
  renderSlip();
};
function showFile(extra){
  $('finfo').style.display='block';
  const mb=(FILE.size/1048576).toFixed(1);
  $('finfo').innerHTML='📄 <b>'+FILE.name+'</b> &nbsp;•&nbsp; '+mb+' MB &nbsp;•&nbsp; <b>'+(PAGES||'—')+'</b> '+(extra||T('fPages').toLowerCase());
}
function calcPrice(){
  if(!FILE||!PAGES) return 0;
  const rate=(SHOP.prices[opt.type]||{})[opt.size]||0;
  return rate*PAGES*opt.copies;
}
function renderSlip(){
  if(!FILE){ $('slipCard').style.display='none'; $('sendBtn').classList.add('off'); return; }
  $('slipCard').style.display='block'; $('sendBtn').classList.remove('off');
  const L=STR[LANG], lb=(arr,v)=>arr.find(x=>x[0]===v)[1];
  $('slip').innerHTML=
    '<div class="oid">🖨️ '+L.fOrd+' '+OID+'</div>'+
    '<div class="row"><span>'+L.fShop+'</span><span>'+SHOP.name+'</span></div>'+
    '<div class="row"><span>'+L.fName+'</span><span>'+FILE.name.slice(0,26)+'</span></div>'+
    '<div class="row"><span>'+L.fPages+'</span><span>'+(PAGES||1)+'</span></div>'+
    '<div class="row"><span>'+L.fType+'</span><span>'+lb(SHOP.types,opt.type)+'</span></div>'+
    '<div class="row"><span>'+L.fSize+'</span><span>'+lb(SHOP.sizes,opt.size)+'</span></div>'+
    '<div class="row"><span>'+L.fSide+'</span><span>'+lb(SHOP.sides,opt.side)+'</span></div>'+
    '<div class="row"><span>'+L.fPr+'</span><span>'+lb(SHOP.printers,opt.printer)+'</span></div>'+
    '<div class="row"><span>'+L.fCop+'</span><span>'+opt.copies+'</span></div>'+
    '<div class="row" style="border-top:1px dashed #d4af37;margin-top:4px;padding-top:6px"><span>'+L.fPrice+'</span><span style="color:#f6e27a;font-size:17px;font-weight:800">₹'+calcPrice()+'</span></div>'+
    '<div style="font-size:11px;color:#fbbf24;margin-top:6px">'+L.fWait+'</div>';
}
$('sendBtn').onclick=()=>{
  if(!FILE) return;
  const msg=STR[LANG].wmsg({id:OID,name:FILE.name,pages:PAGES||1,
    type:SHOP.types.find(x=>x[0]===opt.type)[1],size:SHOP.sizes.find(x=>x[0]===opt.size)[1],
    side:SHOP.sides.find(x=>x[0]===opt.side)[1],copies:opt.copies,price:calcPrice(),
    printer:SHOP.printers.find(x=>x[0]===opt.printer)[1]});
  window.open('https://wa.me/'+SHOP.wa+'?text='+encodeURIComponent(msg),'_blank');
};
applyLang();
</script>
</body>
</html>
