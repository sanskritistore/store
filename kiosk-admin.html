<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛠️ दुकान Admin — CSC Print Cafe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 12px;border-bottom:2px solid #d4af37;margin-bottom:12px}
header h1{color:#f6e27a;font-size:18px}
header .acts{display:flex;gap:8px}
header button{background:#1e293b;border:1px solid #334155;color:#f6e27a;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.login{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;max-width:380px;margin:60px auto;text-align:center}
.login h2{color:#f6e27a;font-size:17px;margin-bottom:4px}
.login p{color:#94a3b8;font-size:12px;margin-bottom:14px}
.login input{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:10px;color:#e2e8f0;padding:11px;font-size:14px;margin-bottom:10px;outline:none}
.login input:focus{border-color:#d4af37}
.login button{width:100%;background:#d4af37;color:#0f172a;border:none;padding:12px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer}
.login .err{color:#f87171;font-size:12px;margin-top:8px;min-height:16px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1.5px solid #334155;background:#0f172a;color:#cbd5e1;font-size:12.5px;cursor:pointer}
.chip.on{border-color:#d4af37;color:#f6e27a;background:#29241a}
.empty{text-align:center;color:#64748b;font-size:13px;padding:30px 0}
.ord{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:12px}
.ord.new{border-color:#4ade80;box-shadow:0 0 0 1px #4ade80}
.ord .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ord .oid{color:#f6e27a;font-weight:800;font-size:15px}
.ord .ago{color:#64748b;font-size:11px}
.ord .who{font-size:13.5px;margin-bottom:4px}
.ord .who b{color:#e2e8f0}
.ord .meta{font-size:12px;color:#94a3b8;margin-bottom:6px;line-height:1.6}
.ord .file{display:flex;align-items:center;gap:8px;background:#0f172a;border:1px dashed #334155;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}
.ord .file a{color:#7dd3fc;text-decoration:none;font-weight:700}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px}
.b-new{background:#052e16;color:#4ade80}.b-paid{background:#08302e;color:#2dd4bf}.b-approved{background:#1e3a5f;color:#7dd3fc}.b-printed{background:#3b2f0b;color:#fbbf24}.b-rejected{background:#2d0a0a;color:#f87171}.b-done{background:#1a2e1a;color:#86efac}
.row{display:flex;gap:8px;align-items:center}
.row input{width:110px;background:#0f172a;border:1.5px solid #334155;border-radius:8px;color:#f6e27a;padding:8px;font-size:14px;text-align:center;outline:none}
.btn{flex:1;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:13px;cursor:pointer}
.ok{background:#25d366;color:#062c16}
.no{background:#3f1d1d;color:#f87171;border:1px solid #f87171}
.pr{background:#fbbf24;color:#29240a}
.dn{background:#1e293b;color:#86efac;border:1px solid #4ade80}
.note{text-align:center;color:#64748b;font-size:11px;margin-top:14px}
</style></head><body><div class="wrap">
<div class="login" id="loginCard">
  <h2>🛠️ दुकान Admin</h2><p>CSC Print Cafe — सिर्फ़ दुकान मालिक के लिए 🔒</p>
  <input id="lEmail" type="email" placeholder="Email">
  <input id="lPass" type="password" placeholder="Password">
  <button id="lBtn">Login करें</button>
  <div class="err" id="lErr"></div>
</div>
<div id="app" style="display:none">
<header>
  <h1>🛠️ Orders — CSC Print Cafe</h1>
  <div class="acts"><button id="rBtn">↻ Refresh</button><button id="outBtn">Logout</button></div>
</header>
<div class="filters" id="filters"></div>
<div id="list"></div>
</div>
<div class="note">संस्कृति Print Kiosk 🤝 • नए orders हर 20 second में अपने-आप</div>
</div>
<script>
/* ===== CONFIG ===== */
const SUPA={url:'https://atgmukhdhdoceovkildb.supabase.co', key:'sb_publishable_cPQ0o3tEe-UvR7EgPDVJsA_p2JOzOqO', upi:'paytm.s261vka@pty'};
const sb=supabase.createClient(SUPA.url,SUPA.key);
const $=id=>document.getElementById(id);
let FILTER='new';
const FILT=[['new','🆕 नए'],['paid','💰 Paid'],['approved','✅ Approved'],['printed','🖨️ Printed'],['done','✔️ Done'],['rejected','❌ रद्द'],['all','सब']];
function ago(ts){const s=(Date.now()-new Date(ts).getTime())/1000;
  if(s<60)return 'अभी-अभी'; if(s<3600)return Math.floor(s/60)+' मिनट पहले';
  if(s<86400)return Math.floor(s/3600)+' घंटे पहले'; return Math.floor(s/86400)+' दिन पहले';}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){showApp();}else{$('loginCard').style.display='block';}
}
$('lBtn').onclick=async()=>{
  $('lErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});
  if(error){$('lErr').textContent='Email/Password गलत है — फिर कोशिश करें';return;}
  showApp();
};
$('outBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('rBtn').onclick=()=>loadOrders();
function showApp(){$('loginCard').style.display='none';$('app').style.display='block';renderFilters();loadOrders();setInterval(loadOrders,20000);}
function renderFilters(){
  $('filters').innerHTML='';
  FILT.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip'+(FILTER===k?' on':'');b.textContent=l;
    b.onclick=()=>{FILTER=k;renderFilters();loadOrders();};$('filters').appendChild(b);});
}
async function loadOrders(){
  let q=sb.from('orders').select('*').order('created_at',{ascending:false}).limit(60);
  if(FILTER!=='all')q=q.eq('status',FILTER);
  const {data,error}=await q;
  if(error){$('list').innerHTML='<div class="empty">Error: '+error.message+'</div>';return;}
  renderList(data||[]);
}
async function renderList(rows){
  const el=$('list');
  if(!rows.length){el.innerHTML='<div class="empty">इस filter में कोई order नहीं</div>';return;}
  el.innerHTML='';
  for(const o of rows){
    const d=document.createElement('div');d.className='ord '+o.status;
    const badge='<span class="badge b-'+o.status+'">'+o.status.toUpperCase()+'</span>';
    d.innerHTML='<div class="top"><span class="oid">#'+o.id+badge+'</span><span class="ago">'+ago(o.created_at)+'</span></div>'
      +'<div class="who">👤 <b>'+(o.cust_name||'—')+'</b> &nbsp;📱 '+(o.cust_phone||'—')+'</div>'
      +'<div class="meta">⚙️ '+(o.ptype||'')+' | '+(o.size||'')+' | '+(o.side||'')+' | '+(o.copies||1)+' copies • 📄 '+(o.pages||1)+' पेज • 🖨️ '+(o.printer||'')+'</div>'
      +'<div class="file">📄 '+(o.file_name||'—')+' <a href="#" data-path="'+o.file_path+'">⬇ Download</a></div>'
      +'<div class="row">₹<input type="number" value="'+(o.price||0)+'" data-price="'+o.id+'">'
      +(o.status==='new'||o.status==='paid'?'<button class="btn ok" data-ok="'+o.id+'">'+(o.status==='paid'?'💰✅ Verify & Approve':'✅ Approve')+'</button><button class="btn no" data-no="'+o.id+'">❌</button>':'')
      +(o.status==='approved'?'<button class="btn pr" data-pr="'+o.id+'">🖨️ Printed</button>':'')
      +(o.status==='printed'?'<button class="btn dn" data-dn="'+o.id+'">✔️ Done (दे दिया)</button>':'')
      +'</div>';
    el.appendChild(d);
  }
  el.querySelectorAll('a[data-path]').forEach(a=>a.onclick=async e=>{
    e.preventDefault();
    const {data}=await sb.storage.from('kiosk-files').createSignedUrl(a.dataset.path,300);
    if(data)window.open(data.signedUrl,'_blank');
  });
  el.querySelectorAll('button[data-ok]').forEach(b=>b.onclick=()=>act(b.dataset.ok,'approved'));
  el.querySelectorAll('button[data-no]').forEach(b=>b.onclick=()=>act(b.dataset.no,'rejected'));
  el.querySelectorAll('button[data-pr]').forEach(b=>b.onclick=()=>act(b.dataset.pr,'printed'));
  el.querySelectorAll('button[data-dn]').forEach(b=>b.onclick=()=>act(b.dataset.dn,'done'));
}
async function act(id,status){
  const inp=document.querySelector('input[data-price="'+id+'"]');
  const price=inp?parseFloat(inp.value)||0:0;
  let was='';
  if(status==='approved'){const {data:pre}=await sb.from('orders').select('status').eq('id',id).single();was=pre?pre.status:'';}
  await sb.from('orders').update({status:status,price:price}).eq('id',id);
  if(status==='approved'){
    const {data}=await sb.from('orders').select('cust_phone').eq('id',id).single();
    if(data&&data.cust_phone){
      const msg=was==='paid'
        ?'✅ Payment confirm हो गई! Order #'+id+' print queue में है 🖨️ Ready होते ही message आएगा 🙏'
        :'✅ आपका Order #'+id+' Approved! Price ₹'+price+'.\n👉 Pay करें (1-tap): https://sanskritistore.github.io/store/kiosk-pay.html?amt='+price+'&oid='+id+'\n(UPI: '+SUPA.upi+')';
      window.open('https://wa.me/91'+data.cust_phone+'?text='+encodeURIComponent(msg),'_blank');
    }
  }
  loadOrders();
}
boot();
</script></body></html>
