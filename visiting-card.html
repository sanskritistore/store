};
const S={ ui:'hi', side:'front', tplFront:'simple', tplBack:'bbrand', sheet:'a4', cardSize:'35x2', data:null };
function T(k){ return STR[S.ui][k]; }

function setActiveTpl(id){ if(S.side==='front') S.tplFront=id; else S.tplBack=id; }
function cardDims(){ return CARD_SIZES[S.cardSize]||CARD_SIZES['35x2']; }

/* ================= 📋 FORM SCHEMA (config — नया field यहाँ जोड़ो, form अपने आप) ================= */

 {sec:'person', title:'👤 आपकी जानकारी', titleEn:'👤 Your Details', fields:[

 {sec:'contact', title:'📞 संपर्क', titleEn:'📞 Contact', fields:[

   {k:'addr', lab:'पता (optional)', labEn:'Address (optional)', ta:1, ph:'Shop No. 12, Main Market, New Delhi'},
   {k:'web', lab:'Website (optional)', labEn:'Website (optional)', ph:'yourshop.in'}]}
];
const SCHEMA_BACK=[
 {sec:'backx', title:'🔄 Back side की extra जानकारी', titleEn:'🔄 Back side extra details', fields:[
   {k:'services', lab:'Services / ऑफ़र (एक line में एक)', labEn:'Services / offers (one per line)', ta:1, ph:'Document Printing\nPhoto Printing\nLaser Engraving'},
   {k:'note', lab:'छोटी line / note (optional)', labEn:'Small note line (optional)', ph:'धन्यवाद! / Thank you!'}]}
];
function blankCard(){ return { biz:'', tag:'', name:'', desig:'', phone:'', phone2:'', email:'', addr:'', web:'',
  services:'', note:'', logo:null }; }
S.data=blankCard();

/* ================= 🎨 DESIGNS (config — रंग/font/skin; नया design यहाँ या Studio से) ================= */
const TEMPLATES={
 simple:{ name:'सादा', skin:'bar', bg:'#ffffff', accent:'#0e7490', tx:'#1f2937', sub:'#6b7280', serif:false, align:'left', frame:false },
 dark:{ name:'मॉडर्न डार्क', skin:'plain', bg:'#0f172a', accent:'#f59e0b', tx:'#f1f5f9', sub:'#94a3b8', serif:false, align:'left', frame:false },
 royal:{ name:'शाही', skin:'plain', bg:'#fdf8ec', accent:'#b45309', tx:'#7c2d12', sub:'#a16207', serif:true, align:'center', frame:true },
 corp:{ name:'कॉर्पोरेट', skin:'bandTop', bg:'#ffffff', accent:'#1e40af', tx:'#1f2937', sub:'#6b7280', serif:false, align:'left', frame:false },
 panel:{ name:'रंगीन पैनल', skin:'bandLeft', bg:'#ffffff', accent:'#c2410c', tx:'#1f2937', sub:'#6b7280', serif:false, align:'left', frame:false },
 minimal:{ name:'मिनिमल', skin:'plain', bg:'#ffffff', accent:'#374151', tx:'#111827', sub:'#9ca3af', serif:false, align:'center', frame:false }
 /* ---- Back side designs (services/note fields इस्तेमाल करते हैं) ---- */
 ,bbrand:{ name:'बैक: Brand', skin:'bBrand', bg:'#0f172a', accent:'#f59e0b', tx:'#f1f5f9', sub:'#94a3b8', serif:false, align:'center', frame:false },
 bserv:{ name:'बैक: Services', skin:'bServices', bg:'#ffffff', accent:'#0e7490', tx:'#1f2937', sub:'#6b7280', serif:false, align:'left', frame:false },
 bplain:{ name:'बैक: सादा', skin:'bPlain', bg:'#ffffff', accent:'#334155', tx:'#1f2937', sub:'#6b7280', serif:false, align:'center', frame:false }
};

/* ================= 🔤 RENDER HELPERS (inch = unit; TXT slice-bug fix — resume engine से) ================= */
const FDEV='"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif';
const FSER='"Noto Serif Devanagari",Georgia,serif';
const PT=1/72;
let SC=VIEW_SCALE;
function font(t,px,w,st){ return (st||'')+' '+(w||400)+' '+px+'px '+(t.serif?FSER:FDEV); }
function setF(ctx,t,pt,w,st){ ctx.font=font(t,pt*PT*SC,w,st); }
function TXT(ctx,str,x,y){ const al=ctx.textAlign;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.textAlign=al;
  ctx.fillText(str,x*SC,y*SC); ctx.restore(); }
function wrap(ctx,text,maxW){
  const out=[];
  String(text||'').split('\n').forEach(p=>{
    if(!p.trim()){ out.push(''); return; }
    let line='';
    p.split(/\s+/).forEach(wd=>{
      const t=line?line+' '+wd:wd;
      if(ctx.measureText(t).width/SC<=maxW) line=t;
      else{ if(line)out.push(line); line=wd; }
    });
    if(line)out.push(line);
  });
  return out;
}
/* logo cache */
let _lgIm=null,_lgSrc=null;
function logoImg(src){ if(src===_lgSrc&&_lgIm) return _lgIm.complete&&_lgIm.naturalWidth?_lgIm:null;
  _lgSrc=src; _lgIm=new Image(); _lgIm.onload=()=>draw(); _lgIm.src=src; return null; }

/* ================= 🪪 CARD RENDERER (OX,OY = sheet में card की जगह; screen पर 0,0) ================= */
function drawCardInto(ctx,t,d,OX,OY){
  const X=v=>OX+v, Y=v=>OY+v, dm=cardDims(), W=dm.w, H=dm.h, C=t.align==='center';
  /* background */
  ctx.fillStyle=t.bg; ctx.fillRect(X(0),Y(0),W,H);
  if(t.frame){ ctx.strokeStyle=t.accent; ctx.lineWidth=1.4/SC; ctx.strokeRect(X(0.05),Y(0.05),W-0.1,H-0.1);
    ctx.lineWidth=0.5/SC; ctx.strokeRect(X(0.1),Y(0.1),W-0.2,H-0.2); }
  /* ---- 🔄 BACK skins ---- */
  if(t.skin==='bBrand'){
    const lg0=d.logo?logoImg(d.logo):null;
    let by=0.42;
    if(lg0){ const ls=0.6, ir=lg0.naturalWidth/lg0.naturalHeight;
      let dw=ls,dh=ls; if(ir>1) dh=ls/ir; else dw=ls*ir;
      ctx.drawImage(lg0,X((W-dw)/2),Y(by+(ls-dh)/2),dw,dh); by+=ls+0.1; }
    ctx.textAlign='center';
    setF(ctx,t,13,700); ctx.fillStyle=t.accent; TXT(ctx,d.biz||'',X(W/2),Y(by+0.18)); by+=0.18;
    if(d.tag){ setF(ctx,t,7,400,'italic'); ctx.fillStyle=t.sub; TXT(ctx,d.tag,X(W/2),Y(by+0.14)); by+=0.14; }
    if(d.note){ setF(ctx,t,6.5,600); ctx.fillStyle=t.tx; TXT(ctx,d.note,X(W/2),Y(H-0.14)); }
    return;
  }
  if(t.skin==='bServices'){
    ctx.textAlign='left';
    setF(ctx,t,11,700); ctx.fillStyle=t.accent; TXT(ctx,d.biz||'',X(0.2),Y(0.3));
    ctx.strokeStyle=t.accent; ctx.lineWidth=1/SC;
    ctx.beginPath(); ctx.moveTo(X(0.2),Y(0.42)); ctx.lineTo(X(0.9),Y(0.42)); ctx.stroke();
    setF(ctx,t,7.5,500); ctx.fillStyle=t.tx;
    let sy=0.6;
    String(d.services||'').split('\n').filter(l=>l.trim()).forEach(l=>{
      if(sy>H-0.3) return;
      TXT(ctx,'•  '+l.trim(),X(0.24),Y(sy)); sy+=0.16; });
    if(d.note){ setF(ctx,t,6.5,600,'italic'); ctx.fillStyle=t.sub; ctx.textAlign='center'; TXT(ctx,d.note,X(W/2),Y(H-0.14)); }
    return;
  }
  if(t.skin==='bPlain'){
    const lg1=d.logo?logoImg(d.logo):null;
    ctx.textAlign='center';
    if(lg1){ const ls=0.5, ir=lg1.naturalWidth/lg1.naturalHeight;
      let dw=ls,dh=ls; if(ir>1) dh=ls/ir; else dw=ls*ir;
      ctx.drawImage(lg1,X((W-dw)/2),Y((H-dh)/2-0.08),dw,dh); }
    if(d.biz){ setF(ctx,t,9,700); ctx.fillStyle=t.accent; TXT(ctx,d.biz,X(W/2),Y(H-0.32)); }
    if(d.note){ setF(ctx,t,6,400); ctx.fillStyle=t.sub; TXT(ctx,d.note,X(W/2),Y(H-0.16)); }
    return;
  }
  /* skin */
  if(t.skin==='bar'){ ctx.fillStyle=t.accent; ctx.fillRect(X(0),Y(0),0.14,H); }
  if(t.skin==='bandTop'){ ctx.fillStyle=t.accent; ctx.fillRect(X(0),Y(0),W,0.62); }
  if(t.skin==='bandLeft'){ ctx.fillStyle=t.accent; ctx.fillRect(X(0),Y(0),1.12,H); }
  /* logo */
  const lg=d.logo?logoImg(d.logo):null;
  let logoDrawn=false;
  if(lg){
    let lx,ly,ls;
    if(t.skin==='bandLeft'){ ls=0.72; lx=0.2; ly=(H-ls)/2; }
    else if(C){ ls=0.42; lx=(W-ls)/2; ly=(t.skin==='bandTop')?0.72:0.12; }
    else { ls=0.5; lx=(t.skin==='bar')?0.3:0.17; ly=(t.skin==='bandTop')?0.74:0.15; }
    ctx.save(); ctx.beginPath(); ctx.rect(X(lx),Y(ly),ls,ls); ctx.clip();
    const ir=lg.naturalWidth/lg.naturalHeight;
    let dw=ls,dh=ls; if(ir>1) dh=ls/ir; else dw=ls*ir;
    ctx.drawImage(lg,X(lx+(ls-dw)/2),Y(ly+(ls-dh)/2),dw,dh);
    ctx.restore(); logoDrawn=true;
  }
  /* bandLeft panel में logo न हो तो initials */
  if(t.skin==='bandLeft'&&!logoDrawn&&d.biz){
    const ini=d.biz.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
    setF(ctx,t,26,700); ctx.fillStyle='#ffffff'; ctx.textAlign='center';
    TXT(ctx,ini,X(0.56),Y(1.1));
  }
  ctx.textAlign=C?'center':'left';
  /* content area */
  const pad=(t.skin==='bar')?0.3:0.17;
  const cL=(t.skin==='bandLeft')?1.3:pad, cR=W-pad;
  const cX=C?W/2:cL, cW=cR-cL;
  const bandTxt=t.skin==='bandTop';
  /* biz */
  let y;
  if(bandTxt){
    setF(ctx,t,12,700); ctx.fillStyle='#ffffff';
    ctx.textAlign=C?'center':'left';
    TXT(ctx,d.biz||'',C?W/2:pad,Y(0.28));
    if(d.tag){ setF(ctx,t,6.5,400,'italic'); ctx.fillStyle='#ffffffcc'; TXT(ctx,d.tag,C?W/2:pad,Y(0.47)); }
    y=0.86;
    ctx.textAlign=C?'center':'left';
  } else if(t.skin==='bandLeft'){
    setF(ctx,t,10.5,700); ctx.fillStyle=t.accent;
    TXT(ctx,d.biz||'',cX,Y(0.32));
    y=0.44;
    if(d.tag){ setF(ctx,t,6.2,400,'italic'); ctx.fillStyle=t.sub; TXT(ctx,d.tag,cX,Y(y)); y+=0.14; }
  } else {
    y=(C&&logoDrawn)?0.66:0.33;
    const bx=(!C&&logoDrawn&&t.skin!=='bandLeft')?cL+0.62:cX;
    setF(ctx,t,12,700); ctx.fillStyle=t.accent;
    TXT(ctx,d.biz||'',bx,Y(y));
    if(d.tag){ setF(ctx,t,6.5,400,'italic'); ctx.fillStyle=t.sub; TXT(ctx,d.tag,bx,Y(y+0.13)); }
    y+=0.3;
  }
  /* name + desig */
  setF(ctx,t,11,700); ctx.fillStyle=t.tx;
  TXT(ctx,d.name||'',cX,Y(Math.max(y,(t.skin==='bandTop')?0.86:y)+((t.skin==='bandTop')?0:0.1)));
  let ny=Math.max(y,(t.skin==='bandTop')?0.86:y)+((t.skin==='bandTop')?0:0.1);
  if(d.desig){ setF(ctx,t,7.5,600); ctx.fillStyle=t.skin==='bandLeft'?t.accent:(t.accent);
    TXT(ctx,d.desig,cX,Y(ny+0.15)); ny+=0.15; }
  /* divider */
  ny+=0.12;
  ctx.strokeStyle=t.accent; ctx.lineWidth=1/SC;
  ctx.beginPath();
  if(C){ ctx.moveTo(X(W/2-0.5),Y(ny)); ctx.lineTo(X(W/2+0.5),Y(ny)); }
  else { ctx.moveTo(X(cL),Y(ny)); ctx.lineTo(X(cL+0.7),Y(ny)); }
  ctx.stroke();
  /* details */
  const lines=[];
  if(d.phone) lines.push(d.phone+(d.phone2?'  •  '+d.phone2:''));
  else if(d.phone2) lines.push(d.phone2);
  if(d.email) lines.push(d.email);
  if(d.addr){ setF(ctx,t,6.3,400); wrap(ctx,d.addr,cW).slice(0,2).forEach(l=>lines.push(l)); }
  if(d.web) lines.push(d.web);
  setF(ctx,t,6.3,400); ctx.fillStyle=t.sub;
  let dy=ny+0.13;
  const step=0.115, maxY=H-0.09;
  lines.forEach(l=>{ if(dy>maxY) return; TXT(ctx,l,cX,Y(dy)); dy+=step; });
}

/* ================= 🖨️ SHEET RENDERER (grid + crop marks) ================= */
function sheetGrid(sh){
  const dm=cardDims();
  const cols=Math.floor(sh.w/dm.w), rows=Math.floor(sh.h/dm.h);
  const gx=(sh.w-cols*dm.w)/2, gy=(sh.h-rows*dm.h)/2;
  return { cols, rows, gx, gy };
}
function cropMarks(ctx,ox,oy,w,h){
  ctx.strokeStyle='#9ca3af'; ctx.lineWidth=1.2/SC;
  const g=0.03,l=0.12;
  [[ox,oy,-1,-1],[ox+w,oy,1,-1],[ox,oy+h,-1,1],[ox+w,oy+h,1,1]].forEach(([cx,cy,sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(cx+sx*g,cy); ctx.lineTo(cx+sx*(g+l),cy);
    ctx.moveTo(cx,cy+sy*g); ctx.lineTo(cx,cy+sy*(g+l));
    ctx.stroke();
  });
}
/* side='back' → columns mirror (long-edge flip पर हर back अपने front के ठीक पीछे) */
function renderSheet(scale,sheetKey,side){
  const sh=SHEETS[sheetKey];
  const tid=side==='back'?S.tplBack:S.tplFront;
  const t=TEMPLATES[tid]||TEMPLATES.simple, d=S.data;
  SC=scale;
  const cv=document.createElement('canvas');
  cv.width=Math.round(sh.w*scale); cv.height=Math.round(sh.h*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,sh.w,sh.h);
  const g=sheetGrid(sh), dm=cardDims();
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++){
    const cc=(side==='back')?(g.cols-1-c):c;
    const ox=g.gx+cc*dm.w, oy=g.gy+r*dm.h;
    drawCardInto(ctx,t,d,ox,oy);
    cropMarks(ctx,ox,oy,dm.w,dm.h);
  }
  return cv;
}
function renderCard(scale,side){
  const tid=side?(side==='back'?S.tplBack:S.tplFront):activeTplId();
  const t=TEMPLATES[tid]||TEMPLATES.simple;
  SC=scale;
  const dm=cardDims();
  const cv=document.createElement('canvas');
  cv.width=Math.round(dm.w*scale); cv.height=Math.round(dm.h*scale);
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  drawCardInto(ctx,t,S.data,0,0);
  return cv;
}

/* ================= 🖥️ SCREEN DRAW ================= */
function draw(){
  const st=$('stage'); st.innerHTML='';
  /* दोनों sides के card previews */
  const l1=document.createElement('div'); l1.className='stglab'; l1.textContent=T('stgCard')+'  '+T('sideF'); st.appendChild(l1);
  const cv=renderCard(VIEW_SCALE,'front'); cv.style.maxWidth='92%'; cv.style.height='auto'; st.appendChild(cv);
  const l1b=document.createElement('div'); l1b.className='stglab'; l1b.textContent=T('stgCard')+'  '+T('sideB'); st.appendChild(l1b);
  const cvb=renderCard(VIEW_SCALE,'back'); cvb.style.maxWidth='92%'; cvb.style.height='auto'; st.appendChild(cvb);
  /* दोनों sheets */
  const sh=SHEETS[S.sheet], sc=Math.min(620/sh.w,760/sh.h);
  const l2=document.createElement('div'); l2.className='stglab'; l2.textContent=T('stgSheetF'); st.appendChild(l2);
  const sv=renderSheet(sc,S.sheet,'front'); sv.style.maxWidth='92%'; sv.style.height='auto'; st.appendChild(sv);
  const l2b=document.createElement('div'); l2b.className='stglab'; l2b.textContent=T('stgSheetB'); st.appendChild(l2b);
  const svb=renderSheet(sc,S.sheet,'back'); svb.style.maxWidth='92%'; svb.style.height='auto'; st.appendChild(svb);
}

/* ================= 🧩 SIDEBAR ================= */
function buildForm(){
  const side=$('side');
  side.innerHTML='';
  /* 🔄 Front/Back toggle */
  const hs0=document.createElement('h3'); hs0.textContent=T('tpl'); side.appendChild(hs0);
  const sd=document.createElement('div'); sd.className='tplchip';
  [['front',T('sideF')],['back',T('sideB')]].forEach(([v,lb])=>{
    const b=document.createElement('button'); b.className='sbtn'+(S.side===v?' on':'');
    b.style.flex='1'; b.style.textAlign='center'; b.textContent=lb;
    b.onclick=()=>{ S.side=v; buildForm(); draw(); };
    sd.appendChild(b);
  });
  side.appendChild(sd);
  /* templates */
  const tc=document.createElement('div'); tc.className='tplchip'; tc.id='tplChips'; side.appendChild(tc);
  buildChips();
  /* studio सिर्फ़ front designs के लिए */
  if(S.side==='front'){
    const so=document.createElement('button'); so.className='sbtn'; so.style.cssText='width:100%;margin-top:6px;border:1px dashed #f59e0b;color:#fbbf24';
    so.textContent=T('stOpen'); so.onclick=()=>openStudio(); side.appendChild(so);
  }
  /* logo */
  const hl=document.createElement('h3'); hl.textContent='🖼️ Logo'; side.appendChild(hl);
  const lb=document.createElement('button'); lb.className='sbtn'; lb.id='btnLogo';
  lb.textContent=S.data.logo?T('logoCh'):T('logo');
  lb.onclick=()=>$('fileLogo').click(); side.appendChild(lb);
  if(S.data.logo){ const rb=document.createElement('button'); rb.className='sbtn'; rb.style.color='#fca5a5';
    rb.textContent=T('logoRm'); rb.onclick=()=>{ S.data.logo=null; buildForm(); draw(); }; side.appendChild(rb); }
  /* schema sections */
  (S.side==='back'?SCHEMA_BACK:SCHEMA).forEach(sec=>{
    const h=document.createElement('h3'); h.textContent=(S.ui==='en'&&sec.titleEn)?sec.titleEn:sec.title; side.appendChild(h);
    sec.fields.forEach(f=>{
      const w=document.createElement('div'); w.className='fld';
      const lb2=document.createElement('label'); lb2.textContent=(S.ui==='en'&&f.labEn)?f.labEn:f.lab; w.appendChild(lb2);
      const inp=document.createElement(f.ta?'textarea':'input');
      inp.value=S.data[f.k]||''; inp.placeholder=(S.ui==='en'?(f.phEn||f.ph):(f.ph||f.phEn))||'';
      inp.oninput=()=>{ S.data[f.k]=inp.value; draw(); };
      w.appendChild(inp); side.appendChild(w);
    });
  });
  /* sheet size */
  const hcs=document.createElement('h3'); hcs.textContent=T('csize'); side.appendChild(hcs);
  const csc=document.createElement('div'); csc.className='tplchip';
  Object.keys(CARD_SIZES).forEach(k=>{
    const b=document.createElement('button'); b.className='sbtn'+(S.cardSize===k?' on':'');
    b.style.flex='1'; b.style.textAlign='center'; b.textContent=CARD_SIZES[k].n;
    b.onclick=()=>{ S.cardSize=k; buildForm(); draw(); };
    csc.appendChild(b);
  });
  side.appendChild(csc);
  const hs=document.createElement('h3'); hs.textContent=T('sheet'); side.appendChild(hs);
  const sc=document.createElement('div'); sc.className='tplchip';
  Object.keys(SHEETS).forEach(k=>{
    const sh=SHEETS[k], g=sheetGrid(sh);
    const b=document.createElement('button'); b.className='sbtn'+(S.sheet===k?' on':'');
    b.style.flex='1'; b.style.textAlign='center';
    b.textContent=sh.n+' ('+(g.cols*g.rows)+')';
    b.onclick=()=>{ S.sheet=k; buildForm(); draw(); };
    sc.appendChild(b);
  });
  side.appendChild(sc);
  /* duplex guide */
  const dn=document.createElement('div'); dn.style.cssText='margin-top:8px;padding:8px 10px;background:#1e293b;border:1px solid #475569;border-radius:8px;font-size:11.5px;line-height:1.5;color:#e2e8f0';
  dn.textContent=T('duplexNote'); side.appendChild(dn);
}
function buildChips(){
  const tc=$('tplChips'); if(!tc) return; tc.innerHTML='';
  const isBack=t=>t.skin==='bBrand'||t.skin==='bServices'||t.skin==='bPlain';
  Object.keys(TEMPLATES).forEach(id=>{
    if(id==='_studio') return;
    const t=TEMPLATES[id];
    if(isBack(t)!==(S.side==='back')) return;
    const w=document.createElement('div'); w.className='cchip';
    const b=document.createElement('button'); b.className='sbtn nm'+(activeTplId()===id?' on':'');
    b.textContent=(t.custom?'⭐ ':'')+t.name;
    b.onclick=()=>{ if(STU.open){ openStudio(id); } else { setActiveTpl(id); buildForm(); draw(); } };
    w.appendChild(b);
    if(t.custom){
      const m=document.createElement('div'); m.className='mini';
      const e=document.createElement('button'); e.textContent='✏️'; e.title='edit';
      e.onclick=(ev)=>{ ev.stopPropagation(); openStudio(id); };
      const del=document.createElement('button'); del.textContent='🗑️'; del.title='delete';
      del.onclick=(ev)=>{ ev.stopPropagation(); delete TEMPLATES[id]; persistCustomTpls();
        if(activeTplId()===id) setActiveTpl('simple'); buildForm(); draw(); toast(T('tTplDel')); };
      m.appendChild(e); m.appendChild(del); w.appendChild(m);
    }
    tc.appendChild(w);
  });
}

/* ================= 🎨 DESIGN STUDIO ================= */
const STKEY='vcTplsV1';
function loadCustomTpls(){ try{ const o=JSON.parse(localStorage.getItem(STKEY)||'{}');
  Object.keys(o).forEach(k=>o[k].custom=true); return o; }catch(_){ return {}; } }
function persistCustomTpls(){ const o={};
  Object.entries(TEMPLATES).forEach(([id,t])=>{ if(t.custom) o[id]=t; });
  localStorage.setItem(STKEY, JSON.stringify(o)); }
Object.assign(TEMPLATES, loadCustomTpls());

const STU={ open:false, editId:null, cfg:null };
function studioPreview(){ TEMPLATES._studio=STU.cfg; S.tplFront='_studio'; draw(); }
function openStudio(baseId){
  const base=TEMPLATES[baseId||S.tplFront]||TEMPLATES.simple;
  STU.cfg=JSON.parse(JSON.stringify(base));
  STU.cfg.name=(baseId&&TEMPLATES[baseId].custom)?base.name:'';
  STU.editId=(baseId&&TEMPLATES[baseId].custom)?baseId:null;
  STU.open=true; renderStudio(); studioPreview();
}
function closeStudio(){ STU.open=false; $('studio').style.display='none';
  delete TEMPLATES._studio; if(S.tplFront==='_studio') S.tplFront=STU.editId||'simple';
  buildForm(); draw(); }
function renderStudio(){
  const st=$('studio'); st.style.display='block'; st.innerHTML='';
  const c=STU.cfg;
  const H=(html)=>{ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; };
  st.appendChild(H('<h3>'+T('stTitle')+'<button class="x" id="stX">✖</button></h3>'));
  st.querySelector('#stX').onclick=closeStudio;
  /* नाम */
  const nm=H('<div class="strow"><label>'+T('stName')+'</label><input placeholder="'+T('stNamePh')+'"></div>');
  const nmi=nm.querySelector('input'); nmi.value=c.name||'';
  nmi.oninput=()=>{ c.name=nmi.value; }; st.appendChild(nm);
  /* skin */
  const sk=H('<div class="strow"><label>'+T('stSkin')+'</label><div class="stchips"></div></div>');
  [['plain',T('skPlain')],['bar',T('skBar')],['bandTop',T('skBandTop')],['bandLeft',T('skBandLeft')]].forEach(([v,lb])=>{
    const b=document.createElement('button'); b.className='sbtn'+(c.skin===v?' on':''); b.textContent=lb;
    b.onclick=()=>{ c.skin=v; renderStudio(); studioPreview(); };
    sk.querySelector('.stchips').appendChild(b); });
  st.appendChild(sk);
  /* रंग */
  st.appendChild(H('<h3>'+T('stColors')+'</h3>'));
  [['bg',T('stBg')],['accent',T('stAccent')],['tx',T('stTx')],['sub',T('stSub')]].forEach(([k,lb])=>{
    const r=H('<div class="clrrow"><label>'+lb+'</label><input type="color"></div>');
    const inp=r.querySelector('input'); inp.value=c[k]||'#334155';
    inp.oninput=()=>{ c[k]=inp.value; studioPreview(); };
    st.appendChild(r); });
  /* font */
  const ft=H('<div class="strow"><label>'+T('stFont')+'</label><div class="stchips"></div></div>');
  [[false,T('stSans')],[true,T('stSerif')]].forEach(([v,lb])=>{
    const b=document.createElement('button'); b.className='sbtn'+(!!c.serif===v?' on':''); b.textContent=lb;
    b.onclick=()=>{ c.serif=v; renderStudio(); studioPreview(); };
    ft.querySelector('.stchips').appendChild(b); });
  st.appendChild(ft);
  /* align */
  const al=H('<div class="strow"><label>'+T('stAlign')+'</label><div class="stchips"></div></div>');
  [['left',T('stAL')],['center',T('stAC')]].forEach(([v,lb])=>{
    const b=document.createElement('button'); b.className='sbtn'+(c.align===v?' on':''); b.textContent=lb;
    b.onclick=()=>{ c.align=v; renderStudio(); studioPreview(); };
    al.querySelector('.stchips').appendChild(b); });
  st.appendChild(al);
  /* frame */
  const fr=H('<div class="strow"><label>'+T('stFrame')+'</label><div class="stchips"></div></div>');
  [[true,T('stOn')],[false,T('stOff')]].forEach(([v,lb])=>{
    const b=document.createElement('button'); b.className='sbtn'+(!!c.frame===v?' on':''); b.textContent=lb;
    b.onclick=()=>{ c.frame=v; renderStudio(); studioPreview(); };
    fr.querySelector('.stchips').appendChild(b); });
  st.appendChild(fr);
  /* buttons */
  const bt=H('<div class="stbtns"></div>');
  const mk=(lb,fn)=>{ const b=document.createElement('button'); b.className='sbtn'; b.textContent=lb; b.onclick=fn; bt.appendChild(b); };
  mk(T('stSave'),()=>{
    if(!c.name||!c.name.trim()){ toast(T('tNeedName')); return; }
    const id=STU.editId||('c'+Date.now().toString(36));
    TEMPLATES[id]=Object.assign({},c,{custom:true});
    S.tplFront=id;
    persistCustomTpls(); STU.editId=id;
    buildForm(); draw(); toast(T('tTplSaved'));
  });
  mk(T('stExport'),()=>{
    if(!c.name||!c.name.trim()){ toast(T('tNeedName')); return; }
    dl('design-'+c.name.replace(/\s+/g,'-')+'.json',
       URL.createObjectURL(new Blob([JSON.stringify({app:'sanskriti-vc-tpl',v:1,tpl:c},null,1)],{type:'application/json'})));
  });
  mk(T('stImport'),()=>$('fileTpl').click());
  if(STU.editId) mk(T('stDel'),()=>{ delete TEMPLATES[STU.editId]; persistCustomTpls(); closeStudio(); toast(T('tTplDel')); });
  st.appendChild(bt);
}
$('fileTpl').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    if(o.app!=='sanskriti-vc-tpl'||!o.tpl) throw 0;
    const id='c'+Date.now().toString(36);
    TEMPLATES[id]=Object.assign({},o.tpl,{custom:true});
    persistCustomTpls(); buildForm(); draw(); toast(T('tTplImp'));
  }catch(_){ toast(T('tTplBad')); } };
  rd.readAsText(f);
};

/* ================= 💾 SAVE / LOAD / EXPORT ================= */
function dl(name,url){ const a=document.createElement('a'); a.download=name; a.href=url; a.click(); }
$('btnSave').onclick=()=>{
  const o={app:'sanskriti-visiting-card', v:2, tplFront:S.tplFront, tplBack:S.tplBack, cardSize:S.cardSize, ui:S.ui, sheet:S.sheet, data:S.data};
  dl('card-'+(S.data.biz||S.data.name||'mera').replace(/\s+/g,'-')+'.json',
     URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})));
  toast(T('tSave'));
};
$('btnLoad').onclick=()=>$('fileLoad').click();
$('fileLoad').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    if(o.app!=='sanskriti-visiting-card') throw 0;
    if(o.tpl){ S.tplFront=o.tpl; }                    /* पुरानी v1 file — front design */
    if(o.tplFront) S.tplFront=o.tplFront;
    if(o.tplBack) S.tplBack=o.tplBack;
    if(o.cardSize&&CARD_SIZES[o.cardSize]) S.cardSize=o.cardSize;
    const BACKSK={'bBrand':1,'bServices':1,'bPlain':1};
    if(!TEMPLATES[S.tplFront]||BACKSK[TEMPLATES[S.tplFront].skin]) S.tplFront='simple';
    if(!TEMPLATES[S.tplBack]||!BACKSK[TEMPLATES[S.tplBack].skin]) S.tplBack='bbrand';
    if(o.ui){ S.ui=o.ui; applyLang(); }
    S.sheet=o.sheet&&SHEETS[o.sheet]?o.sheet:'a4';
    S.data=Object.assign(blankCard(),o.data||{});
    buildForm(); draw(); toast(T('tLoad'));
  }catch(_){ toast(T('tBad')); } };
  rd.readAsText(f);
};
$('fileLogo').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  const rd=new FileReader();
  rd.onload=()=>{ S.data.logo=rd.result; buildForm(); draw(); toast(T('tLogo')); };
  rd.readAsDataURL(f);
};
$('btnPng').onclick=()=>{
  dl('visiting-card-'+S.side+'-300dpi.png', renderCard(PRINT_DPI,S.side).toDataURL('image/png'));
  toast(T('tPng'));

$('btnSheetF').onclick=()=>{
  const sh=SHEETS[S.sheet];
  dl('cards-front-'+sh.n.replace('×','x')+'-300dpi.png', renderSheet(PRINT_DPI,S.sheet,'front').toDataURL('image/png'));

$('btnSheetB').onclick=()=>{
  const sh=SHEETS[S.sheet];
  dl('cards-back-'+sh.n.replace('×','x')+'-300dpi.png', renderSheet(PRINT_DPI,S.sheet,'back').toDataURL('image/png'));
  toast(T('tBack'));
};

  S.data={ biz:'CSC Print Cafe', tag:'Printing • Laser • Design', name:'Dev Brolia', desig:'Proprietor',
    phone:'98731 52325', phone2:'', email:'printcafe@gmail.com',
    addr:'Shop No. 12, Connaught Place, New Delhi — 110001', web:'sanskritistore.co.in',

};

  document.documentElement.lang=S.ui;
  $('btnLang').textContent=T('langBtn');
  $('btnSave').textContent=T('save');
  $('btnLoad').textContent=T('load');
  $('btnSample').textContent=T('sample');

$('btnLang').onclick=()=>{ S.ui=(S.ui==='hi')?'en':'hi'; applyLang(); };

/* ================= 🚀 BOOT ================= */
applyLang();
