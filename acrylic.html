<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8E2A32">
<title>संस्कृति — 💎 Acrylic फोटो फ्रेम</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/store.css?v=12"></head><body>
<header id="hd"></header>
<section class="sec wrap">
 <h2>💎 Acrylic फोटो फ्रेम</h2><p class="sub">Acrylic पर सीधे print — चमकदार premium finish ✨ फ्रेम चुनें → अपनी फोटो लगाकर देखें 📸</p>
 <div class="flt" id="flts">
  <button class="chip on" data-f="all">सभी</button>
  <button class="chip" data-f="rect">चौकोर</button>
  <button class="chip" data-f="round">गोल/ओवल</button>
  <button class="chip" data-f="heart">दिल ❤️</button>
 </div>
 <div class="grid" id="list"></div>
</section>
<footer id="ft"></footer>
<style>.edbtn{position:absolute;top:6px;right:6px;z-index:6;background:#fffdf8f0;border:1.5px solid #E3D7C3;border-radius:9px;padding:4px 8px;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}.edbtn:active{transform:scale(.92)}</style>
<script src="assets/js/store.js?v=24"></script>
<script>(async()=>{await loadCfg();await loadCustomFrames();shell('acrylic');
 const arNum=f=>{const p=(''+(f.ar||f.ratio||'')).split(/[\/:]/).map(Number);return p.length===2&&p[1]?p[0]/p[1]:0.75};
 const grp=f=>f.shape==='heart'?'heart':(f.shape==='circle'||f.shape==='oval')?'round':'rect';
 const demos=CFG.frames.demo;const SAMP=CFG.frames.samples||{};
 const demoL=CFG.frames.demoL||[];
 const sampOf=f=>{const L=arNum(f)>1; /* 12-10 Dev: आड़ी window → आड़ी photo, सिर न कटे */
  return (L&&(SAMP[f.shape+'_L']||SAMP.landscape))||SAMP[f.shape]||SAMP[(f.shape||'').startsWith('custom:')?'custom':'default']||demos[0]};
 function card(f,i){
  const d1=f.samp||sampOf(f),d2=f.samp?d1:(arNum(f)>1&&demoL.length?demoL[(i+3)%demoL.length]:demos[(i+3)%demos.length]);
  if(f.draw){const winImgs=f.draw.windows.map((w,wi)=>demos[(i+wi)%demos.length]);
   return `<a class="fcard card" href="preview.html?frame=${f.id}&type=acrylic">
   <div class="frwall"><div class="fr" style="--ar:${arNum(f)};${frDrawBg(f)}">${frDrawHTML(f,winImgs)}${glareHTML(f)}
    <button class="edbtn" data-ed type="button" title="अपनी photo लगाकर देखें">✏️</button></div></div>
   ${f.code?`<span class="fcode">${f.code}</span>`:''}${f.badge?`<span class="badge">${f.badge}</span>`:''}
   <h4>${f.name}</h4><div class="rt">⭐ ${f.rating}</div>
   <div class="from">${fmt(f.base)} से शुरू</div>
   <span class="btn btn-p">अभी बनाएं</span></a>`}
  const win=f.window?`style="left:${f.window.x}%;top:${f.window.y}%;width:${f.window.w}%;height:${f.window.h}%"`:'';
  
  return `<a class="fcard card" href="preview.html?frame=${f.id}&type=acrylic">
   <div class="frwall"><div class="fr shp-${f.shape} ${f.style} ${rtClass(f.ratio)}" style="--ar:${arNum(f)}">${f.img?`<img class="fr-img" src="${f.img}" alt="">`:''}${glareHTML(f)}
    <button class="edbtn" data-ed type="button" title="अपनी photo लगाकर देखें">✏️</button><div class="fr-photo" ${win}>
    <img src="${d1}" data-a="${d1}" data-b="${d2}" alt="${f.name}"></div></div></div>
   ${f.code?`<span class="fcode">${f.code}</span>`:''}${f.badge?`<span class="badge">${f.badge}</span>`:''}
   <h4>${f.name}</h4><div class="rt">⭐ ${f.rating}</div>
   <div class="from">${fmt(f.base)} से शुरू</div>
   <span class="btn btn-p">अभी बनाएं</span></a>`}
 function render(flt){
  const fs=CFG.frames.frames.filter(f=>(!f.ptype||f.ptype==='frame'||f.ptype==='acrylic')&&(flt==='all'||grp(f)===flt)); /* 12-10 Dev: acrylic में सारी frames same */
  $('#list').innerHTML=fs.map((f,i)=>card(f,i)).join('');
  /* 🔄 photo ↔ gray placeholder cycle (Dev 12-10 SS49 जैसा) — photo A → photo B → gray "अपनी फोटो लगाएँ" */
  $$('#list .fr-photo, #list .fr-win').forEach((ph,i)=>{
   const img=ph.querySelector('img');if(!img)return;
   ph.insertAdjacentHTML('beforeend','<div class="pho"><b>📷</b>अपनी फोटो<br>लगाएँ</div>');
   let tk=i%3;
   setInterval(()=>{if(ph.dataset.user)return;tk=(tk+1)%3;
    if(tk===2){ph.classList.add('showph')}
    else{ph.classList.remove('showph');img.src=tk===0?img.dataset.a:img.dataset.b;img.style.opacity=1}
   },2600+i*300);
  });
  /* 🧱 दीवारें — पूरी PLP पर एक साथ, हर 7 सेकंड बदलें (Dev 12-10) */
  const WALLS=CFG.frames.walls||[];
  if(WALLS.length){let wi=0;
   const setW=()=>document.documentElement.style.setProperty('--wallimg',`url('${WALLS[wi]}')`);
   setW();setInterval(()=>{wi=(wi+1)%WALLS.length;
    $$('.frwall').forEach(d=>d.classList.add('wswap'));
    setTimeout(()=>{setW();$$('.frwall').forEach(d=>d.classList.remove('wswap'))},420)},7000)}
  /* ✏️ card पर ही अपनी photo लगाकर देखो (Dev 11-10 — acrylic page editing button) */
  $$('#list [data-ed]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();
   const cardEl=b.closest('.fcard');const ph=cardEl.querySelector('.fr-photo')||cardEl.querySelector('.fr-win');
   const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
   inp.onchange=ev=>{const f2=ev.target.files[0];if(!f2)return;
    const rd=new FileReader();rd.onload=e2=>{const im=ph.querySelector('img');im.src=e2.target.result;im.style.opacity=1;ph.dataset.user='1';toast('आपकी photo लग गई ✅ — अभी बनाएं दबाकर order करें')};rd.readAsDataURL(f2)};
   inp.click()});
 }
 render('all');
 $$('#flts .chip').forEach(c=>c.onclick=()=>{$$('#flts .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');render(c.dataset.f)});
})();</script></body></html>
